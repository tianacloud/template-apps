      APP.confirm('清空语文错题本？', '一共 ' + CNBANK.wrongList().length + ' 道错题会被全部删除，无法恢复。学习进度和星星不受影响。', function () {
        S().progress.cn.wrong = [];
        APP.save(true); APP.toast('语文错题本已清空');
        renderCnWrong(view);
      }, '确定清空');
    };
  }
  function bindCnWrongList(view) {
    $$('[data-credo]', view).forEach(function (el) {
      el.onclick = function () {
        var id = el.dataset.credo;
        var it = CNBANK.wrongList().filter(function (x) { return x.id === id; })[0];
        if (it) cnRedoOne(it, view);
      };
    });
  }
  function refreshCnWrongList(view) {
    var box = $('#cwList', view); if (!box) return;
    box.innerHTML = cnWrongCardsHTML();
    var c = $('#cwCount', view); if (c) c.textContent = CNBANK.wrongList().length;
    bindCnWrongList(view);
  }
  function cnRedoOne(item, view) {
    var host = document.createElement('div');
    host.innerHTML = '<p class="page-sub" style="text-align:center;padding:20px">⏳ 正在加载题目…</p>';
    var mo = APP.modal({ title: '📕 语文错题重做', body: host, actions: [{ label: '关闭', cls: 'ghost' }] });

    CNBANK.wrongQuestion(item, function (q) {
      if (!q) { host.innerHTML = '<p>题目加载失败，可能是断网了。联网后再试试。</p>'; return; }
      host.innerHTML = '<div class="q-title" style="font-size:19px">' + esc(q.q) + '</div>' +
        '<div class="opts"></div><div class="feedback"></div>';
      var optsEl = $('.opts', host), fb = $('.feedback', host), locked = false;
      q.opts.forEach(function (o, i) {
        var b = document.createElement('button');
        b.className = 'opt'; b.textContent = o;
        b.onclick = function () {
          if (locked) return; locked = true;
          var ok = i === q.ans;
          var p = S().progress.cn;
          p.total++; if (ok) p.correct++;
          CNBANK.recordKP(q.kpid, ok);
          if (ok) {
            b.classList.add('right');
            fb.className = 'feedback ok';
            fb.textContent = '答对啦！🧹 已从错题本移出。' + (q.tip ? ' 💡 ' + q.tip : '');
            CNBANK.removeWrong(q.qid);
            p.fixed = (p.fixed || 0) + 1;
            APP.awardStars(2, '订正一道错题', b);
            APP.confetti(18);
            setTimeout(function () { mo.close(); refreshCnWrongList(view); }, 1500);
          } else {
            b.classList.add('wrong');
            $$('.opt', host)[q.ans].classList.add('right');
            fb.className = 'feedback no';
            fb.textContent = '还是不对哦，正确答案是「' + q.opts[q.ans] + '」' + (q.tip ? ' 💡 ' + q.tip : '');
            CNBANK.addWrong(q, { g: item.g, kpName: item.kpName, vol: item.vol });
          }
          APP.save(); APP.checkBadges();
        };
        optsEl.appendChild(b);
      });
    });
  }
  function cnRedoAll(view) {
    var host = $('#cwGame', view);
    host.innerHTML = loadingCard('正在加载错题…');
    CNBANK.preloadWrongGrades(function () {
      var items = shuffle(CNBANK.wrongList()).slice(0, 10);
      var list = [];
      items.forEach(function (it) {
        var kp = CNBANK.kpById(it.kp); if (!kp) return;
        (kp.qs || []).forEach(function (raw) { if (raw.id === it.id) list.push(CNBANK.toQuiz(raw)); });
      });
      if (!list.length) { host.innerHTML = bankFailCard(); return; }
      host.innerHTML = '<div class="card"><h3>🔁 错题重做（' + list.length + ' 题）</h3><div id="cwq"></div></div>';
      makeQuiz($('#cwq', host), {
        total: list.length,
        next: function (i) { return list[i]; },
        onResult: function (ok, q) {
          var p = S().progress.cn;
          p.total++; if (ok) p.correct++;
          CNBANK.recordKP(q.kpid, ok);
          if (ok && CNBANK.removeWrong(q.qid)) { p.fixed = (p.fixed || 0) + 1; APP.awardStars(1, '订正成功'); }
          APP.save(); APP.checkBadges();
          refreshCnWrongList(view);
        },
        onFinish: function (s, t) {
          if (s === t) { APP.awardStars(5, '语文错题全部订正！'); APP.confetti(44); }
          else { APP.toast('没答对的还留在错题本里，再练一遍吧 💪'); }
        }
      });
      try { host.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { }
    });
  }

  /* ================= 4. 数字小分队（人教版真题题库 + 速算 + 错题本） ================= */
  var VOL_ICO = { 1: '📘', 2: '📗' };

  function mathStatLine() {
    var pg = S().progress.math;
    var rate = pg.total ? Math.round(pg.correct / pg.total * 100) : 0;
    return '累计答对 ' + pg.correct + ' 题 · 正确率 ' + rate + '%';
  }
  function loadingCard(txt) {
    return '<div class="card" style="text-align:center;padding:34px">' +
      '<div style="font-size:44px" class="loading-emo">⏳</div>' +
      '<div class="page-sub" style="margin-top:10px">' + esc(txt || '正在加载题库…') + '</div></div>';
  }
  function bankFailCard() {
    return '<div class="card"><h3>😵 题库加载失败</h3>' +
      '<p class="page-sub">可能是网络中断且还没缓存过这个年级。请联网后刷新页面重试；联网打开过一次之后，离线也能用。</p></div>';
  }
  /* 统一处理一道真题的作答结果：总分 / 知识点掌握度 / 错题本 */
  function handleMathResult(ok, q, g, kp) {
    var p = S().progress.math;
    p.total++; if (ok) p.correct++;
    MBANK.recordKP(q.kpid, ok);
    if (ok) {
      if (MBANK.removeWrong(q.qid)) {
        p.fixed = (p.fixed || 0) + 1;
        APP.toast('订正成功，已移出错题本 🧹', 'good');
      }
    } else {
      MBANK.addWrong(q, { g: g, kpName: kp ? kp.name : '', vol: kp ? kp._vol : '' });
    }
    APP.save(); APP.checkBadges();
  }

  APP.registerModule({
    id: 'math', hash: '/数字小分队', name: '数字小分队', short: '数学', icon: '🧮', order: 4,
    desc: '人教版真题 · 知识点闯关',
    render: function (view, params) {
      if (params[0] === 'wrong') { renderWrongBook(view); return; }
      var g = parseInt(params[0], 10); if (!(g >= 1 && g <= 6)) g = 1;
      var kind = params[1], id = params[2];
      if (kind === 'kp' && id) { renderKP(view, g, id); return; }
      if (kind === 'su') { if (id) renderSuDetail(view, g, id); else renderSuList(view, g); return; }
      renderGrade(view, g);
    }
  });

  /* ---------- 年级页：上册 / 下册 知识点清单 ---------- */
  function renderGrade(view, g) {
    var pg = S().progress.math;
    var vols = MBANK.catalog(g);
    var wrongN = MBANK.wrongList().length;
    var m = MBANK.meta();

    var h = head('🧮 数字小分队', mathStatLine() + ' · 题库共 ' + (m.questions || 0) + ' 题');
    h += '<div id="tabsHost"></div>';

    h += '<div class="grid g2">' +
      '<div class="card go-card" data-go="/数字小分队/' + g + '/su" style="background:#FFF6D9">' +
      '<div style="display:flex;align-items:center;gap:12px"><span style="font-size:32px">⚡</span>' +
      '<div><div style="font-weight:900;font-size:18px">速算挑战</div>' +
      '<div class="page-sub">无限随机口算，练手速</div></div></div></div>' +
      '<div class="card go-card" data-go="/数字小分队/wrong" style="background:' + (wrongN ? '#FFE6F0' : '#E6FBF0') + '">' +
      '<div style="display:flex;align-items:center;gap:12px"><span style="font-size:32px">📕</span>' +
      '<div><div style="font-weight:900;font-size:18px">错题本' + (wrongN ? ' · ' + wrongN : '') + '</div>' +
      '<div class="page-sub">' + (wrongN ? '有 ' + wrongN + ' 道题等你订正' : '暂时没有错题，真棒！') + '</div></div></div></div>' +
      '</div>';

    if (!vols.length) {
      h += '<div class="card" style="margin-top:14px"><h3>题库目录未加载</h3><p class="page-sub">请刷新页面重试。</p></div>';
    }
    vols.forEach(function (v) {
      var doneN = 0;
      v.kps.forEach(function (k) { if (MBANK.mastered(k.id)) doneN++; });
      h += '<h2 style="margin-top:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        (VOL_ICO[v.term] || '📘') + ' ' + esc(v.vol) +
        '<span class="pill b">' + v.kps.length + ' 个知识点</span>' +
        '<span class="pill g">🏅 已掌握 ' + doneN + '</span></h2>';
      h += '<div class="grid g2">';
      v.kps.forEach(function (k) {
        var st = (pg.kp || {})[k.id] || { c: 0, t: 0 };
        var rate = st.t ? Math.round(st.c / st.t * 100) : 0;
        var ok = MBANK.mastered(k.id);
        var pct = Math.min(100, Math.round(st.t / Math.max(1, k.n) * 100));
        h += '<div class="card kp-card" data-kp="' + esc(k.id) + '">' +
          '<div style="display:flex;align-items:flex-start;gap:10px">' +
          '<span style="font-size:26px;line-height:1.1">' + (ok ? '🏅' : '🔢') + '</span>' +
          '<div style="font-weight:900;font-size:17px;line-height:1.4">' + esc(k.name) + '</div></div>' +
          '<div class="page-sub" style="margin-top:8px">共 ' + k.n + ' 题' +
          (st.t ? ' · 已练 ' + st.t + ' 题 · 正确率 ' + rate + '%' : ' · 还没练过') + '</div>' +
          '<div class="kp-bar"><i style="width:' + pct + '%"></i></div>' +
          '</div>';
      });
      h += '</div>';
    });

    h += '<div class="note" style="margin-top:18px">📚 数学题库依据<b>人教版小学数学 1-6 年级知识点与公式汇总</b>整理，共 ' +
      (m.knowledgePoints || 0) + ' 个知识点 / ' + (m.questions || 0) + ' 道题，用于课前预习与课后巩固；正式学习请以学校发放的正版教材为准。</div>';

    view.innerHTML = h;
    $('#tabsHost', view).appendChild(gradeTabs(g, function (n) { APP.go('/数字小分队/' + n); }));
    $$('[data-go]', view).forEach(function (el) { el.onclick = function () { APP.go(el.dataset.go); }; });
    $$('[data-kp]', view).forEach(function (el) { el.onclick = function () { APP.go('/数字小分队/' + g + '/kp/' + el.dataset.kp); }; });
  }

  /* ---------- 知识点详情：说明 + 真题闯关 ---------- */
  function renderKP(view, g, kpid) {
    var lite = MBANK.catalogKP(g, kpid);
    var back = '/数字小分队/' + g;
    view.innerHTML = head('🧮 ' + esc(lite ? lite.name : '知识点'), lite ? lite.vol + ' · 共 ' + lite.n + ' 题' : '', back) + loadingCard();
    bindBack(view);

    MBANK.load(g, function (data) {
      if (!data) { view.innerHTML = head('🧮 知识点', '', back) + bankFailCard(); bindBack(view); return; }
      var kp = MBANK.findKP(g, kpid);
      if (!kp) { view.innerHTML = head('🧮 知识点', '', back) + '<div class="card"><h3>没找到这个知识点</h3></div>'; bindBack(view); return; }
      draw(kp);
    });

    function draw(kp) {
      var st = MBANK.kpStat(kp.id);
      var rate = st.t ? Math.round(st.c / st.t * 100) : 0;
      var list = MBANK.drawFrom(kp, 10);

      var h = head('🧮 ' + esc(kp.name), kp._vol + ' · 题库共 ' + kp.qs.length + ' 题', back);
      h += '<div class="card"><h3>📌 知识点说明</h3>' +
        '<p style="font-size:17px;line-height:1.9">' + esc(kp.desc || '') + '</p>' +
        '<div class="btn-row" style="margin-top:10px;align-items:center">' +
        speakBtn(kp.name + '。' + (kp.desc || ''), 'zh-CN', '读一读') +
        '<span class="pill g">已练 ' + st.t + ' 题</span>' +
        '<span class="pill y">正确率 ' + rate + '%</span>' +
        (MBANK.mastered(kp.id) ? '<span class="pill p">🏅 已掌握</span>' : '<span class="pill">练满 8 题且正确率 80% 即掌握</span>') +
        '</div></div>';
      h += '<div class="card" style="margin-top:14px"><h3>🎯 知识点闯关（本轮 ' + list.length + ' 题）</h3><div id="mGame"></div></div>';
      view.innerHTML = h;
      bindBack(view); bindSpeak(view);

      APP.uniqPush(S().progress.math.practiced, kp.id); APP.save();

      makeQuiz($('#mGame', view), {
        total: list.length, backHash: back,
        next: function (i) { return list[i]; },
        onResult: function (ok, q) { handleMathResult(ok, q, g, kp); },
        onFinish: function (s, t) {
          if (t && s >= Math.ceil(t * 0.8)) { APP.awardStars(5, '知识点闯关优秀！'); APP.confetti(34); }
          else { APP.toast('答错的题已收进错题本，记得回去订正哦 📕'); }
        }
      });
    }
  }

  /* ---------- 速算挑战（原程序化题库，无限出题） ---------- */
  function renderSuList(view, g) {
    var list = DATA.mathGrade(g);
    var h = head('⚡ 速算挑战', mathStatLine() + ' · 题目随机生成，练多少都有', '/数字小分队/' + g);
    h += '<div id="tabsHost"></div><div class="grid g2" id="suList"></div>';
    view.innerHTML = h; bindBack(view);
    $('#tabsHost', view).appendChild(gradeTabs(g, function (n) { APP.go('/数字小分队/' + n + '/su'); }));
    var pg = S().progress.math;
    $('#suList', view).innerHTML = list.map(function (x) {
      var done = pg.practiced.indexOf(x.id) >= 0;
      return '<div class="card kp-card" data-id="' + esc(x.id) + '">' +
        '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:26px">' + (done ? '✅' : '⚡') + '</span>' +
        '<div style="font-weight:900;font-size:18px">' + esc(x.name) + '</div></div>' +
        '<div class="page-sub" style="margin-top:8px">' + esc((x.summary || '').slice(0, 42)) + '…</div></div>';
    }).join('');
    $$('[data-id]', view).forEach(function (el) { el.onclick = function () { APP.go('/数字小分队/' + g + '/su/' + el.dataset.id); }; });
  }
  function renderSuDetail(view, g, id) {
    var kp = DATA.mathGrade(g).filter(function (x) { return x.id === id; })[0];
    if (!kp) { renderSuList(view, g); return; }
    var h = head('⚡ ' + esc(kp.name), g + ' 年级 · 速算', '/数字小分队/' + g + '/su');
    h += '<div class="card"><h3>📌 总结重点</h3><p style="font-size:17px;line-height:1.9">' + esc(kp.summary || '') + '</p></div>';
    h += '<div class="card" style="margin-top:14px"><h3>🎲 随机出题（每轮 10 题）</h3><div id="mGame"></div></div>';
    view.innerHTML = h; bindBack(view);
    APP.uniqPush(S().progress.math.practiced, kp.id); APP.save();
    makeQuiz($('#mGame', view), {
      total: 10, backHash: '/数字小分队/' + g + '/su',
      next: function () { return DATA.mathQuestion(kp); },
      onResult: function (ok) { var p = S().progress.math; p.total++; if (ok) p.correct++; APP.save(); APP.checkBadges(); },
      onFinish: function (s) { if (s >= 8) { APP.awardStars(5, '本轮表现优秀！'); APP.confetti(34); } }
    });
  }

  /* ---------- 错题本 ---------- */
  function wrongCardsHTML() {
    var w = MBANK.wrongList().slice().sort(function (a, b) { return (b.n || 1) - (a.n || 1) || b.ts - a.ts; });
    if (!w.length) return '<div class="card" style="text-align:center;padding:26px"><div style="font-size:48px">🎉</div><h3>错题都订正完啦！</h3></div>';
    return '<div class="grid g2">' + w.map(function (it) {
      var q = String(it.q || '');
      return '<div class="card kp-card" data-redo="' + esc(it.id) + '">' +
        '<div style="font-weight:800;font-size:16px;line-height:1.5">' + esc(q.length > 46 ? q.slice(0, 46) + '…' : q) + '</div>' +
        '<div class="page-sub" style="margin-top:8px">' + esc((it.vol || (it.g + ' 年级')) + ' · ' + (it.kpName || '')) + '</div>' +
        '<div class="btn-row" style="margin-top:10px">' +
        '<span class="pill p">错 ' + (it.n || 1) + ' 次</span>' +
        '<span class="pill b">👉 点我重做</span></div></div>';
    }).join('') + '</div>';
  }

  function renderWrongBook(view) {
    var w = MBANK.wrongList();
    var h = head('📕 错题本', '答错的题自动收进来 · 订正答对就移出', '/数字小分队/1');

    if (!w.length) {
      h += '<div class="card" style="text-align:center;padding:36px">' +
        '<div style="font-size:64px">🎉</div><h3 style="margin-top:8px">错题本是空的！</h3>' +
        '<p class="page-sub">继续保持～做错的题会自动收进这里，方便回头再练一遍。</p>' +
        '<div class="btn-row" style="justify-content:center;margin-top:14px">' +
        '<button class="btn primary" data-back="/数字小分队/1">去做题 →</button></div></div>';
      view.innerHTML = h; bindBack(view); return;
    }

    h += '<div class="card"><div class="btn-row">' +
      '<button class="btn primary" id="wAll">🔁 一起重做（' + Math.min(w.length, 10) + ' 题一轮）</button>' +
      '<button class="btn ghost" id="wClear" style="color:#C0392B">🗑️ 清空错题本</button>' +
      '</div><p class="page-sub" style="margin-top:8px">订正答对一道 +2⭐，一轮全对再 +5⭐。</p></div>';
    h += '<div id="wGame"></div>';
    h += '<h2 style="margin-top:20px">📋 错题清单（<span id="wCount">' + w.length + '</span> 道）</h2>';
    h += '<div id="wList">' + wrongCardsHTML() + '</div>';

    view.innerHTML = h;
    bindBack(view);
    bindWrongList(view);

    $('#wAll', view).onclick = function () { redoAll(view); };
    $('#wClear', view).onclick = function () {
      APP.confirm('清空错题本？', '一共 ' + MBANK.wrongList().length + ' 道错题会被全部删除，无法恢复。学习进度和星星不受影响。', function () {
        S().progress.math.wrong = [];
        APP.save(true); APP.toast('错题本已清空');
        renderWrongBook(view);
      }, '确定清空');
    };
  }
  function bindWrongList(view) {
    $$('[data-redo]', view).forEach(function (el) {
      el.onclick = function () {
        var id = el.dataset.redo;
        var it = MBANK.wrongList().filter(function (x) { return x.id === id; })[0];
        if (it) redoOne(it, view);
      };
    });
  }
  function refreshWrongList(view) {
    var box = $('#wList', view); if (!box) return;
    box.innerHTML = wrongCardsHTML();
    var c = $('#wCount', view); if (c) c.textContent = MBANK.wrongList().length;
    bindWrongList(view);
  }

  /* 单题重做（弹窗） */
  function redoOne(item, view) {
    var host = document.createElement('div');
    host.innerHTML = '<p class="page-sub" style="text-align:center;padding:20px">⏳ 正在加载题目…</p>';
    var mo = APP.modal({ title: '📕 错题重做', body: host, actions: [{ label: '关闭', cls: 'ghost' }] });

    MBANK.wrongQuestion(item, function (q) {
      if (!q) { host.innerHTML = '<p>题目加载失败，可能是断网了。联网后再试试。</p>'; return; }
      host.innerHTML = '<div class="q-title" style="font-size:20px">' + esc(q.q) + '</div>' +
        '<div class="opts"></div><div class="feedback"></div>';
      var optsEl = $('.opts', host), fb = $('.feedback', host), locked = false;
      q.opts.forEach(function (o, i) {
        var b = document.createElement('button');
        b.className = 'opt'; b.textContent = o;
        b.onclick = function () {
          if (locked) return; locked = true;
          var ok = i === q.ans;
          var p = S().progress.math;
          p.total++; if (ok) p.correct++;
          MBANK.recordKP(q.kpid, ok);
          if (ok) {
            b.classList.add('right');
            fb.className = 'feedback ok';
            fb.textContent = '答对啦！🧹 已从错题本移出。' + (q.tip ? ' 💡 ' + q.tip : '');
            MBANK.removeWrong(q.qid);
            p.fixed = (p.fixed || 0) + 1;
            APP.awardStars(2, '订正一道错题', b);
            APP.confetti(18);
            setTimeout(function () { mo.close(); refreshWrongList(view); }, 1500);
          } else {
            b.classList.add('wrong');
            $$('.opt', host)[q.ans].classList.add('right');
            fb.className = 'feedback no';
            fb.textContent = '还是不对哦，正确答案是「' + q.opts[q.ans] + '」' + (q.tip ? ' 💡 ' + q.tip : '');
            MBANK.addWrong(q, { g: item.g, kpName: item.kpName, vol: item.vol });
          }
          APP.save(); APP.checkBadges();
        };
        optsEl.appendChild(b);
      });
    });
  }

  /* 批量重做 */
  function redoAll(view) {
    var host = $('#wGame', view);
    host.innerHTML = loadingCard('正在加载错题…');
    MBANK.preloadWrongGrades(function () {
      var items = shuffle(MBANK.wrongList()).slice(0, 10);
      var list = [];
      items.forEach(function (it) {
        var kp = MBANK.kpById(it.kp); if (!kp) return;
        kp.qs.forEach(function (raw) { if (raw.id === it.id) list.push(MBANK.toQuiz(raw)); });
      });
      if (!list.length) { host.innerHTML = bankFailCard(); return; }
      host.innerHTML = '<div class="card"><h3>🔁 错题重做（' + list.length + ' 题）</h3><div id="wq"></div></div>';
      makeQuiz($('#wq', host), {
        total: list.length,
        next: function (i) { return list[i]; },
        onResult: function (ok, q) {
          var p = S().progress.math;
          p.total++; if (ok) p.correct++;
          MBANK.recordKP(q.kpid, ok);
          if (ok && MBANK.removeWrong(q.qid)) { p.fixed = (p.fixed || 0) + 1; APP.awardStars(1, '订正成功'); }
          APP.save(); APP.checkBadges();
          refreshWrongList(view);
        },
        onFinish: function (s, t) {
          if (s === t) { APP.awardStars(5, '错题全部订正！'); APP.confetti(44); }
          else { APP.toast('没答对的还留在错题本里，再练一遍吧 💪'); }
        }
      });
      try { host.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { }
    });
  }

  /* ================= 5. 小小外交官（真题题库驱动） ================= */
  APP.registerModule({
    id: 'english', hash: '/小小外交官', name: '小小外交官', short: '英语', icon: '🗽', order: 5,
    desc: '单词 · 常用表达法 · 谚语 · 不规则动词 · 语音',
    render: function (view, params) {
      var g = parseInt(params[0], 10); if (!(g >= 3 && g <= 6)) g = 3;
      var sub = params[0];

      // 错题本子路由
      if (sub === 'wrong') { renderEnWrong(view, g); return; }

      // 确保题库（年级分片 + 通用分片）已加载
      ENBANK.ensure(g, function () { renderHome(view, g); });

      function renderHome(view, g) {
        var bank = ENBANK.grade(g);
        if (!bank) { view.innerHTML = loadingCard('题库加载失败'); return; }
        var pg = S().progress.english; pg.cats = pg.cats || {}; pg.wrong = pg.wrong || [];
        var cats = ENBANK.catList(g);
        var wrongN = ENBANK.wrongList(g).length;

        var doneN = Object.keys(pg.cats).filter(function (k) { return k !== '_done'; }).length;
        var h = head('🗽 小小外交官', '累计答对 ' + pg.correct + ' 题 · ' + doneN + ' 个分类练过');
        // 自定义年级 tabs（英语 3-6 年级）
        h += '<div class="tabs">' + [3, 4, 5, 6].map(function (n) {
          return '<button class="tab' + (n === g ? ' active' : '') + '" data-g="' + n + '">' + n + ' 年级</button>';
        }).join('') + '</div>';
        h += '<div class="page-sub" style="margin:8px 0 4px">选择一个分类开始闯关 👇</div>';
        h += '<div class="grid g3" id="cats"></div>';
        if (wrongN) h += '<div class="go-card" data-go="/小小外交官/wrong" style="background:#FFE6F0;margin-top:14px"><div style="font-size:30px">📕</div><div><div style="font-weight:900;font-size:18px">英语错题本 · ' + wrongN + '</div><div class="page-sub">有 ' + wrongN + ' 道错题等你订正</div></div></div>';
        h += demoNote();
        view.innerHTML = h;
        bindBack(view);

        $$('[data-g]', view).forEach(function (b) { b.onclick = function () { APP.go('/小小外交官/' + b.dataset.g); }; });
        var host = $('#cats', view);
        var CARDS = [
          { id: 'vocab', ico: '🔤', sub: '单词中英互译' },
          { id: 'phrases', ico: '💬', sub: '常用表达法配对' },
          { id: 'proverbs', ico: '📜', sub: '谚语中英配对' },
          { id: 'irregular', ico: '🔁', sub: '不规则动词变化' },
          { id: 'phonetics', ico: '🔊', sub: '语音拼写规律' },
          { id: 'mixed', ico: '🎲', sub: '混合随机闯关' }
        ];
        host.innerHTML = CARDS.filter(function (c) { return cats.indexOf(c.id) >= 0; }).map(function (c) {
          var n = (bank.cats[c.id] && bank.cats[c.id].items.length) || 0;
          var done = pg.cats[c.id];
          return '<div class="card" data-cat="' + c.id + '" style="cursor:pointer">' +
            '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:26px">' + c.ico + '</span>' +
            '<div style="font-weight:900;font-size:18px">' + c.id.toUpperCase() + '</div>' + (done ? ' <span>✅</span>' : '') + '</div>' +
            '<div class="page-sub" style="margin-top:6px">' + c.sub + ' · ' + n + ' 题</div></div>';
        }).join('');
        $$('[data-cat]', host).forEach(function (el) {
          el.onclick = function () { startQuiz(view, g, el.dataset.cat); };
        });
        bindSpeak(view);
      }

      function startQuiz(view, g, cat) {
        var pg = S().progress.english; pg.cats = pg.cats || {}; pg.wrong = pg.wrong || [];
        var titleMap = { vocab: '单词表', phrases: '常用表达法', proverbs: '谚语', irregular: '不规则动词', phonetics: '语音汇总', mixed: '混合闯关' };
        var h = head('🗽 ' + (titleMap[cat] || cat), g + ' 年级 · 每轮 10 题', '/小小外交官/' + g);
        h += '<div class="card"><div id="eq"></div></div>';
        h += '<div class="page-sub" style="text-align:center;margin-top:10px">点选项作答 · 自动朗读英文 · 答错收进错题本</div>';
        view.innerHTML = h; bindBack(view);
        var total = 10;
        makeQuiz($('#eq', view), {
          total: total, backHash: '/小小外交官/' + g,
          next: function () { return ENBANK.makeQuestion(g, cat); },
          onResult: function (ok, q) {
            var p = S().progress.english; p.total++; if (ok) p.correct++;
            p.cats[cat] = (p.cats[cat] || 0) + 1; p.cats._done = (p.cats._done || 0);
            if (!ok && q) ENBANK.recordWrong(g, cat, q);
            APP.save(); APP.checkBadges();
          },
          onFinish: function (s, t) {
            if (s >= t * 0.8) { APP.awardStars(5, '英语小达人！'); APP.confetti(30); }
            else if (s > 0) { APP.awardStars(2, '继续加油！'); }
          }
        });
      }
    }
  });

  /* 英语错题本 */
  function renderEnWrong(view, g) {
    var pg = S().progress.english; pg.wrong = pg.wrong || [];
    var list = ENBANK.wrongList(g);
    var h = head('📕 英语错题本', g + ' 年级 · 答错的题自动收进来 · 订正答对就移出', '/小小外交官/' + g);
    if (!list.length) {
      h += '<div class="card" style="text-align:center;padding:26px"><div style="font-size:48px">🎉</div><h3>错题都订正完啦！</h3></div>';
      view.innerHTML = h; bindBack(view); return;
    }
    h += '<div style="font-size:64px;text-align:center">📚</div>';
    h += '<div class="card"><h3>🔁 错题重做（' + list.length + ' 道）</h3><div id="ewq"></div></div>';
    view.innerHTML = h; bindBack(view);
    var items = shuffle(list).slice(0, 10);
    makeQuiz($('#ewq', view), {
      total: items.length, backHash: '/小小外交官/' + g,
      next: function () { return ENBANK.questionFromWrong(items.shift()); },
      onResult: function (ok, q) {
        if (ok && q && q.qid) {
          ENBANK.removeWrong(q.qid);
          pg.fixed = (pg.fixed || 0) + 1;
          APP.awardStars(2, '订正一道错题');
        }
        APP.save(); APP.checkBadges();
      },
      onFinish: function (s, t) { if (s >= t * 0.8) { APP.awardStars(3, '错题清光啦！'); APP.confetti(26); } }
    });
  }
  // 把错题渲染接入英语模块的 /wrong 子路由（renderEnWrong 供外部调用）
  APP._renderEnWrong = renderEnWrong;

  /* ================= 6. 逻辑挑战 ================= */
  APP.registerModule({
    id: 'logic', hash: '/逻辑挑战', name: '逻辑挑战', short: '逻辑', icon: '🧩', order: 6,
    desc: '找规律 · 图形 · 排序',
    render: function (view, params) {
      var lv = parseInt(params[0], 10); if (!(lv >= 1 && lv <= 3)) lv = 1;
      var pg = S().progress.logic;
      var names = { 1: '⭐ 初级', 2: '⭐⭐ 中级', 3: '⭐⭐⭐ 高级' };
      var h = head('🧩 逻辑挑战', '最高连对 ' + pg.streakBest + ' 题 · 累计答对 ' + pg.correct + ' 题');
      h += '<div class="tabs">' + [1, 2, 3].map(function (n) { return '<button class="tab' + (n === lv ? ' active' : '') + '" data-lv="' + n + '">' + names[n] + '</button>'; }).join('') + '</div>';
      h += '<div id="lgGame"></div>';
      view.innerHTML = h;
      $$('[data-lv]', view).forEach(function (b) { b.onclick = function () { APP.go('/逻辑挑战/' + b.dataset.lv); }; });

      var bank = DATA.logicSet(lv), bi = 0;
      makeQuiz($('#lgGame', view), {
        total: 6,
        next: function () { if (bi >= bank.length) { bank = DATA.logicSet(lv); bi = 0; } return bank[bi++]; },
        onResult: function (ok, q, streak) {
          var p = S().progress.logic; p.total++;
          if (ok) { p.correct++; p.streakBest = Math.max(p.streakBest, streak); }
          APP.save(); APP.checkBadges();
        },
        onFinish: function (s, t) { if (s >= 5) { APP.awardStars(5, '逻辑高手！'); APP.confetti(32); } }
      });
    }
  });

  /* ================= 7. 闯关冒险 ================= */
  var LEVELS = [
    { n: 1, name: '草地新手村', ico: '🌱', mix: ['letters', 'math1'] },
    { n: 2, name: '数字小溪', ico: '💧', mix: ['math1', 'math2'] },
    { n: 3, name: '拼音森林', ico: '🌳', mix: ['reading', 'letters'] },
    { n: 4, name: '古诗竹林', ico: '🎋', mix: ['poem', 'reading'] },
    { n: 5, name: '英语港口', ico: '⛵', mix: ['english', 'letters'] },
    { n: 6, name: '逻辑迷宫', ico: '🌀', mix: ['logic', 'math3'] },
    { n: 7, name: '数学火山', ico: '🌋', mix: ['math4', 'math5'] },
    { n: 8, name: '智慧城堡', ico: '🏰', mix: ['math6', 'english', 'logic', 'poem'] }
  ];
  function mixQuestion(kind) {
    if (kind === 'letters') {
      var L = DATA.letters(), o = pick(L), others = shuffle(L.filter(function (x) { return x.u !== o.u; })).slice(0, 3);
      var opts = shuffle([o.u].concat(others.map(function (x) { return x.u; })));
      return { q: '「' + o.word + ' ' + o.emoji + '」是哪个字母开头？', opts: opts, ans: opts.indexOf(o.u), tip: o.word + ' = ' + o.zh, speak: o.word, speakLang: 'en-US' };
    }
    if (kind === 'english') {
      var u = pick(DATA.englishGrade(rnd(1, 6))), w = pick(u.words);
      var ot = shuffle(u.words.filter(function (x) { return x.en !== w.en; })).slice(0, 3);
      var op = shuffle([w.zh].concat(ot.map(function (x) { return x.zh; })));
      return { q: '「' + w.en + '」是什么意思？', opts: op, ans: op.indexOf(w.zh), tip: w.e + ' ' + w.en, speak: w.en, speakLang: 'en-US' };
    }
    if (kind === 'poem') {
      var ps = DATA.allPoems(), p = pick(ps), others2 = shuffle(ps.filter(function (x) { return x.id !== p.id; })).slice(0, 3);
      var op2 = shuffle([p.title].concat(others2.map(function (x) { return x.title; })));
      return { q: '「' + p.lines[0].t + '」出自哪首诗？', opts: op2, ans: op2.indexOf(p.title), tip: p.author + '《' + p.title + '》', speak: p.lines[0].t, speakLang: 'zh-CN', autoSpeak: false };
    }
    if (kind === 'reading') {
      var t = pick(DATA.readingGrade(rnd(1, 6)));
      var c = pick(t.chars || [{ c: '春', p: 'chūn', w: '春天' }]);
      var pool = '春草花鸟早书师家秋果梨摘棵浇护校银扇飘落操赛参虽乡缓映捉蚁群搬团静透页翻封梦努希毕即却招戴仿迷'.split('');
      var wr = shuffle(pool.filter(function (x) { return x !== c.c; })).slice(0, 3);
      var op3 = shuffle([c.c].concat(wr));
      return { q: '「' + c.w + '」的「' + c.p + '」是哪个字？', opts: op3, ans: op3.indexOf(c.c), tip: c.w, speak: c.w, speakLang: 'zh-CN' };
    }
    if (kind === 'logic') { var set = DATA.logicSet(rnd(1, 3)); return pick(set); }
    var g = parseInt(kind.replace('math', ''), 10) || 1;
    // 优先出人教版真题（该年级题库已加载时），否则回退到程序化速算题
    if (window.MBANK && MBANK.isLoaded(g)) {
      var real = MBANK.drawGrade(g, 1)[0];
      if (real) return real;
    }
    return DATA.mathQuestion(pick(DATA.mathGrade(g)));
  }

  APP.registerModule({
    id: 'adventure', hash: '/闯关冒险', name: '闯关冒险', short: '闯关', icon: '🗺️', order: 7,
    desc: '跨学科闯关 · 徽章墙',
    render: function (view, params) {
      var lvn = parseInt(params[0], 10);
      var pg = S().progress.adventure;
      if (lvn >= 1 && lvn <= LEVELS.length) { playLevel(view, LEVELS[lvn - 1]); return; }

      var h = head('🗺️ 闯关冒险', '已通关 ' + pg.cleared.length + ' / ' + LEVELS.length + ' 关');
      h += '<div class="grid g3">';
      LEVELS.forEach(function (L) {
        var cleared = pg.cleared.indexOf(L.n) >= 0;
        var unlocked = L.n === 1 || pg.cleared.indexOf(L.n - 1) >= 0;
        h += '<div class="mod-card" data-lv="' + L.n + '" style="background:' + (cleared ? '#E6FBF0' : unlocked ? '#FFF6D9' : '#F0EEF5') + ';' + (unlocked ? '' : 'opacity:.6') + '">' +
          '<div><div class="m-ico">' + (unlocked ? L.ico : '🔒') + '</div><div class="m-name">第 ' + L.n + ' 关 · ' + esc(L.name) + '</div>' +
          '<div class="m-desc">5 道综合题 · 答对 4 题过关 (+5⭐)</div></div>' +
          '<div class="m-desc">' + (cleared ? '✅ 已通关' : unlocked ? '👉 点击开始' : '通过上一关解锁') + '</div></div>';
      });
      h += '</div>';

      h += '<h2 style="margin-top:22px">🏅 成就徽章墙</h2><div class="grid g4">';
      APP.badges.forEach(function (b) {
        var on = S().badges.indexOf(b.id) >= 0;
        h += '<div class="badge' + (on ? ' on' : '') + '"><div class="b-ico">' + b.ico + '</div><div class="b-name">' + esc(b.name) + '</div><div class="b-desc">' + esc(b.desc) + '</div></div>';
      });
      h += '</div>';
      view.innerHTML = h;
      $$('[data-lv]', view).forEach(function (el) {
        el.onclick = function () {
          var n = parseInt(el.dataset.lv, 10);
          var unlocked = n === 1 || S().progress.adventure.cleared.indexOf(n - 1) >= 0;
          if (!unlocked) { APP.toast('先通过第 ' + (n - 1) + ' 关才能解锁哦 🔒', 'warn'); return; }
          APP.go('/闯关冒险/' + n);
        };
      });
    }
  });

  function playLevel(view, L) {
    view.innerHTML = head(L.ico + ' 第 ' + L.n + ' 关 · ' + esc(L.name), '答对 4 题即可通关', '/闯关冒险') + loadingCard('正在准备关卡…');
    bindBack(view);
    // 本关涉及的数学年级先把真题题库拉下来，拉不到就用速算题兜底
    var grades = [];
    L.mix.forEach(function (k) { if (k.indexOf('math') === 0) grades.push(parseInt(k.replace('math', ''), 10)); });
    var left = grades.length;
    if (!left) start(); else grades.forEach(function (g) { MBANK.load(g, function () { if (--left === 0) start(); }); });

    function start() {
      view.innerHTML = head(L.ico + ' 第 ' + L.n + ' 关 · ' + esc(L.name), '答对 4 题即可通关', '/闯关冒险') + '<div id="advGame"></div>';
      bindBack(view);
      makeQuiz($('#advGame', view), {
        total: 5, backHash: '/闯关冒险',
        next: function () { return mixQuestion(pick(L.mix)); },
        onResult: function (ok, q) {
          if (!q || !q.qid) return;                    // 只有真题才计入数学统计与错题本
          var p = S().progress.math;
          p.total++; if (ok) p.correct++;
          MBANK.recordKP(q.kpid, ok);
          if (ok) { if (MBANK.removeWrong(q.qid)) p.fixed = (p.fixed || 0) + 1; }
          else {
            var kp = MBANK.kpById(q.kpid);
            MBANK.addWrong(q, { g: kp ? kp._grade : 0, kpName: kp ? kp.name : '', vol: kp ? kp._vol : '' });
          }
          APP.save();
        },
        onFinish: function (s) {
          var pg = S().progress.adventure;
          pg.best = Math.max(pg.best || 0, s);
          if (s >= 4) {
            var isNew = APP.uniqPush(pg.cleared, L.n);
            pg.level = Math.max(pg.level, L.n + 1);
            APP.save(true);
            if (isNew) { APP.awardStars(5, '通关第 ' + L.n + ' 关！'); APP.confetti(50); APP.speak('恭喜通关', 'zh-CN'); }
            else { APP.awardStars(2, '再次通关'); }
            APP.checkBadges();
          } else { APP.toast('差一点点，再试一次吧！', 'warn'); }
        }
      });
    }
  }

  window.MODULE_HELPERS = { makeQuiz: makeQuiz, head: head, bindBack: bindBack, speakBtn: speakBtn, bindSpeak: bindSpeak, gradeTabs: gradeTabs };
})();
</script>
<script>/* ===== 宝贝升级乐园 · 第 8 模块：宠物养成 pet.js =====
   8 个品种 · Q 版程序化建模（状态覆盖层 + 灵动动画）· 多宠物
   9 大场景（陪伴/房间/客厅/小院子/公园/学校/医院/海边/商店）
   30 种随机事件（伤病→医院/药箱双出口）· 把戏 · 旅行相册 · 房间装饰
*/
(function () {
  'use strict';
  var $ = APP.$, $$ = APP.$$, esc = APP.esc;
  var S = function () { return APP.state; };
  var H = window.MODULE_HELPERS;
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }
  function P() { return APP.activePet(); }
  function PETS() { return S().pets || []; }
  function breedOf(id) { var b = DATA.breeds().filter(function (x) { return x.id === id; })[0]; return b || DATA.breeds()[0]; }
  function stageIdx(level) { return level >= 9 ? 3 : level >= 6 ? 2 : level >= 3 ? 1 : 0; }
  function needExp(level) { return 20 + level * 15; }

  /* ---------- 状态衰减（健康不被动衰减） ---------- */
  function tick(pet) {
    var now = Date.now();
    if (!pet.lastTick) { pet.lastTick = now; return; }
    var hrs = (now - pet.lastTick) / 3600000;
    if (hrs < 0.02) return;
    hrs = Math.min(hrs, 48);
    var slow = (pet.items || []).indexOf('house') >= 0 ? 0.5 : 1;
    var beach = pet.beachUntil && pet.beachUntil > now ? 0.3 : 1;
    pet.hunger = clamp(pet.hunger - hrs * 4);
    pet.clean = clamp(pet.clean - hrs * 3);
    pet.mood = clamp(pet.mood - hrs * 3 * slow * beach);
    pet.lastTick = now;
  }
  function addExp(pet, n) {
    pet.exp = (pet.exp || 0) + n;
    var up = 0;
    while (pet.exp >= needExp(pet.level)) { pet.exp -= needExp(pet.level); pet.level++; up++; }
    return up;
  }

  /* ===================== Q 版小狗建模 ===================== */
  function bandage(x, y, w, h) {
    return '<g class="bandage"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="4" fill="#FFF7F0" stroke="#E8C9B0" stroke-width="1.5"/>' +
      '<line x1="' + (x + w / 2) + '" y1="' + y + '" x2="' + (x + w / 2) + '" y2="' + (y + h) + '" stroke="#FF7E7E" stroke-width="2.4"/>' +
      '<line x1="' + x + '" y1="' + (y + h / 2) + '" x2="' + (x + w) + '" y2="' + (y + h / 2) + '" stroke="#FF7E7E" stroke-width="2.4"/></g>';
  }
  function dogSVG(pet, scene) {
    var b = breedOf(pet.breed), si = stageIdx(pet.level), st = DATA.stages()[si];
    var items = pet.items || [], has = function (id) { return items.indexOf(id) >= 0; };
    var asleep = !!pet.asleep, sick = !!pet.sick, injured = pet.injury, dirty = (pet.clean || 100) < 30, hungry = (pet.hunger || 100) < 30;
    var happy = (pet.mood || 100) > 60 && !sick && !injured && !hungry && !dirty && !asleep;
    var body = b.body, ear = b.ear, light = '#FFFFFF', scale = st.scale;
    var headR = [44, 42, 40, 39][si];
    var bodyRx = [48, 54, 60, 65][si], bodyRy = [35, 38, 41, 44][si];
    var legH = b.short ? 12 : [16, 20, 24, 28][si];
    var s = '';
    var cls = 'pet-svg' + (happy ? ' pet-happy' : asleep ? ' pet-sleep' : (sick || injured || hungry || dirty) ? ' pet-sad' : '');
    s += '<svg class="' + cls + '" viewBox="0 0 260 250" width="260" height="250" role="img" aria-label="' + esc(b.name) + '">';
    s += sceneBackdrop(scene, pet);
    s += '<ellipse cx="132" cy="232" rx="' + (78 * scale) + '" ry="11" fill="rgba(90,70,120,.14)"/>';

    // 尾巴
    if (b.curly) s += '<g class="tail"><circle cx="200" cy="126" r="13" fill="' + body + '"/><circle cx="212" cy="112" r="10" fill="' + body + '"/></g>';
    else s += '<g class="tail"><path d="M188 150 C214 144 222 118 210 104 C222 118 218 150 194 162 Z" fill="' + body + '"/></g>';

    // 后腿 / 前腿
    [168, 188].forEach(function (x) { s += '<rect x="' + x + '" y="' + (170 + bodyRy - 42) + '" width="18" height="' + (legH + 28) + '" rx="9" fill="' + ear + '"/>'; });
    [98, 122].forEach(function (x) { s += '<rect x="' + x + '" y="' + (170 + bodyRy - 42) + '" width="18" height="' + (legH + 28) + '" rx="9" fill="' + body + '"/>'; });
    // 脚垫
    [98, 122, 168, 188].forEach(function (x) { s += '<ellipse cx="' + (x + 9) + '" cy="' + (170 + bodyRy - 42 + legH + 26) + '" rx="9" ry="5" fill="#FFC9C0"/>'; });

    // 身体（带呼吸动画）
    s += '<g class="breathe">';
    s += '<ellipse cx="142" cy="162" rx="' + bodyRx + '" ry="' + bodyRy + '" fill="' + body + '"/>';
    if (b.curly) { s += '<circle cx="114" cy="142" r="16" fill="' + body + '"/><circle cx="152" cy="134" r="15" fill="' + body + '"/><circle cx="174" cy="154" r="14" fill="' + body + '"/>'; }
    s += '<ellipse cx="138" cy="178" rx="' + (bodyRx * .6) + '" ry="' + (bodyRy * .5) + '" fill="' + light + '" opacity=".6"/>';
    // 肚子高光
    s += '<ellipse cx="138" cy="172" rx="' + (bodyRx * .42) + '" ry="' + (bodyRy * .34) + '" fill="#fff" opacity=".22"/>';
    s += '</g>';

    // 小窝 / 玩具球（背景道具）
    if (has('house')) s += '<path d="M16 228 L16 178 L54 150 L92 178 L92 228 Z" fill="#F7C6A0"/><path d="M10 180 L54 146 L98 180" stroke="#E08B57" stroke-width="7" fill="none" stroke-linejoin="round"/><ellipse cx="54" cy="214" rx="20" ry="26" fill="#8B5E3C"/>';
    if (has('ball')) s += '<circle cx="224" cy="216" r="15" fill="#8BE0B0" stroke="#4FB585" stroke-width="3"/><path d="M210 216 h28 M224 202 v28" stroke="#4FB585" stroke-width="3"/>';
    if (has('frisbee')) s += '<ellipse cx="40" cy="220" rx="18" ry="7" fill="#FF9E5E" stroke="#E07B3A" stroke-width="2"/>';

    // 头

  /* ===================== 领养 ===================== */
  function adopt(view, isExtra) {
    var title = isExtra ? '🐶 领养新朋友' : '🐶 领养小宠物';
    var sub = isExtra ? '第二只起需要 50⭐，它会陪你一起长大' : '挑一只喜欢的，它会陪你一起长大';
    var h = H.head(title, sub);
    h += '<div class="note">领养免费！之后的喂食、洗澡、看病要用⭐星星，星星靠学习赚哦～</div>';
    h += '<div class="grid g3" id="breedGrid">';
    DATA.breeds().forEach(function (b) {
      var demo = { breed: b.id, level: 3, exp: 0, hunger: 80, clean: 80, mood: 80, health: 100, items: [], decor: [], tricks: [], album: [], beachUntil: 0, lastTick: Date.now() };
      h += '<div class="card" data-b="' + b.id + '" style="cursor:pointer;text-align:center">' +
        '<div style="transform:scale(.7);transform-origin:center;height:185px;overflow:hidden">' + dogSVG(demo, 'home') + '</div>' +
        '<div style="font-weight:900;font-size:19px">' + esc(b.name) + ' ' + b.emoji + '</div>' +
        '<div><span class="pill p">' + esc(b.trait) + '</span></div>' +
        '<div class="page-sub" style="margin-top:6px">' + esc(b.desc) + '</div>' +
        '<button class="btn primary sm" style="margin-top:10px">选它！</button></div>';
    });
    h += '</div>';
    view.innerHTML = h;
    $$('[data-b]', view).forEach(function (el) {
      el.onclick = function () {
        var b = breedOf(el.dataset.b);

          title: '给' + b.name + '起个名字',
          body: '<p class="page-sub">起好名字就可以带它回家啦！</p><input type="text" id="petName" maxlength="8" value="' + esc(b.name + '宝宝') + '" placeholder="最多 8 个字">',
          actions: [
            { label: '再看看', cls: 'ghost' },
            {
              label: isExtra ? '🏠 花50⭐领养' : '🏠 带回家', cls: 'primary', onClick: function (root) {
                if (isExtra && !APP.spendStars(50, '领养新宠物')) return true;

                var pet = { breed: b.id, name: nm, level: 1, exp: 0, hunger: 70, clean: 70, mood: 80, health: 100, items: [], decor: [], tricks: [], album: [], injured: null, sick: false, cured: 0, adoptedAt: Date.now(), lastTick: Date.now(), lastEvent: 0, lastTreasure: 0, beachUntil: 0, schoolProgress: 0 };
                PETS().push(pet); S().activePet = PETS().length - 1;

  /* ===================== 场景渲染 ===================== */
  function header(view, scene) {
    var stars = '<span class="pill y" style="align-self:center">⭐ ' + S().stars + '</span>';
    var pets = PETS();
    var switcher = '<div class="pet-switch">';
    pets.forEach(function (p, i) {
      var on = i === (S().activePet || 0);
      switcher += '<div class="pet-chip' + (on ? ' on' : '') + '" data-pet="' + i + '" title="' + esc(p.name) + '">' +
        '<div style="transform:scale(.42);transform-origin:center;width:64px;height:64px;margin:-18px 0">' + dogSVG(p, 'home') + '</div>' +
        '<span>' + esc(p.name) + '</span></div>';
    });
    switcher += '<div class="pet-chip add" data-add="1" title="领养新朋友">➕</div></div>';

    var tabs = '<div class="tabs scene-tabs">';
    DATA.petScenes().forEach(function (sc) {
      tabs += '<button class="tab' + (sc.id === scene ? ' active' : '') + '" data-sc="' + sc.id + '">' + sc.ico + (sc.id === 'home' ? ' 陪伴' : sc.name.replace('小', '')) + '</button>';
    });
    tabs += stars + '</div>';
    return switcher + tabs;
  }

  function bindHeader(view, scene) {
    $$('[data-sc]', view).forEach(function (b) { b.onclick = function () { APP.go('/宠物养成/' + b.dataset.sc); }; });
    $$('[data-pet]', view).forEach(function (el) { el.onclick = function () { S().activePet = +el.dataset.pet; APP.route(); }; });
    var add = $('[data-add]', view); if (add) add.onclick = function () { adopt(view, true); };
  }

  function renderScene(view, scene) {
    var p = P();
    var h = H.head('🐶 ' + esc(p.name), breedOf(p.breed).name + ' · ' + DATA.stages()[stageIdx(p.level)].name + ' ' + DATA.stages()[stageIdx(p.level)].emoji + ' · Lv.' + p.level);
    h += header(view, scene);
    view.innerHTML = h;
    bindHeader(view, scene);
    var body = document.createElement('div');
    body.id = 'sceneBody';
    view.appendChild(body);

    if (scene === 'home') sceneHome(body, p);
    else if (scene === 'room') sceneRoom(body, p);
    else if (scene === 'living') sceneLiving(body, p);
    else if (scene === 'yard') sceneYard(body, p);
    else if (scene === 'park') scenePark(body, p);
    else if (scene === 'school') sceneSchool(body, p);
    else if (scene === 'hospital') sceneHospital(body, p);
    else if (scene === 'beach') sceneBeach(body, p);
    else if (scene === 'shop') sceneShop(body, p);

    // 随机事件（除商店/医院外进入时按冷却概率触发）
    if (scene !== 'shop' && scene !== 'hospital' && scene !== 'school') {
      tryEvent(view, scene);
    }
  }

  function stageCard(p) {
    var b = breedOf(p.breed), si = stageIdx(p.level), st = DATA.stages()[si];
    var need = needExp(p.level);
    var warn = [];
    if (p.sick) warn.push('生病了，快去宠物医院 🏥');
    if (p.injury) warn.push('受伤了（' + (p.injury === 'leg' ? '腿' : p.injury === 'paw' ? '爪子' : '头') + '），需要处理 🩹');
    if (!p.sick && !p.injury && p.hunger < 30) warn.push('肚子饿啦，快喂点东西 🥣');
    if (!p.sick && !p.injury && p.clean < 30) warn.push('身上脏兮兮，该洗澡啦 🛁');
    if (!p.sick && !p.injury && p.mood < 30) warn.push('有点无聊，陪我玩会儿 🎾');
    var note = warn.length
      ? '<div class="note" style="margin-top:10px;background:#FFE6F0;border-color:#FF9EC4">' + warn.map(esc).join('<br>') + '</div>'
      : '<div class="note" style="margin-top:10px;background:#EAFBF2;border-color:#8BE0B0">' + esc(p.name) + ' 现在状态不错，正在开心地摇尾巴～</div>';
    var html = '<div class="grid g2" style="align-items:start">';
    html += '<div><div class="pet-stage" id="petStage">' + dogSVG(p, 'home') + '</div>' + note + '</div>';
    html += '<div><div class="card">' +
      statRow('饱食', 'hunger', p.hunger) + statRow('清洁', 'clean', p.clean) +
      statRow('心情', 'mood', p.mood) + statRow('健康', 'health', p.health) +
      statRow('经验', 'exp', Math.round(p.exp / need * 100), p.exp + '/' + need) +
      '<div class="page-sub">成长阶段：' + st.name + '（幼崽 → 幼年 → 少年 → 成年）</div></div>';
    html += '<div class="card" style="margin-top:14px"><h3>🎮 互动</h3><div class="grid g4" style="margin-top:8px">' +
      DATA.petActions().map(function (a) {
        return '<div class="tile" data-act="' + a.id + '"><div style="font-size:26px">' + a.ico + '</div>' +
          '<div style="font-weight:800">' + esc(a.name) + '</div><div class="sm">' + (a.cost ? '⭐ ' + a.cost : '免费') + '</div></div>';
      }).join('') + '</div>' +
      '<p class="page-sub" style="margin-top:10px">有「玩具球/飞盘」陪玩心情更高；「温暖小窝」心情掉得更慢。</p></div>';
    html += '<div class="card" style="margin-top:14px"><h3>🎒 我的物品</h3><div style="font-size:24px;margin-top:6px">' +
      (p.items.length ? p.items.map(function (id) { var it = DATA.shop().filter(function (x) { return x.id === id; })[0]; return it ? '<span title="' + esc(it.name) + '">' + it.ico + '</span> ' : ''; }).join('') : '<span class="page-sub" style="font-size:14px">还没有道具，去商店逛逛吧～</span>') +
      '</div><div class="btn-row" style="margin-top:12px"><button class="btn ghost sm" id="btnRename">✏️ 改名字</button>' +
      '<button class="btn ghost sm" id="btnGoShop">🛒 去商店</button></div></div>';
    html += '</div></div>';
    return html;
  }

  function sceneHome(body, p) {
    body.innerHTML = stageCard(p);
    bindActions(body, p);
    $('#btnGoShop', body).onclick = function () { APP.go('/宠物养成/shop'); };
    $('#btnRename', body).onclick = function () { renameModal(p); };
  }

  function bindActions(root, p) {
    $$('[data-act]', root).forEach(function (el) {
      el.onclick = function () {
        var a = DATA.petActions().filter(function (x) { return x.id === el.dataset.act; })[0];
        if (a.cost > 0 && !APP.spendStars(a.cost, a.name)) return;
        var eff = Object.assign({}, a.effect);
        if (a.id === 'play' && (p.items.indexOf('ball') >= 0 || p.items.indexOf('frisbee') >= 0)) { eff.mood += 8; eff.exp += 4; }
        if (a.id === 'groom' && p.items.indexOf('comb') >= 0) { eff.mood += 2; }
        p.asleep = false;
        var up = applyEffect(p, eff);
        p.lastEvent = p.lastEvent || 0;
        var says = { pet: '汪～好舒服', feed: '呜姆呜姆，真好吃', wash: '哗啦啦，香喷喷', play: '汪汪！再来一次', train: '我学会啦！', groom: '毛毛顺顺的～', water: '咕咚咕咚', walk: '出去玩咯！' };
        APP.toast(p.name + '：' + (says[a.id] || '好耶'), 'good');
        APP.speak(says[a.id] || '好耶', 'zh-CN');
        APP.confetti(12);
        if (up) levelUpMsg(p, up);
        APP.checkBadges(); APP.route();
      };
    });
  }

  function applyEffect(pet, eff) {
    if (eff.hunger) pet.hunger = clamp(pet.hunger + eff.hunger);
    if (eff.clean) pet.clean = clamp(pet.clean + eff.clean);
    if (eff.mood) pet.mood = clamp(pet.mood + eff.mood);
    var up = 0;
    if (eff.exp) up = addExp(pet, eff.exp);
    APP.save();
    return up;
  }

  function renameModal(p) {
    APP.modal({
      title: '给它改个名字', body: '<input type="text" id="rn" maxlength="8" value="' + esc(p.name) + '">',
      actions: [{ label: '取消', cls: 'ghost' }, {
        label: '保存', cls: 'primary', onClick: function (root) {
          var v = ($('#rn', root).value || '').trim(); if (v) { p.name = v; APP.save(true); APP.route(); APP.toast('改好啦 ✅', 'good'); }
        }
      }]
    });
  }

  function levelUpMsg(pet, times) {
    APP.confetti(50);
    APP.modal({
      title: '🎉 升级啦！',
      body: '<div style="text-align:center">' + dogSVG(pet, 'home') + '<h2 style="margin-top:6px">' + esc(pet.name) + ' 升到 Lv.' + pet.level + '</h2>' +
        '<p class="page-sub">当前形态：' + DATA.stages()[stageIdx(pet.level)].name + ' ' + DATA.stages()[stageIdx(pet.level)].emoji + '</p></div>',
      actions: [{ label: '好耶！', cls: 'primary' }]
    });
    APP.speak(pet.name + '升级啦', 'zh-CN');
  }

  /* ---------- 房间 ---------- */
  function sceneRoom(body, p) {
    var decorOn = (p.decor || []).indexOf('bed') >= 0;
    var album = p.album || [];
    var h = '<div class="pet-stage">' + dogSVG(p, 'room') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🛏️ 房间</h3><div class="grid g3" style="margin-top:8px">' +
      tile('sleep', '睡觉', '😴', '免费·恢复') + tile('tidy', '整理', '🧹', '免费·心情+') + tile('album', '相册', '🖼️', album.length + ' 张') + '</div>';
    h += '<p class="page-sub" style="margin-top:8px">' + (decorOn ? '🌟 你买了小床装饰，房间更温馨啦！' : '去商店买「小床装饰」能让房间更漂亮～') + '</p></div>';
    if (album.length) {
      h += '<div class="card" style="margin-top:12px"><h3>🖼️ 旅行相册</h3><div class="page-sub">' + album.map(esc).join(' · ') + '</div></div>';
    }
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 客厅 ---------- */
  function sceneLiving(body, p) {
    var decorOn = (p.decor || []).indexOf('plant') >= 0;
    var h = '<div class="pet-stage">' + dogSVG(p, 'living') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🛋️ 客厅</h3><div class="grid g3" style="margin-top:8px">' +
      tile('sit', '陪坐', '🛋️', '免费·心情+') + tile('tv', '看电视', '📺', '免费·心情+') + tile('feedL', '喂食', '🥣', '⭐5') + '</div>';
    h += '<p class="page-sub" style="margin-top:8px">' + (decorOn ? '🌟 绿植让客厅更有生机！' : '去商店买「绿植」装饰客厅～') + '</p></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 小院子 ---------- */
  function sceneYard(body, p) {
    var decorOn = (p.decor || []).indexOf('swing') >= 0;
    var h = '<div class="pet-stage">' + dogSVG(p, 'yard') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🌿 小院子</h3><div class="grid g3" style="margin-top:8px">' +
      tile('walkY', '遛弯', '🌿', '免费·心情+') + tile('toilet', '上厕所', '🚽', '免费·心情+') + tile('dig', '挖宝藏', '⛏️', '碰碰运气') + '</div>';
    h += '<p class="page-sub" style="margin-top:8px">' + (decorOn ? '🌟 秋千是小院子里的快乐源泉！' : '去商店买「院子秋千」装饰院子～') + '</p></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 公园 ---------- */
  function scenePark(body, p) {
    var h = '<div class="pet-stage">' + dogSVG(p, 'park') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🌳 公园</h3><div class="grid g3" style="margin-top:8px">' +
      tile('walkP', '玩飞盘', '🥏', '免费·心情+') + tile('treasure', '捡宝箱', '🎁', '可能得⭐') + tile('event', '逛一逛', '🔍', '看看惊喜') + '</div>' +
      '<p class="page-sub" style="margin-top:8px">公园是偶遇随机事件的好地方，还能捡到宝箱（每天限一次）。</p></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 宠物学校 ---------- */
  function sceneSchool(body, p) {
    var learned = p.tricks || [];
    var all = DATA.petTricks();
    var h = '<div class="pet-stage">' + dogSVG(p, 'school') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🏫 宠物学校</h3>';
    h += '<div class="page-sub">已学会 ' + learned.length + '/' + all.length + ' 个把戏</div><div style="font-size:26px;margin:6px 0">' +
      (learned.length ? learned.map(function (id) { var t = all.filter(function (x) { return x.id === id; })[0]; return t ? t.ico : ''; }).join(' ') : '🐾 还没学会把戏，去上课吧！') + '</div>';
    h += '<div class="grid g3" style="margin-top:6px">' +
      tile('class', '上课', '📚', '⭐12') + tile('perform', '表演', '🎬', '炫炫才艺') + tile('backhome', '回家', '🏠', '回陪伴') + '</div></div>';
    body.innerHTML = h;
    bindTile(body, p);
  }
  /* ---------- 宠物医院 ---------- */
  function sceneHospital(body, p) {
    var h = '<div class="pet-stage">' + dogSVG(p, 'hospital') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🏥 宠物医院</h3>';
    if (p.sick || p.injury) {
      h += '<div class="note" style="background:#FFE6F0;border-color:#FF9EC4">' + (p.sick ? '它生病了，' : '') + (p.injury ? '它受伤了（' + (p.injury === 'leg' ? '腿' : p.injury === 'paw' ? '爪子' : '头') + '），' : '') + '需要治疗哦。</div>';
      h += '<div class="grid g2" style="margin-top:10px">' +
        '<div class="tile" data-doc="hospital"><div style="font-size:26px">🏥</div><div style="font-weight:800">看医生</div><div class="sm">⭐20 治好</div></div>' +
        '<div class="tile" data-doc="med"><div style="font-size:26px">💊</div><div style="font-weight:800">家庭药箱</div><div class="sm">⭐18 平替</div></div></div>';
    } else {
      h += '<div class="note" style="background:#EAFBF2;border-color:#8BE0B0">' + esc(p.name) + ' 很健康，定期来看看就好～</div>';
    }
    h += '</div>';
    body.innerHTML = h;
    $$('[data-doc]', body).forEach(function (el) {
      el.onclick = function () {
        var kind = el.dataset.doc;
        var cost = kind === 'hospital' ? 20 : 18;
        if (!APP.spendStars(cost, '治疗宠物')) return;
        p.health = 100; p.sick = false; p.injury = null; p.mood = clamp(p.mood + 10);
        p.cured = (p.cured || 0) + 1; S().progress.pet.cured = (S().progress.pet.cured || 0) + 1;
        APP.save(); APP.confetti(24); APP.toast('治好啦，' + p.name + ' 活蹦乱跳！', 'good');
        APP.checkBadges(); APP.route();
      };
    });
  }
  /* ---------- 海边 ---------- */
  function sceneBeach(body, p) {
    var hasTravel = p.items.indexOf('travel') >= 0;
    var onBeach = p.beachUntil && p.beachUntil > Date.now();
    var h = '<div class="pet-stage">' + dogSVG(p, 'beach') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>🏖️ 海边</h3>';
    if (!hasTravel) {
      h += '<div class="note" style="background:#FFF6D9;border-color:#FFD98A">想去海边度假需要先买「旅行包」（商店 🎒）。</div>';
    } else if (onBeach) {
      var left = Math.ceil((p.beachUntil - Date.now()) / 3600000);
      h += '<div class="note" style="background:#E6F7FF;border-color:#8FD3FF">🌴 正在度假中，还有约 ' + left + ' 小时心情恢复超快！</div>';
      h += '<div class="grid g2" style="margin-top:10px">' + tile('postcard', '收明信片', '📮', '心情+') + tile('backhome', '回家', '🏠', '回陪伴') + '</div>';
    } else {
      h += '<div class="note">花 30⭐ 带它去海边度假 48 小时，期间心情衰减大幅变慢，还会收获旅行相册！</div>';
      h += '<div class="grid g2" style="margin-top:10px"><div class="tile" data-go="beach"><div style="font-size:26px">🏖️</div><div style="font-weight:800">去度假</div><div class="sm">⭐30</div></div>' +
        tile('backhome', '回家', '🏠', '回陪伴') + '</div>';
    }
    h += '</div>';
    body.innerHTML = h;
    var go = $('[data-go="beach"]', body); if (go) go.onclick = function () {
      if (!APP.spendStars(30, '海边度假')) return;
      p.beachUntil = Date.now() + 48 * 3600000; p.mood = clamp(p.mood + 20); p.health = clamp(p.health + 10);
      if ((p.album || []).indexOf('海边旅行 🏖️') < 0) p.album.push('海边旅行 🏖️');
      APP.save(); APP.confetti(30); APP.toast(p.name + ' 在海边玩得超开心！', 'good');
      APP.checkBadges(); APP.route();
    };
    bindTile(body, p);
  }
  /* ---------- 商店 ---------- */
  function sceneShop(body, p) {
    var h = '<div class="grid g2" id="shopList"></div>';
    body.innerHTML = h;
    var host = $('#shopList', body);
    host.innerHTML = DATA.shop().map(function (it) {
      var owned = (it.cat === 'item' || it.cat === 'decor') && p.items.indexOf(it.id) >= 0;
      var tag = it.cat === 'medicine' ? '💊 药品' : it.cat === 'decor' ? '🏠 装饰' : it.cat === 'item' ? '✨ 道具' : '🍖 消耗';
      return '<div class="shop-item"><span class="si-ico">' + it.ico + '</span>' +
        '<div class="si-main"><div class="si-name">' + esc(it.name) + ' <span class="pill" style="font-size:11px">' + tag + '</span></div><div class="si-desc">' + esc(it.desc) + '</div></div>' +
        (owned ? '<span class="owned">已拥有</span>' : '<button class="btn yellow sm" data-buy="' + it.id + '">⭐ ' + it.price + '</button>') + '</div>';
    }).join('');
    $$('[data-buy]', host).forEach(function (btn) {
      btn.onclick = function () {
        var it = DATA.shop().filter(function (x) { return x.id === btn.dataset.buy; })[0];
        if (!APP.spendStars(it.price, '买了' + it.name)) return;
        if (it.cat === 'item' || it.cat === 'decor') p.items.push(it.id);
        if (it.cat === 'decor') (p.decor = p.decor || []).push(it.id);
        if (it.effect) applyEffect(p, it.effect);
        APP.confetti(18);
        APP.checkBadges(); APP.route();
      };
    });
  }

  function tile(id, name, ico, sub) { return '<div class="tile" data-tile="' + id + '"><div style="font-size:26px">' + ico + '</div><div style="font-weight:800">' + name + '</div><div class="sm">' + sub + '</div></div>'; }

  function bindTile(root, p) {
    $$('[data-tile]', root).forEach(function (el) {
      el.onclick = function () { doTile(el.dataset.tile, p, root); };
    });
  }

  function doTile(id, p, root) {
    var rerender = true;
    switch (id) {
      case 'sleep': p.asleep = true; p.mood = clamp(p.mood + 18); addExp(p, 2); APP.toast(p.name + ' 睡了个香喷喷的午觉 😴', 'good'); break;
      case 'tidy': p.mood = clamp(p.mood + 5); APP.toast('房间收拾干净啦', 'good'); break;
      case 'album': APP.toast('相册里有 ' + (p.album || []).length + ' 张回忆～', 'good'); rerender = false; break;
      case 'sit': p.mood = clamp(p.mood + 8); APP.toast(p.name + ' 靠着你好安心', 'good'); break;
      case 'tv': p.mood = clamp(p.mood + 10); APP.toast(p.name + ' 看动画笑哈哈', 'good'); break;
      case 'feedL': if (!APP.spendStars(5, '喂食')) return; p.hunger = clamp(p.hunger + 25); addExp(p, 4); APP.toast(p.name + ' 吃饱啦', 'good'); break;
      case 'walkY': case 'walkP': p.mood = clamp(p.mood + 8); addExp(p, 2); APP.toast(p.name + ' 散步超开心 🌿', 'good'); break;
      case 'toilet': p.mood = clamp(p.mood + 10); APP.toast('解决完，轻松多啦', 'good'); break;
      case 'dig': {
        var ev = DATA.petEvents().filter(function (e) { return e.id === 'e30'; })[0];
        showEvent(root.closest('.view') || document, ev); rerender = false; return;
      }
      case 'treasure': {
        var ev2 = DATA.petEvents().filter(function (e) { return e.id === 'e23'; })[0];
        showEvent(root.closest('.view') || document, ev2); rerender = false; return;
      }
      case 'event': tryEvent(root.closest('.view') || document, 'park', true); rerender = false; return;
      case 'class': {
        if (!APP.spendStars(12, '宠物学校上课')) return;
        var ev3 = DATA.petEvents().filter(function (e) { return e.id === 'e26'; })[0];
        showEvent(root.closest('.view') || document, ev3); rerender = false; return;
      }
      case 'perform': {
        if (!(p.tricks || []).length) { APP.toast('还没学会把戏，先去上课吧', 'warn'); rerender = false; break; }
        APP.confetti(28); APP.toast(p.name + ' 表演了 ' + (p.tricks || []).length + ' 个把戏，全场鼓掌！🎬', 'good'); APP.speak(p.name + '表演真棒', 'zh-CN');
        p.mood = clamp(p.mood + 6); break;
      }
      case 'postcard': {
        if ((p.album || []).indexOf('海边旅行 🏖️') < 0) p.album.push('海边旅行 🏖️');
        p.mood = clamp(p.mood + 15); APP.toast('明信片收进相册啦 📮', 'good'); break;
      }
      case 'backhome': APP.go('/宠物养成/home'); return;
      default: rerender = false;
    }
    if (rerender) { APP.save(); APP.checkBadges(); APP.route(); }
  }

  /* ===================== 随机事件 ===================== */
  function tryEvent(view, scene, force) {
    var p = P();
    var now = Date.now();
    if (!force) {
      if (now - (p.lastEvent || 0) < 6 * 3600 * 1000) return;
      if (Math.random() > 0.35) return;
    }
    var pool = DATA.petEvents().filter(function (e) { return !e.manual && (e.cond === 'any' || e.cond === scene); });
    if (!pool.length) { if (force) APP.toast('这一刻风平浪静～', 'good'); return; }
    var ev = pick(pool);
    p.lastEvent = now; APP.save();
    showEvent(view, ev);
  }

  function showEvent(view, ev) {
    var p = P();
    var text = (ev.text || '').replace(/\{n\}/g, p.name);
    var body = '<div style="text-align:center;font-size:46px">' + ev.ico + '</div>' +
      '<h2 style="text-align:center;margin:6px 0">' + esc(ev.title) + '</h2>' +
      '<p class="page-sub" style="text-align:center">' + esc(text) + '</p>' +
      '<div class="grid g2" id="evChoices" style="margin-top:10px"></div>';
    var md = APP.modal({ title: '✨ 随机事件', body: body, actions: [{ label: '稍后再说', cls: 'ghost' }] });
    var host = md.el.querySelector('#evChoices');
    ev.choices.forEach(function (ch) {
      var btn = document.createElement('button');
      btn.className = 'btn ' + (ch.cost ? 'yellow' : 'primary') + ' sm';
      btn.innerHTML = ch.ico + ' ' + esc(ch.label) + (ch.cost ? ' ⭐' + ch.cost : '');
      btn.onclick = function () {
        if (ch.cost && !APP.spendStars(ch.cost, ev.title)) return;
        md.close();
        if (ch.quiz) {
          miniQuiz(p, ch.winEff || {}, ch.loseEff || {}, ch.msg || '搞定！');
        } else {
          applyEventEff(p, ch.eff || {});
          APP.toast((ch.msg || '').replace(/\{n\}/g, p.name), 'good');
          APP.confetti(20);
          APP.checkBadges(); APP.route();
        }
      };
      host.appendChild(btn);
    });
  }

  function applyEventEff(pet, eff) {
    if (eff.hunger) pet.hunger = clamp(pet.hunger + eff.hunger);
    if (eff.clean) pet.clean = clamp(pet.clean + eff.clean);
    if (eff.mood) pet.mood = clamp(pet.mood + eff.mood);
    if (eff.health) pet.health = clamp(pet.health + eff.health);
    if (eff.exp) addExp(pet, eff.exp);
    if (eff.cured) { pet.cured = (pet.cured || 0) + eff.cured; S().progress.pet.cured = (S().progress.pet.cured || 0) + eff.cured; }
    if (eff.injury !== undefined) pet.injury = eff.injury;
    if (eff.sick !== undefined) pet.sick = eff.sick;
    if (eff.beach) pet.beachUntil = Date.now() + 48 * 3600000;
    if (eff.album && (pet.album || []).indexOf(eff.album) < 0) pet.album.push(eff.album);
    if (eff.trick) learnNextTrick(pet);
    if (eff.item && pet.items.indexOf(eff.item) < 0) pet.items.push(eff.item);
    if (eff.gift) grantGift(pet);
    if (eff.treasure) {
      var now = Date.now();
      if (now - (pet.lastTreasure || 0) < 24 * 3600 * 1000) { APP.toast('今天已经捡过宝箱啦～', 'warn'); }
      else { var n = rnd(5, 12); pet.lastTreasure = now; APP.awardStars(n, '公园捡到宝箱'); }
    }
    pet.asleep = false;
    APP.save();
  }

  function learnNextTrick(pet) {
    var learned = pet.tricks || [];
    if (learned.length >= DATA.petTricks().length) return;
    pet.tricks = learned.concat([DATA.petTricks()[learned.length].id]);
  }
  function grantGift(pet) {
    var pool = ['collar', 'hat', 'ball', 'frisbee', 'bone'].filter(function (id) { return pet.items.indexOf(id) < 0; });
    if (pool.length) pet.items.push(pick(pool));
    else pet.mood = clamp(pet.mood + 5);
  }

  /* 迷你学习测验（事件/学校） */
  function makeMiniQuestion() {
    if (Math.random() < 0.5) {
      var a = rnd(2, 9), b = rnd(2, 9), ans = a * b;
      var opts = shuffle([ans, ans + rnd(1, 3), Math.max(1, ans - rnd(1, 3)), ans + rnd(4, 8)]);
      return { q: a + ' × ' + b + ' = ?', opts: opts.map(String), ans: opts.indexOf(ans) };
    }
    var L = [['b', '波'], ['p', '坡'], ['m', '摸'], ['f', '佛'], ['d', '得'], ['t', '特'], ['n', '讷'], ['l', '勒'], ['g', '哥'], ['k', '科'], ['h', '喝']];
    var pl = pick(L);
    var others = shuffle(L.filter(function (x) { return x[0] !== pl[0]; })).slice(0, 3).map(function (x) { return x[0]; });
    var opts2 = shuffle([pl[0]].concat(others));
    return { q: '拼音「' + pl[1] + '」对应哪个字母？', opts: opts2, ans: opts2.indexOf(pl[0]) };
  }
  function miniQuiz(pet, winEff, loseEff, winMsg) {
    var q = makeMiniQuestion();
    var body = '<p class="page-sub">答对就能帮 ' + esc(pet.name) + ' 解决哦～</p>' +
      '<div style="font-size:20px;font-weight:800;margin:10px 0;text-align:center">' + esc(q.q) + '</div>' +
      '<div class="grid g2" id="mq">' + q.opts.map(function (o, i) { return '<button class="btn sm" data-i="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div>';
    var md = APP.modal({ title: '📚 小测验', body: body, actions: [{ label: '稍后再说', cls: 'ghost' }] });
    md.el.querySelectorAll('#mq button').forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.i; md.close();
        if (i === q.ans) { applyEventEff(pet, winEff); APP.toast(winMsg.replace(/\{n\}/g, pet.name), 'good'); APP.confetti(20); }
        else { applyEventEff(pet, loseEff || {}); APP.toast('答错啦，下次加油～', 'warn'); }
        APP.checkBadges(); APP.route();
      };
    });
  }

  function statRow(name, key, val, text) {
    return '<div class="stat-row"><span class="st-name">' + name + '</span>' +
      '<div class="progress bar-' + key + '"><i style="width:' + clamp(val) + '%"></i></div>' +
      '<span class="st-val">' + (text || clamp(val) + '%') + '</span></div>';
  }
})();
</script>

  document.addEventListener('DOMContentLoaded', function () { APP.init(); });
  if (false && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW 注册失败', e); });
    });
  }
</script>
