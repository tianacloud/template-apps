<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>宝贝升级乐园</title>
<meta name="description" content="面向 6-12 岁小朋友的语文 / 数学 / 英语学习乐园，含星星奖励与宠物养成。">
<meta name="theme-color" content="#FF9EC4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宝贝升级乐园">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>/* ===== 宝贝升级乐园 · 样式表 ===== */
:root{
  --pink:#FF9EC4; --blue:#7EC8FF; --yellow:#FFE066; --green:#8BE0B0; --purple:#B79CFF;
  --orange:#FFB27A; --red:#FF7B7B;
  --ink:#3B3355; --ink-2:#6B6486; --line:#EDE7F6;
  --card:#FFFFFF; --bg:#FFF7FB;
  --radius:20px; --radius-lg:26px;
  --shadow:0 6px 18px rgba(120,90,160,.12);
  --shadow-lg:0 12px 30px rgba(120,90,160,.20);
  --topbar-h:60px; --tabbar-h:66px; --side-w:212px;
  --font: "PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei UI Rounded","Microsoft YaHei",
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(circle at 8% 4%, rgba(255,158,196,.30), transparent 42%),
    radial-gradient(circle at 92% 8%, rgba(126,200,255,.30), transparent 40%),
    radial-gradient(circle at 20% 96%, rgba(183,156,255,.26), transparent 45%),
    radial-gradient(circle at 85% 92%, rgba(139,224,176,.26), transparent 42%);
  background-attachment:fixed;
  font-size:16px; line-height:1.6; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit;}
a{color:inherit; text-decoration:none;}
h1,h2,h3,h4{margin:0 0 .4em; line-height:1.25;}
img,svg{display:block;}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; height:calc(var(--topbar-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 10px 0; display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.86); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:2px solid #FFE9F2; z-index:60;
}
.brand{display:flex; align-items:center; gap:8px; min-height:44px; padding:0 4px;}
.brand-text{font-weight:800; font-size:19px; letter-spacing:.5px;
  background:linear-gradient(90deg,#FF6FA5,#B79CFF,#5FB6FF); -webkit-background-clip:text; background-clip:text; color:transparent;}
.top-right{margin-left:auto; display:flex; align-items:center; gap:6px;}
.icon-btn{
  min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center;
  border:none; background:transparent; color:var(--ink-2); border-radius:14px; cursor:pointer;
}
.icon-btn:active{background:#F3ECFF; transform:scale(.94);}
.menu-btn{display:none;}
#btnSpeech .ico-off{display:none;}
body.mute #btnSpeech .ico-on{display:none;}
body.mute #btnSpeech .ico-off{display:block; color:var(--red);}
.star-box{
  display:flex; align-items:center; gap:5px; min-height:40px; padding:0 14px; border-radius:999px;
  background:linear-gradient(135deg,#FFF1B8,#FFE066); color:#8A6300; font-weight:900; font-size:17px;
  box-shadow:0 3px 0 #E8C43B; position:relative;
}
.star-box.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1);}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-5deg)}100%{transform:scale(1)}}
.star-ico{font-size:18px;}

/* ---------- 布局 ---------- */
.body-wrap{display:flex; padding-top:calc(var(--topbar-h) + env(safe-area-inset-top)); min-height:100vh;}
.sidebar{
  width:var(--side-w); flex:0 0 var(--side-w); padding:14px 10px 30px;
  position:fixed; top:calc(var(--topbar-h) + env(safe-area-inset-top)); bottom:0; left:0; overflow-y:auto;
  background:rgba(255,255,255,.72); border-right:2px solid #FFE9F2; z-index:50;
}
.view{
  flex:1 1 auto; margin-left:var(--side-w); padding:18px 20px 40px; max-width:1100px;
  outline:none; animation:fadeIn .28s ease;
}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.tabbar{display:none;}
.scrim{display:none;}

.nav-item{
  display:flex; align-items:center; gap:10px; min-height:48px; padding:6px 12px; margin-bottom:6px;
  border-radius:16px; font-weight:700; color:var(--ink-2); cursor:pointer; border:2px solid transparent;
}
.nav-item .nv-ico{font-size:22px; width:28px; text-align:center;}
.nav-item:hover{background:#fff; color:var(--ink);}
.nav-item.active{background:#fff; color:var(--ink); border-color:var(--pink); box-shadow:var(--shadow);}
.nav-sep{height:1px; background:var(--line); margin:10px 6px;}

/* ---------- 通用组件 ---------- */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; border:2px solid #fff;}
.page-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.page-head h1{font-size:26px; margin:0;}
.page-sub{color:var(--ink-2); font-size:14px;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:800; background:#F3ECFF; color:#6A4FBF;}
.pill.g{background:#E4F8EE; color:#2E8C63;} .pill.b{background:#E6F4FF; color:#2A79B8;}
.pill.y{background:#FFF6D6; color:#96700B;} .pill.p{background:#FFEAF3; color:#C24C81;}

.btn{
  min-height:48px; padding:0 20px; border:none; border-radius:16px; cursor:pointer;
  font-weight:800; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:#fff; color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.08); transition:transform .12s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.08);}
.btn.primary{background:linear-gradient(135deg,#FFB0D2,#FF8FBB); color:#fff; box-shadow:0 4px 0 #E4739F;}
.btn.blue{background:linear-gradient(135deg,#9AD5FF,#66BEFF); color:#fff; box-shadow:0 4px 0 #4C9FDD;}
.btn.green{background:linear-gradient(135deg,#A8ECC8,#6FD6A4); color:#fff; box-shadow:0 4px 0 #4FB585;}
.btn.purple{background:linear-gradient(135deg,#CDBBFF,#A98BFF); color:#fff; box-shadow:0 4px 0 #8A6BE0;}
.btn.yellow{background:linear-gradient(135deg,#FFEFA8,#FFDE55); color:#7A5900; box-shadow:0 4px 0 #DFBE2E;}
.btn.ghost{background:#fff; border:2px solid var(--line);}
.btn.sm{min-height:44px; padding:0 14px; font-size:15px;}
.btn[disabled]{opacity:.5; pointer-events:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

.grid{display:grid; gap:14px;}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));}
.grid.g6{grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:10px;}
.grid.g6 .tile{padding:8px 4px; min-height:auto;}

/* 首页大卡片 */
.home-hero{
  border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:16px; color:#fff;
  background:linear-gradient(120deg,#FF9EC4,#B79CFF 52%,#7EC8FF); box-shadow:var(--shadow-lg);
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.home-hero h1{font-size:26px; margin:0 0 4px; text-shadow:0 2px 6px rgba(0,0,0,.12);}
.home-hero p{margin:0; opacity:.95; font-size:14px;}
.hero-stat{display:flex; gap:10px; margin-left:auto; flex-wrap:wrap;}
.hero-stat div{background:rgba(255,255,255,.24); border-radius:16px; padding:8px 14px; text-align:center; min-width:78px;}
.hero-stat b{display:block; font-size:22px;}
.hero-stat span{font-size:12px; opacity:.95;}

.mod-card{
  position:relative; border-radius:var(--radius-lg); padding:16px; min-height:132px; cursor:pointer;
  color:#4A3F63; border:3px solid #fff; box-shadow:var(--shadow); overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between; transition:transform .18s, box-shadow .18s;
}
.mod-card:hover{transform:translateY(-6px) rotate(-1deg); box-shadow:var(--shadow-lg);}
.mod-card:active{transform:scale(.97);}
.mod-card .m-ico{font-size:38px; line-height:1;}
.mod-card .m-name{font-size:19px; font-weight:900; margin-top:6px;}
.mod-card .m-desc{font-size:12.5px; opacity:.8;}
.mod-card .m-bar{height:8px; border-radius:99px; background:rgba(255,255,255,.6); margin-top:10px; overflow:hidden;}
.mod-card .m-bar i{display:block; height:100%; background:#fff; border-radius:99px;}

/* 通用瓦片（字母、单词、诗、课文等） */
.tile{
  background:#fff; border-radius:var(--radius); padding:14px; text-align:center; cursor:pointer;
  border:3px solid #fff; box-shadow:var(--shadow); min-height:96px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; transition:transform .15s;
}
.tile:hover{transform:translateY(-4px);} .tile:active{transform:scale(.95);}
.tile.done{border-color:var(--green); background:#F3FFF9;}
.tile .big{font-size:34px; font-weight:900; line-height:1.1;}
.tile .sm{font-size:13px; color:var(--ink-2);}
.tile .tick{position:absolute;}

.list-item{
  display:flex; align-items:center; gap:12px; background:#fff; border-radius:18px; padding:12px 14px;
  box-shadow:var(--shadow); margin-bottom:10px; border:2px solid #fff; cursor:pointer; min-height:56px;
}
.list-item:active{transform:scale(.99);}
.list-item .li-ico{font-size:26px;}
.list-item .li-main{flex:1 1 auto; min-width:0;}
.list-item .li-title{font-weight:800;}
.list-item .li-sub{font-size:13px; color:var(--ink-2);}

/* 选项按钮（答题） */
.opts{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); margin-top:14px;}
.opt{
  min-height:60px; border-radius:18px; border:3px solid #EFE7FA; background:#fff; cursor:pointer;
  font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:8px 12px;
  transition:transform .12s;
}
.opt:hover{border-color:var(--purple);} .opt:active{transform:scale(.96);}
.opt.right{background:#E7FBF0; border-color:var(--green); color:#1F7A52; animation:pop .4s;}
.opt.wrong{background:#FFECEC; border-color:var(--red); color:#B33; animation:shake .4s;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.q-card{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:20px; border:3px solid #fff;}
.q-title{font-size:24px; font-weight:900; text-align:center; margin:6px 0 4px; line-height:1.4;}
.q-meta{display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--ink-2); gap:8px; flex-wrap:wrap;}
.feedback{margin-top:14px; padding:12px 14px; border-radius:16px; font-weight:700; display:none;}
.feedback.ok{display:block; background:#E7FBF0; color:#1F7A52;}
.feedback.no{display:block; background:#FFECEC; color:#B33;}

.progress{height:12px; border-radius:99px; background:#F0E9FA; overflow:hidden;}
.progress i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#FFD36E,#FF9EC4);}

/* 拼音 ruby */
.ruby-text{font-size:24px; line-height:2.4; letter-spacing:1px;}
ruby{ruby-align:center; margin:0 1px;}
rt{font-size:.44em; color:#9C88C9; font-weight:600; letter-spacing:0;}
.poem-body{text-align:center;}

/* 配对游戏 */
.match-wrap{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
.match-col{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(64px,1fr));}
.mtile{
  min-height:60px; border-radius:16px; border:3px solid #EFE7FA; background:#fff; font-size:26px; font-weight:900;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.mtile.sel{border-color:var(--purple); background:#F5EFFF; transform:scale(1.05);}
.mtile.done{opacity:.35; pointer-events:none; border-color:var(--green); background:#EAFBF2;}
.mtile.bad{animation:shake .4s;}

/* 徽章 */
.badge{
  text-align:center; padding:14px 8px; border-radius:20px; background:#fff; box-shadow:var(--shadow);
  border:3px solid #fff; filter:grayscale(1); opacity:.55;
}
.badge.on{filter:none; opacity:1; border-color:var(--yellow); animation:pop .5s;}
.badge .b-ico{font-size:34px;} .badge .b-name{font-weight:800; font-size:14px; margin-top:4px;}
.badge .b-desc{font-size:11.5px; color:var(--ink-2);}

/* 宠物 */
.pet-stage{
  border-radius:var(--radius-lg); background:linear-gradient(180deg,#EAF6FF 0%,#F6FFF6 70%,#EAF9EA 100%);
  box-shadow:var(--shadow); padding:10px; position:relative; overflow:hidden; text-align:center;
}
.pet-stage svg{margin:0 auto; max-width:100%; height:auto;}
.pet-svg{animation:petIdle 3.2s ease-in-out infinite; transform-origin:50% 92%;}
@keyframes petIdle{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-1.6deg)}65%{transform:translateY(-2px) rotate(1.6deg)}}
.tail{transform-box:fill-box; transform-origin:8% 92%; animation:wag .7s ease-in-out infinite;}
@keyframes wag{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(20deg)}}
.eyelid{animation:blink 4.6s infinite;}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%,98%{transform:scaleY(1)}}
.stat-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.stat-row .st-name{width:64px; font-weight:800; font-size:14px;}
.stat-row .progress{flex:1;}
.stat-row .st-val{width:44px; text-align:right; font-size:13px; color:var(--ink-2);}
.bar-hunger i{background:linear-gradient(90deg,#FFC46B,#FF9E5E);}
.bar-clean i{background:linear-gradient(90deg,#9AD9FF,#61B8F5);}
.bar-mood i{background:linear-gradient(90deg,#FFAFD3,#FF7FB4);}
.bar-exp i{background:linear-gradient(90deg,#B6E7C9,#68CF98);}
.shop-item{display:flex; align-items:center; gap:10px; background:#fff; border-radius:18px; padding:10px 12px; box-shadow:var(--shadow); border:2px solid #fff;}
.shop-item .si-ico{font-size:28px;}
.shop-item .si-main{flex:1;}
.shop-item .si-name{font-weight:800;}
.shop-item .si-desc{font-size:12px; color:var(--ink-2);}
.owned{color:#2E8C63; font-weight:800; font-size:14px;}

/* 宠物：灵动动画 */
.breathe{transform-box:fill-box; transform-origin:50% 60%; animation:breathe 3.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035,1.02)}}
.pet-happy{animation:petBounce 1.1s ease-in-out infinite;}
@keyframes petBounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-9px) rotate(-2deg)}65%{transform:translateY(-3px) rotate(2deg)}}
.pet-sleep{animation:petSleep 4s ease-in-out infinite;}
@keyframes petSleep{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(2px) scale(1.01,.99)}}
.pet-sad{filter:saturate(.85);}

/* 健康条 */
.bar-health i{background:linear-gradient(90deg,#9BE38B,#54C46E);}

/* 场景标签 */
.scene-tabs{flex-wrap:wrap; row-gap:6px;}

/* 多宠物选择器 */
.pet-switch{display:flex; gap:8px; overflow-x:auto; padding:8px 2px 10px; align-items:center;}
.pet-chip{flex:0 0 auto; width:84px; background:#fff; border:2px solid #fff; border-radius:16px; box-shadow:var(--shadow); text-align:center; cursor:pointer; padding:2px 0 4px; transition:transform .15s;}
.pet-chip.on{border-color:var(--purple); background:#F5EFFF; transform:translateY(-2px);}
.pet-chip span{font-size:12px; font-weight:800; display:block; margin-top:-8px;}
.pet-chip.add{display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--purple); width:48px; border-style:dashed;}
.pet-chip.add:hover{background:#F5EFFF;}

/* Toast / 弹窗 / 特效 */
.toast-layer{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{background:rgba(59,51,85,.94); color:#fff; padding:10px 18px; border-radius:999px; font-weight:700; box-shadow:var(--shadow-lg); animation:toastIn .3s; max-width:88vw; text-align:center;}
.toast.good{background:linear-gradient(135deg,#6FD6A4,#3FB985);}
.toast.warn{background:linear-gradient(135deg,#FFB27A,#FF8E5E);}
@keyframes toastIn{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.fx-layer{position:fixed; inset:0; pointer-events:none; z-index:220; overflow:hidden;}
.fly-star{position:fixed; font-size:26px; font-weight:900; color:#F5A623; text-shadow:0 2px 6px rgba(0,0,0,.18); transition:transform 1s cubic-bezier(.4,-0.2,.5,1), opacity 1s;}
.confetti{position:absolute; width:10px; height:14px; border-radius:3px; animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0); opacity:1}100%{transform:translateY(105vh) rotate(720deg); opacity:.9}}

.modal-mask{position:fixed; inset:0; background:rgba(59,51,85,.42); backdrop-filter:blur(3px); z-index:300; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn .18s;}
.modal{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:100%; max-width:480px; max-height:86vh; overflow:auto; padding:20px; animation:mIn .25s cubic-bezier(.3,1.4,.5,1);}
@keyframes mIn{from{transform:scale(.9); opacity:0}to{transform:none; opacity:1}}
.modal h3{font-size:20px;}
.modal .m-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap;}

textarea,input[type=text],input[type=number],select{
  width:100%; min-height:48px; border:2px solid var(--line); border-radius:14px; padding:10px 14px; font-size:16px; background:#fff;
}
textarea{min-height:150px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; line-height:1.6;}
label.fl{display:block; font-weight:800; margin:12px 0 6px; font-size:14px;}
.note{font-size:12.5px; color:var(--ink-2); background:#FFF8E6; border:2px dashed #FFE08A; border-radius:14px; padding:10px 12px; margin:10px 0;}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.tab{min-height:44px; padding:0 16px; border-radius:999px; border:2px solid #fff; background:#fff; box-shadow:var(--shadow); font-weight:800; cursor:pointer; display:inline-flex; align-items:center;}
.tab.active{background:linear-gradient(135deg,#B79CFF,#8E6BFF); color:#fff; border-color:#fff;}
.empty{text-align:center; color:var(--ink-2); padding:30px 10px;}
.empty .e-ico{font-size:46px;}

/* ---------- 移动端 ---------- */
@media (max-width:767px){
  :root{--topbar-h:56px;}
  .menu-btn{display:inline-flex;}
  .brand-text{display:none;}
  .view{margin-left:0; padding:14px 14px calc(var(--tabbar-h) + 30px + env(safe-area-inset-bottom));}
  .sidebar{
    transform:translateX(-102%); transition:transform .28s ease; width:250px; flex-basis:250px;
    box-shadow:var(--shadow-lg); background:#fff; top:0; padding-top:calc(env(safe-area-inset-top) + 14px); z-index:120;
  }
  body.drawer .sidebar{transform:none;}
  body.drawer .scrim{display:block; position:fixed; inset:0; background:rgba(59,51,85,.4); z-index:110;}
  .tabbar{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:100;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.95); backdrop-filter:blur(10px); border-top:2px solid #FFE9F2;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab-item{
    flex:0 0 auto; min-width:64px; min-height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; font-size:11px; font-weight:700; color:var(--ink-2); border:none; background:transparent; cursor:pointer; padding:4px 6px;
  }
  .tab-item .tb-ico{font-size:23px; line-height:1;}
  .tab-item.active{color:#C24C81;}
  .tab-item.active .tb-ico{transform:scale(1.16);}
  .page-head h1{font-size:22px;}
  .home-hero{padding:16px;}

    html += '<div class="card" style="margin-top:16px">' +
      '<h3>💾 进度备份</h3>' +

    bindBackup(view);
  }
  function bindBackup(root) {
    var be = $('#btnExport', root), bi = $('#btnImport', root), fi = $('#fileImport', root);
    if (be) be.onclick = exportJSON;
    if (bi) bi.onclick = function () { fi.click(); };

  }

  /* ---------- 设置页 ---------- */
  function renderSettings(view) {
    var s = state.settings;
    var html = '<div class="page-head"><h1>⚙️ 设置</h1><span class="page-sub">备份、朗读、内容管理</span></div>';

    html += '<div class="card"><h3>👦 小主人</h3>' +

      '<input type="range" id="inpRate" min="0.6" max="1.2" step="0.1" value="' + (s.rate || 0.9) + '" style="width:100%;min-height:44px">' +
      '<div class="btn-row" style="margin-top:10px">' +
      '<button class="btn ' + (s.speech ? 'green' : 'ghost') + '" id="btnSpk">' + (s.speech ? '🔊 朗读已开启' : '🔇 朗读已关闭') + '</button>' +
      '<button class="btn ghost" id="btnTestSpk">试听一下</button>' +
      '<button class="btn primary" id="btnSaveSet">保存</button>' +

    html += '<div class="card" style="margin-top:14px"><h3>💾 备份与恢复</h3>' +

      '<button class="btn yellow" id="btnExport">📤 导出 JSON 备份</button>' +

      '<input type="file" id="fileImport" accept="application/json,.json" hidden>' +
      '</div>' +

      '<label class="fl">自定义内容 JSON</label>' +

      });
    };
    $('#btnLoadCur', view).onclick = function () { $('#taCustom', view).value = JSON.stringify(state.custom, null, 2); };
    $('#btnSaveCustom', view).onclick = function () {
      var t = $('#taCustom', view).value.trim();
      if (!t) { toast('请先粘贴 JSON 内容', 'warn'); return; }
      var o; try { o = JSON.parse(t); } catch (e) { modal({ title: '保存失败', body: '<p>JSON 格式有误：' + esc(e.message) + '</p>' }); return; }
      if (typeof o !== 'object' || Array.isArray(o)) { modal({ title: '保存失败', body: '<p>顶层必须是对象，包含 reading / poems / english / math 等字段。</p>' }); return; }

      save(true); DATA.clearCache(); toast('自定义内容已保存 ✅', 'good');

    $('#btnClearCustom', view).onclick = function () {

        state.custom = { reading: {}, poems: {}, english: {}, math: {} }; save(true); DATA.clearCache(); $('#taCustom', view).value = ''; toast('已清空自定义内容');

      save(true);
      setTimeout(function () { awardStars(3, '每日登录奖励'); }, 700);

  /* ---------- 初始化 ---------- */
  function init() {
    load();
    document.body.classList.toggle('mute', !state.settings.speech);

    registerModule({ id: 'home', hash: '/首页', name: '首页', short: '首页', icon: '🏠', order: 0, render: renderHome });
    registerModule({ id: 'settings', hash: '/设置', name: '设置', short: '设置', icon: '⚙️', order: 99, render: renderSettings });

    $('#btnMenu').onclick = function () { document.body.classList.toggle('drawer'); };
    $('#scrim').onclick = function () { document.body.classList.remove('drawer'); };
    $('#btnSpeech').onclick = function () {
      state.settings.speech = !state.settings.speech; save(true);
      document.body.classList.toggle('mute', !state.settings.speech);

      if (state.settings.speech) speak('朗读打开啦', 'zh-CN'); else if (window.speechSynthesis) speechSynthesis.cancel();
    };
    window.addEventListener('hashchange', route);
    window.addEventListener('beforeunload', function () { save(true); });

    if (!location.hash) location.hash = '#/首页';
    route();
    dailyLogin();
  }

  /* ---------- 对外接口 ---------- */
  window.APP = {
    init: init, go: go, route: route,
    get state() { return state; },
    save: save, speak: speak, toast: toast, modal: modal, confirm: confirmBox, confetti: confetti,
    activePet: activePet, normalizePet: normalizePet,
    awardStars: awardStars, spendStars: spendStars, checkBadges: checkBadges, renderStars: renderStars,
    registerModule: registerModule, badges: BADGES, modules: function () { return MODULES; },
    $: $, $$: $$, esc: esc, shuffle: shuffle, pick: pick, rnd: rnd, uniqPush: uniqPush,
    exportJSON: exportJSON, bindBackup: bindBackup
  };
})();
</script>

<script>/* ===== 宝贝升级乐园 · 数学真题题库 mathbank.js =====
   人教版小学数学 1-6 年级知识点闯关题库（12 册 / 95 知识点 / 1900 题）
   - 目录 catalog.js 首屏加载（5KB），各年级题库 bank/math-gN.js 按需懒加载
   - 用动态 <script> + window.__MB__ 回调注册，避开 fetch/CORS，file:// 也能跑
   - 同时提供错题本读写
*/
(function () {
  'use strict';

  var CACHE = {};        // { 1: {g:1, vols:[...]} }
  var LOADING = {};      // { 1: [cb, cb] }
  var INDEX = {};        // { '1a-01': {kp, vol, grade} } 扁平索引，便于错题本回查

  /* 题库文件通过这个全局回调注册自己 */
  window.__MB__ = function (g, payload) {
    CACHE[g] = payload;
    (payload.vols || []).forEach(function (v) {
      (v.kps || []).forEach(function (kp) {
        kp._vol = v.vol; kp._term = v.term; kp._grade = g;
        INDEX[kp.id] = kp;
      });
    });
    var qs = LOADING[g] || []; LOADING[g] = null;
    qs.forEach(function (cb) { try { cb(payload); } catch (e) { console.error(e); } });
  };

  /* ---------- 懒加载 ---------- */
  function load(g, cb) {
    g = parseInt(g, 10);
    if (!(g >= 1 && g <= 6)) { cb(null); return; }
    if (CACHE[g]) { cb(CACHE[g]); return; }
    if (LOADING[g]) { LOADING[g].push(cb); return; }
    LOADING[g] = [cb];
    var s = document.createElement('script');
    s.src = 'bank/math-g' + g + '.js';
    s.async = true;
    s.onerror = function () {
      var qs = LOADING[g] || []; LOADING[g] = null;
      console.warn('题库加载失败：年级 ' + g);
      qs.forEach(function (fn) { fn(null); });
    };
    document.head.appendChild(s);
  }
  function isLoaded(g) { return !!CACHE[g]; }
  function grade(g) { return CACHE[g] || null; }

  /* ---------- 目录（首屏可用，不需要加载完整题库） ---------- */
  function catalog(g) {
    var c = window.MATH_BANK_CATALOG;
    if (!c || !c.grades) return [];
    return c.grades[String(g)] || [];
  }
  function meta() {
    var c = window.MATH_BANK_CATALOG;
    return (c && c.meta) || { questions: 0, knowledgePoints: 0 };
  }
  /* 目录里查某知识点属于哪一册、共几题 */
  function catalogKP(g, kpid) {
    var out = null;
    catalog(g).forEach(function (v) {
      v.kps.forEach(function (k) { if (k.id === kpid) out = { vol: v.vol, term: v.term, name: k.name, n: k.n }; });
    });
    return out;
  }

  function kpById(id) { return INDEX[id] || null; }
  function findKP(g, kpid) {
    var d = CACHE[g]; if (!d) return null;
    for (var i = 0; i < d.vols.length; i++) {
      var ks = d.vols[i].kps;
      for (var j = 0; j < ks.length; j++) { if (ks[j].id === kpid) return ks[j]; }
    }
    return null;
  }

  /* ---------- 题目格式转换：题库格式 -> makeQuiz 格式 ---------- */
  /* 题库：{id,q,o:[...],a:idx,e} → 引擎：{q,opts,ans,tip}，选项打乱防背位置 */
  function toQuiz(raw) {
    var right = raw.o[raw.a];
    var opts = APP.shuffle(raw.o);
    return {
      q: raw.q, opts: opts, ans: opts.indexOf(right),
      tip: raw.e || '', qid: raw.id, kpid: raw.id.replace(/-\d+$/, '')
    };
  }

  /* 从一个知识点里抽 n 道不重复的题 */
  function drawFrom(kp, n) {
    var all = (kp && kp.qs) || [];
    return APP.shuffle(all).slice(0, Math.min(n, all.length)).map(toQuiz);
  }
  /* 从整个年级随机抽 n 道（用于闯关冒险 / 混合练习） */
  function drawGrade(g, n) {
    var d = CACHE[g]; if (!d) return [];
    var pool = [];
    d.vols.forEach(function (v) { v.kps.forEach(function (k) { pool = pool.concat(k.qs); }); });
    return APP.shuffle(pool).slice(0, n).map(toQuiz);
  }

  /* ---------- 知识点掌握度（存 progress.math.kp） ---------- */
  function kpStat(kpid) {
    var m = APP.state.progress.math;
    if (!m.kp) m.kp = {};
    if (!m.kp[kpid]) m.kp[kpid] = { c: 0, t: 0 };
    return m.kp[kpid];
  }
  function recordKP(kpid, ok) {
    if (!kpid) return;
    var s = kpStat(kpid);
    s.t++; if (ok) s.c++;
    APP.save();
  }
  /* 掌握判定：做过 ≥8 题且正确率 ≥80% */
  function mastered(kpid) {
    var m = APP.state.progress.math;
    var s = (m.kp || {})[kpid];
    return !!(s && s.t >= 8 && s.c / s.t >= 0.8);
  }

  /* ---------- 错题本 ---------- */
  function wrongList() {
    var m = APP.state.progress.math;
    if (!Array.isArray(m.wrong)) m.wrong = [];
    return m.wrong;
  }
  function addWrong(raw, extra) {
    if (!raw || !raw.qid) return;
    var w = wrongList();
    for (var i = 0; i < w.length; i++) {
      if (w[i].id === raw.qid) { w[i].n = (w[i].n || 1) + 1; w[i].ts = Date.now(); APP.save(); return; }
    }
    w.push({
      id: raw.qid, kp: raw.kpid || '', g: (extra && extra.g) || 0,
      kpName: (extra && extra.kpName) || '', vol: (extra && extra.vol) || '',
      q: raw.q, n: 1, ts: Date.now()
    });
    if (w.length > 300) w.splice(0, w.length - 300);   // 上限保护，避免 localStorage 爆
    APP.save();
  }
  function removeWrong(qid) {
    var w = wrongList();
    for (var i = 0; i < w.length; i++) { if (w[i].id === qid) { w.splice(i, 1); APP.save(); return true; } }
    return false;
  }
  /* 拿到错题的完整题面（需要对应年级题库已加载） */
  function wrongQuestion(item, cb) {
    load(item.g, function () {
      var kp = kpById(item.kp);
      if (!kp) { cb(null); return; }
      var raw = null;
      kp.qs.forEach(function (q) { if (q.id === item.id) raw = q; });
      cb(raw ? toQuiz(raw) : null, kp);
    });
  }
  /* 预加载错题本涉及的所有年级，然后回调 */
  function preloadWrongGrades(cb) {
    var gs = {}; wrongList().forEach(function (w) { if (w.g) gs[w.g] = 1; });
    var keys = Object.keys(gs);
    if (!keys.length) { cb(); return; }
    var left = keys.length;
    keys.forEach(function (g) { load(parseInt(g, 10), function () { if (--left === 0) cb(); }); });
  }

  window.MBANK = {
    load: load, isLoaded: isLoaded, grade: grade,
    catalog: catalog, catalogKP: catalogKP, meta: meta,
    findKP: findKP, kpById: kpById,
    toQuiz: toQuiz, drawFrom: drawFrom, drawGrade: drawGrade,
    kpStat: kpStat, recordKP: recordKP, mastered: mastered,
    wrongList: wrongList, addWrong: addWrong, removeWrong: removeWrong,
    wrongQuestion: wrongQuestion, preloadWrongGrades: preloadWrongGrades
  };
})();
</script>

<script>/* ===== 宝贝升级乐园 · 语文题库 chinabank.js =====
   人教版小学语文 1-6 年级 古诗词 / 文言文 / 日积月累 闯关题库（12 册）
   - 目录 cn-catalog.js 首屏加载；各年级题库 bank/cn-gN.js 按需懒加载
   - 用动态 <script> + window.__CN__ 回调注册，避开 fetch/CORS，file:// 也能跑
   - 诗词/日积月累在注册时展开为 MCQ（接句 / 诗名 / 作者 / 补全），词语表/写字表作听写复习
   - 掌握度与错题本存 progress.cn
*/
(function () {
  'use strict';

  var CACHE = {};        // { 1: {g:1, vols:[...]} }
  var LOADING = {};      // { 1: [cb, cb] }
  var INDEX = {};        // { '1a-p1': {kp, vol, grade} }

  /* 题库文件通过这个全局回调注册自己 */
  window.__CN__ = function (g, payload) {
    // 第一遍：先建立索引并写入缓存（展开题目时要用同年级其它篇目做干扰项）
    (payload.vols || []).forEach(function (v) {
      (v.kps || []).forEach(function (kp) {
        kp._vol = v.vol; kp._term = v.term; kp._grade = g;
        INDEX[kp.id] = kp;
      });
    });
    CACHE[g] = payload;
    // 第二遍：把诗词 / 日积月累展开为选择题
    (payload.vols || []).forEach(function (v) {
      (v.kps || []).forEach(function (kp) {
        if (kp.type === 'poem') expandPoem(kp);
        else if (kp.type === 'accum') expandAccum(kp);
      });
    });
    var qs = LOADING[g] || []; LOADING[g] = null;
    qs.forEach(function (cb) { try { cb(payload); } catch (e) { console.error(e); } });
  };

  /* ---------- 出题：把诗词正文切成「句」 ---------- */
  function sentencesOf(kp) {
    var raw = (kp.lines || []).join(' ');
    return raw.split(/[。！？，]/).map(function (s) { return s.trim(); })
              .filter(function (s) { return s.length >= 2; });
  }

  /* 兜底干扰项：低年级篇目少时补足到 4 选 1 */
  var FB_AUTHORS = ['李白', '杜甫', '白居易', '王维', '孟浩然', '苏轼', '王安石', '杨万里', '陆游',
    '柳宗元', '杜牧', '贺知章', '王之涣', '李商隐', '辛弃疾', '范成大', '曾几', '袁枚'];
  var FB_TITLES = ['静夜思', '春晓', '咏鹅', '悯农', '登鹳雀楼', '望庐山瀑布', '山行', '江雪',
    '池上', '小池', '村居', '所见', '赠汪伦', '早发白帝城', '题西林壁', '游子吟', '望天门山', '饮湖上初晴后雨'];

  function makeDistract(pool, correct, n, fallback) {
    var seen = {}; seen[correct] = 1;
    var cand = [];
    (pool || []).forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; cand.push(x); } });
    var out = [];
    while (out.length < n && cand.length) {
      out.push(cand.splice(Math.floor(Math.random() * cand.length), 1)[0]);
    }
    if (out.length < n && fallback) {
      var fb = fallback.filter(function (x) { return !seen[x]; });
      while (out.length < n && fb.length) {
        var c = fb.splice(Math.floor(Math.random() * fb.length), 1)[0];
        seen[c] = 1; out.push(c);
      }
    }
    return out;
  }

  function expandPoem(kp) {
    var ss = sentencesOf(kp);
    var qs = [];
    // 接句
    for (var i = 0; i < ss.length - 1; i++) {
      var nxt = ss[i + 1];
      qs.push({
        id: kp.id + '-j' + (i + 1),
        q: '《' + kp.name + '》中，上句是「' + ss[i] + '」，下一句是？',
        o: [nxt].concat(makeDistract(ss, nxt, 3)),
        a: 0,
        e: '《' + kp.name + '》' + (kp.dynasty ? '（' + kp.dynasty + '·' + kp.author + '）' : '') + '：' + ss[i] + nxt + '。'
      });
    }
    // 诗名（首句 -> 诗名）
    if (ss.length) {
      qs.push({
        id: kp.id + '-t',
        q: '「' + ss[0] + (ss.length > 1 ? '…' : '') + '」出自哪一首诗？',
        o: [kp.name].concat(makeDistract(poolTitles(kp), kp.name, 3)),
        a: 0,
        e: '出自《' + kp.name + '》' + (kp.dynasty ? '（' + kp.dynasty + '·' + kp.author + '）' : '') + '。'
      });
    }
    // 作者
    qs.push({
      id: kp.id + '-a',
      q: '《' + kp.name + '》的作者是谁？',
      o: [kp.author].concat(makeDistract(poolAuthors(kp), kp.author, 3)),
      a: 0,
      e: '《' + kp.name + '》' + (kp.dynasty ? '是' + kp.dynasty + '代' : '') + kp.author + '的作品。'
    });
    kp.qs = qs;
  }

  function expandAccum(kp) {
    var items = kp.items || [];
    var qs = [];
    var idx = 0;
    items.forEach(function (it) {
      var txt = it.text;
      var c = txt.indexOf('，');
      if (c > 0 && c < txt.length - 1) {
        var before = txt.slice(0, c);
        var after = txt.slice(c + 1);
        if (before.length >= 2 && after.length >= 2) {
          idx++;
          qs.push({
            id: kp.id + '-c' + idx,
            q: '请补全：「' + before + '，」下一句是？',
            o: [after].concat(makeDistract(items.map(function (x) { return x.text; }), after, 3)),
            a: 0,
            e: '完整内容：' + txt + '。'
          });
        }
      }
    });
    kp.qs = qs;
  }

  /* 同年级其它诗词的标题 / 作者池（作干扰项） */
  function gradePoems(g) {
    var d = CACHE[g]; if (!d) return [];
    var res = [];
    d.vols.forEach(function (v) { (v.kps || []).forEach(function (k) { if (k.type === 'poem') res.push(k); }); });
    return res;
  }
  function poolTitles(kp) {
    var seen = {}, out = [];
    gradePoems(kp._grade).forEach(function (k) { if (!seen[k.name]) { seen[k.name] = 1; out.push(k.name); } });
    return out;
  }
  function poolAuthors(kp) {
    var seen = {}, out = [];
    gradePoems(kp._grade).forEach(function (k) { if (!seen[k.author]) { seen[k.author] = 1; out.push(k.author); } });
    return out;
  }

  /* ---------- 懒加载 ---------- */
  function load(g, cb) {
    g = parseInt(g, 10);
    if (!(g >= 1 && g <= 6)) { cb(null); return; }
    if (CACHE[g]) { cb(CACHE[g]); return; }
    if (LOADING[g]) { LOADING[g].push(cb); return; }
    LOADING[g] = [cb];
    var s = document.createElement('script');
    s.src = 'bank/cn-g' + g + '.js';
    s.async = true;
    s.onerror = function () {
      var qs = LOADING[g] || []; LOADING[g] = null;
      console.warn('语文题库加载失败：年级 ' + g);
      qs.forEach(function (fn) { fn(null); });
    };
    document.head.appendChild(s);
  }
  function isLoaded(g) { return !!CACHE[g]; }
  function grade(g) { return CACHE[g] || null; }

  /* ---------- 目录 ---------- */
  function catalog(g) {
    var c = window.CN_BANK_CATALOG;
    if (!c || !c.grades) return [];
    return c.grades[String(g)] || [];
  }
  function meta() {
    var c = window.CN_BANK_CATALOG;
    return (c && c.meta) || { qEstimated: 0, kpTotal: 0 };
  }
  function catalogKP(g, kpid) {
    var out = null;
    catalog(g).forEach(function (v) {
      (v.kps || []).forEach(function (k) { if (k.id === kpid) out = { vol: v.vol, term: v.term, name: k.name, n: k.n }; });
    });
    return out;
  }
  function kpById(id) { return INDEX[id] || null; }
  function findKP(g, kpid) {
    var d = CACHE[g]; if (!d) return null;
    for (var i = 0; i < d.vols.length; i++) {
      var ks = d.vols[i].kps;
      for (var j = 0; j < ks.length; j++) { if (ks[j].id === kpid) return ks[j]; }
    }
    return null;
  }

  /* ---------- 题目转换：题库 -> 引擎格式（选项打乱防背位置） ---------- */
  function toQuiz(raw) {
    var right = raw.o[raw.a];
    var opts = APP.shuffle(raw.o);
    return {
      q: raw.q, opts: opts, ans: opts.indexOf(right),
      tip: raw.e || '', qid: raw.id, kpid: raw.id.replace(/-(j|t|a|c)\d*$/, '')
    };
  }
  function drawFrom(kp, n) {
    var all = (kp && kp.qs) || [];
    if (!all.length) return [];
    return APP.shuffle(all).slice(0, Math.min(n, all.length)).map(toQuiz);
  }
  function drawGrade(g, n) {
    var d = CACHE[g]; if (!d) return [];
    var pool = [];
    d.vols.forEach(function (v) { (v.kps || []).forEach(function (k) { if (k.qs) pool = pool.concat(k.qs); }); });
    return APP.shuffle(pool).slice(0, n).map(toQuiz);
  }

  /* ---------- 掌握度（存 progress.cn.kp） ---------- */
  function kpStat(kpid) {
    var m = APP.state.progress.cn;
    if (!m.kp) m.kp = {};
    if (!m.kp[kpid]) m.kp[kpid] = { c: 0, t: 0 };
    return m.kp[kpid];
  }
  function recordKP(kpid, ok) {
    if (!kpid) return;
    var s = kpStat(kpid);
    s.t++; if (ok) s.c++;
    APP.save();
  }
  function mastered(kpid) {
    var m = APP.state.progress.cn;
    var s = (m.kp || {})[kpid];
    return !!(s && s.t >= 8 && s.c / s.t >= 0.8);
  }

  /* ---------- 错题本 ---------- */
  function wrongList() {
    var m = APP.state.progress.cn;
    if (!Array.isArray(m.wrong)) m.wrong = [];
    return m.wrong;
  }
  function addWrong(raw, extra) {
    if (!raw || !raw.qid) return;
    var w = wrongList();
    for (var i = 0; i < w.length; i++) {
      if (w[i].id === raw.qid) { w[i].n = (w[i].n || 1) + 1; w[i].ts = Date.now(); APP.save(); return; }
    }
    w.push({
      id: raw.qid, kp: raw.kpid || '', g: (extra && extra.g) || 0,
      kpName: (extra && extra.kpName) || '', vol: (extra && extra.vol) || '',
      q: raw.q, n: 1, ts: Date.now()
    });
    if (w.length > 300) w.splice(0, w.length - 300);
    APP.save();
  }
  function removeWrong(qid) {
    var w = wrongList();
    for (var i = 0; i < w.length; i++) { if (w[i].id === qid) { w.splice(i, 1); APP.save(); return true; } }
    return false;
  }
  function wrongQuestion(item, cb) {
    load(item.g, function () {
      var kp = kpById(item.kp);
      if (!kp) { cb(null); return; }
      var raw = null;
      (kp.qs || []).forEach(function (q) { if (q.id === item.id) raw = q; });
      cb(raw ? toQuiz(raw) : null, kp);
    });
  }
  function preloadWrongGrades(cb) {
    var gs = {}; wrongList().forEach(function (w) { if (w.g) gs[w.g] = 1; });
    var keys = Object.keys(gs);
    if (!keys.length) { cb(); return; }
    var left = keys.length;
    keys.forEach(function (g) { load(parseInt(g, 10), function () { if (--left === 0) cb(); }); });
  }

  window.CNBANK = {
    load: load, isLoaded: isLoaded, grade: grade,
    catalog: catalog, catalogKP: catalogKP, meta: meta,
    findKP: findKP, kpById: kpById,
    toQuiz: toQuiz, drawFrom: drawFrom, drawGrade: drawGrade,
    kpStat: kpStat, recordKP: recordKP, mastered: mastered,
    wrongList: wrongList, addWrong: addWrong, removeWrong: removeWrong,
    wrongQuestion: wrongQuestion, preloadWrongGrades: preloadWrongGrades
  };
})();
</script>

<script>/* ===== 宝贝升级乐园 · 英语题库 engbank.js =====
   人教版小学英语 3-6 年级 单词 / 常用表达法 / 谚语 / 不规则动词 / 语音 闯关题库
   - 目录 en-catalog.js 首屏加载；各年级题库 bank/en-gN.js 与通用 bank/en-common.js 按需懒加载
   - 用动态 <script> + window.__EN__ / window.__EN_COMMON__ 回调注册，避开 fetch/CORS，离线也能跑
   - 注册时把通用（不规则动词/语音）并入各年级，并展开为选择题（中英互译 / 配对 / 词形变化 / 语音规律）
   - 掌握度与错题本存 progress.english
*/
(function () {
  'use strict';

  var S = function () { return APP.state; };   // 与 modules.js / pet.js 保持一致

  var CACHE = {};        // { 3: mergedBank, ... }  mergedBank = { g, cats:{vocab,phrases,proverbs,irregular,phonetics}, _base }
  var COMMON = null;     // { irregular:[], phonetics:[] }
  var LOADING = {};      // { 3:[cb], _common:[cb] }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  /* ---------- 分片注册回调 ---------- */
  function mergeCommon(payload) {
    var merged = JSON.parse(JSON.stringify(payload));
    merged.cats = merged.cats || {};
    if (COMMON) {
      if (!merged.cats.irregular) merged.cats.irregular = { name: '不规则动词', items: COMMON.irregular };
      if (!merged.cats.phonetics) merged.cats.phonetics = { name: '语音汇总', items: COMMON.phonetics };
    }
    merged._base = payload;
    return merged;
  }

  window.__EN__ = function (g, payload) {
    var merged = mergeCommon(payload);
    CACHE[g] = merged;
    var cbs = LOADING[g] || []; LOADING[g] = null;
    cbs.forEach(function (cb) { try { cb(merged); } catch (e) { console.error(e); } });
  };

  window.__EN_COMMON__ = function (payload) {
    COMMON = payload;
    for (var g in CACHE) { if (CACHE[g]._base) CACHE[g] = mergeCommon(CACHE[g]._base); }
    var cbs = LOADING._common || []; LOADING._common = null;
    cbs.forEach(function (cb) { try { cb(); } catch (e) { console.error(e); } });
  };

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = function () { cb(); };
    s.onerror = function () { console.error('[engbank] load fail:', src); cb(); };
    document.head.appendChild(s);
  }

  /* 确保某年级分片 + 通用分片都已注册 */
  function ensure(g, cb) {
    var pending = 0;
    var done = function () { if (--pending <= 0) cb(); };
    if (!CACHE[g]) { pending++; loadScript('bank/en-g' + g + '.js', done); }
    if (!COMMON) { pending++; loadScript('bank/en-common.js', done); }
    if (pending === 0) cb();
  }

  /* ---------- 题库访问 ---------- */
  function grade(g) { return CACHE[g] || null; }
  function catalog() { return window.EN_BANK_CATALOG || null; }
  function catList(g) {
    var b = grade(g); if (!b) return [];
    return Object.keys(b.cats).filter(function (k) { return (b.cats[k].items || []).length > 0; });
  }

  /* ---------- 干扰项兜底 ---------- */
  var FALLBACK_ZH = ['苹果', '学校', '老师', '朋友', '红色', '蓝色', '跑步', '阅读', '开心', '书本', '水', '火', '太阳', '月亮', '小猫', '小狗'];
  var FALLBACK_EN = ['apple', 'school', 'teacher', 'friend', 'red', 'blue', 'run', 'read', 'happy', 'book', 'water', 'sun', 'cat', 'dog', 'tree', 'fish'];

  function distractors(pool, correct, n, fallback) {
    var seen = {}; seen[correct] = 1;
    var out = [];
    shuffle(pool).forEach(function (x) { if (!seen[x] && out.length < n) { seen[x] = 1; out.push(x); } });
    var fb = shuffle(fallback || []);
    for (var i = 0; out.length < n && i < fb.length; i++) {
      if (!seen[fb[i]]) { seen[fb[i]] = 1; out.push(fb[i]); }
    }
    return out;
  }

  /* ---------- 出题 ---------- */
  function buildVocab(bank, mode) {
    var items = bank.cats.vocab.items;
    if (!items.length) return null;
    var allZh = items.map(function (x) { return x.m; });
    var allEn = items.map(function (x) { return x.w; });
    var it = pick(items);
    if (mode === 'zh2en') {
      var opts = shuffle([it.w].concat(distractors(allEn, it.w, 3, FALLBACK_EN)));
      return { q: '「' + it.m + '」用英语怎么说？', opts: opts, ans: opts.indexOf(it.w),
               tip: (it.p || '') + ' ' + it.w, speak: it.w, speakLang: 'en-US' };
    }
    var opts2 = shuffle([it.m].concat(distractors(allZh, it.m, 3, FALLBACK_ZH)));
    return { q: '「' + it.w + '」是什么意思？', opts: opts2, ans: opts2.indexOf(it.m),
             tip: (it.p || '') + ' ' + it.m, speak: it.w, speakLang: 'en-US', autoSpeak: true };
  }

  function buildExpr(bank, cat, mode) {
    var items = bank.cats[cat].items;
    if (!items.length) return null;
    var allZh = items.map(function (x) { return x.zh; });
    var allEn = items.map(function (x) { return x.en; });
    var it = pick(items);
    if (mode === 'zh2en') {
      var opts = shuffle([it.en].concat(distractors(allEn, it.en, 3, FALLBACK_EN)));
      return { q: it.zh, opts: opts, ans: opts.indexOf(it.en), tip: it.en, speak: it.en, speakLang: 'en-US' };
    }
    var opts2 = shuffle([it.zh].concat(distractors(allZh, it.zh, 3, FALLBACK_ZH)));
    return { q: it.en, opts: opts2, ans: opts2.indexOf(it.zh), tip: it.en, speak: it.en, speakLang: 'en-US', autoSpeak: true };
  }

  function buildIrregular(bank, mode) {
    var items = bank.cats.irregular.items;
    if (!items.length) return null;
    var allPast = items.map(function (x) { return x.past || x.base; });
    var allBase = items.map(function (x) { return x.base; });
    var it = pick(items);
    if (mode === 'past2base') {
      var opts = shuffle([it.base].concat(distractors(allBase, it.base, 3, FALLBACK_EN)));
      return { q: '「' + (it.past || it.base) + '」的原形（现在式）是？', opts: opts, ans: opts.indexOf(it.base),
               tip: '原形 ' + it.base + ' → 过去式 ' + (it.past || it.base) };
    }
    if (mode === 'base2pp') {
      var pp = it.pp || it.past || it.base;
      var opts2 = shuffle([pp].concat(distractors(allPast, pp, 3, FALLBACK_EN)));
      return { q: '「' + it.base + '」的过去分词是？', opts: opts2, ans: opts2.indexOf(pp),
               tip: '原形 ' + it.base + ' → 过去式 ' + (it.past || it.base) + ' → 过去分词 ' + pp };
    }
    var opts3 = shuffle([(it.past || it.base)].concat(distractors(allPast, (it.past || it.base), 3, FALLBACK_EN)));
    return { q: '「' + it.base + '」的过去式是？', opts: opts3, ans: opts3.indexOf(it.past || it.base),
             tip: '原形 ' + it.base + ' → 过去式 ' + (it.past || it.base) };
  }

  function buildPhonetic(bank) {
    var items = bank.cats.phonetics.items;
    if (!items.length) return null;
    var others = [];
    items.forEach(function (p) { (p.examples || []).forEach(function (e) { others.push(e); }); });
    var it = pick(items);
    if (!it.examples || !it.examples.length) return null;
    var correct = pick(it.examples);
    var opts = shuffle([correct].concat(distractors(others, correct, 3, FALLBACK_EN)));
    return { q: '下面哪个单词的拼写规律「' + it.pattern + '」和「' + it.examples[0] + '」一样？',
             opts: opts, ans: opts.indexOf(correct),
             tip: '「' + it.pattern + '」例词：' + it.examples.join('、') };
  }

  /* 对外：生成一道题；cat 可为 mixed */
  function makeQuestion(g, cat) {
    var b = grade(g);
    if (!b) return null;
    if (cat === 'mixed') {
      var avail = catList(g);
      if (!avail.length) return null;
      cat = pick(avail);
    }
    var r = Math.random();
    switch (cat) {
      case 'vocab':    return buildVocab(b, r < 0.5 ? 'en2zh' : 'zh2en');
      case 'phrases':  return buildExpr(b, 'phrases', r < 0.5 ? 'en2zh' : 'zh2en');
      case 'proverbs': return buildExpr(b, 'proverbs', r < 0.5 ? 'en2zh' : 'zh2en');
      case 'irregular':return buildIrregular(b, pick(['base2past', 'base2pp', 'past2base']));
      case 'phonetics':return buildPhonetic(b);
      default:         return null;
    }
  }

  /* ---------- 错题本 ---------- */
  function qidOf(q) {
    return 'en_' + (q._grade || '') + '_' + (q._cat || '') + '_' + (q.opts[q.ans] || '') + '_' + (q.q || '').slice(0, 24);
  }
  function wrongList(g) {
    var p = S().progress.english; p.wrong = p.wrong || [];
    return p.wrong.filter(function (x) { return x.grade === g || g == null; });
  }
  function recordWrong(g, cat, q) {
    var p = S().progress.english; p.wrong = p.wrong || [];
    var qid = qidOf({ _grade: g, _cat: cat, q: q.q, opts: q.opts, ans: q.ans });
    var hit = null;
    for (var i = 0; i < p.wrong.length; i++) { if (p.wrong[i].qid === qid) { hit = p.wrong[i]; break; } }
    if (hit) { hit.n = (hit.n || 1) + 1; hit.ts = Date.now(); }
    else {
      p.wrong.push({
        qid: qid, grade: g, cat: cat, n: 1, ts: Date.now(),
        q: q.q, opts: q.opts, ans: q.ans, tip: q.tip || '', speak: q.speak || '', speakLang: q.speakLang || 'en-US'
      });
    }
    APP.save();
  }
  function removeWrong(qid) {
    var p = S().progress.english; p.wrong = p.wrong || [];
    p.wrong = p.wrong.filter(function (x) { return x.qid !== qid; });
    APP.save();
  }
  /* 把错题还原成 makeQuiz 题目对象 */
  function questionFromWrong(it) {
    return { qid: it.qid, q: it.q, opts: it.opts, ans: it.ans, tip: it.tip, speak: it.speak, speakLang: it.speakLang };
  }

  window.ENBANK = {
    ensure: ensure,
    grade: grade,
    catalog: catalog,
    catList: catList,
    makeQuestion: makeQuestion,
    wrongList: wrongList,
    recordWrong: recordWrong,
    removeWrong: removeWrong,
    questionFromWrong: questionFromWrong
  };
})();
</script>
<script>/* ===== 宝贝升级乐园 · 功能模块 modules.js =====
   字母乐园 / 大文豪 / 诗仙花园 / 数字小分队 / 小小外交官 / 逻辑挑战 / 闯关冒险
*/
(function () {
  'use strict';
  var $ = APP.$, $$ = APP.$$, esc = APP.esc, shuffle = APP.shuffle, rnd = APP.rnd, pick = APP.pick;
  var S = function () { return APP.state; };

  /* ---------- 公共：拼音注音 ---------- */
  function isHan(c) { return /[\u4e00-\u9fa5]/.test(c); }
  function rubyHTML(t, p) {
    var toks = (p || '').trim().split(/\s+/).filter(Boolean);
    var k = 0, out = '';
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (isHan(c)) { out += '<ruby>' + esc(c) + '<rt>' + esc(toks[k++] || '') + '</rt></ruby>'; }
      else { out += '<span style="opacity:.65">' + esc(c) + '</span>'; }
    }
    return out;
  }
  function speakBtn(text, lang, label, cls) {

  /* ---------- 公共：答题引擎 ---------- */
  function makeQuiz(host, cfg) {
    var idx = 0, score = 0, streak = 0, locked = false;
    var box = document.createElement('div');
    box.className = 'q-card';
    host.appendChild(box);

    function finish() {
      box.innerHTML = '<div style="text-align:center;padding:10px">' +
        '<div style="font-size:56px">' + (score >= cfg.total * 0.8 ? '🏆' : score >= cfg.total * 0.5 ? '💪' : '🌱') + '</div>' +
        '<h2>本轮结束：答对 ' + score + ' / ' + cfg.total + '</h2>' +
        '<p class="page-sub">' + (score >= cfg.total * 0.8 ? '太棒啦，你是小学霸！' : '继续加油，多练几次就熟啦！') + '</p>' +
        '<div class="btn-row" style="justify-content:center;margin-top:12px">' +
        '<button class="btn primary" id="qAgain">🔁 再来一轮</button>' +
        (cfg.backHash ? '<button class="btn ghost" data-back="' + esc(cfg.backHash) + '">← 返回</button>' : '') +
        '</div></div>';
      bindBack(box);
      $('#qAgain', box).onclick = function () { idx = 0; score = 0; streak = 0; render(); };
      cfg.onFinish && cfg.onFinish(score, cfg.total);
    }

    function render() {
      if (idx >= cfg.total) { finish(); return; }
      locked = false;
      var q = cfg.next(idx);
      box.innerHTML =
        '<div class="q-meta"><span class="pill">第 ' + (idx + 1) + ' / ' + cfg.total + ' 题</span>' +
        '<span class="pill g">✅ 答对 ' + score + '</span><span class="pill y">🔥 连对 ' + streak + '</span></div>' +
        '<div class="q-title">' + (q.html || esc(q.q)) + '</div>' +
        (q.speak ? '<div style="text-align:center;margin-top:6px">' + speakBtn(q.speak, q.speakLang || 'zh-CN', '再听一遍') + '</div>' : '') +
        '<div class="opts"></div><div class="feedback"></div>' +
        '<div class="btn-row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="qNext" style="display:none">下一题 →</button></div>';
      var optsEl = $('.opts', box), fb = $('.feedback', box), nextBtn = $('#qNext', box);
      bindSpeak(box);
      if (q.speak && q.autoSpeak !== false) setTimeout(function () { APP.speak(q.speak, q.speakLang || 'zh-CN'); }, 260);

      q.opts.forEach(function (o, i) {
        var b = document.createElement('button');
        b.className = 'opt'; b.innerHTML = esc(o);
        b.onclick = function () {
          if (locked) return; locked = true;
          var ok = i === q.ans;
          if (ok) {
            b.classList.add('right'); score++; streak++;
            fb.className = 'feedback ok'; fb.textContent = '答对啦！' + (q.tip ? '💡 ' + q.tip : '');
            APP.awardStars(1, '答对一题', b);
          } else {
            b.classList.add('wrong');
            $$('.opt', box)[q.ans].classList.add('right');
            streak = 0;
            fb.className = 'feedback no'; fb.textContent = '不对哦，正确答案是「' + q.opts[q.ans] + '」' + (q.tip ? ' 💡 ' + q.tip : '');
          }
          cfg.onResult && cfg.onResult(ok, q, streak);
          idx++;
          if (ok) { setTimeout(function () { render(); }, 1000); }
          else { nextBtn.style.display = ''; nextBtn.onclick = render; }
        };
        optsEl.appendChild(b);
      });
    }
    render();
    return { restart: function () { idx = 0; score = 0; streak = 0; render(); } };
  }

    var h = '<h2 style="margin-top:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      (VOL_ICO[v.term] || '📘') + ' ' + esc(v.vol) +
      '<span class="pill b">' + poems.length + ' 篇古诗文</span>' +
      '<span class="pill g">🏅 已掌握 ' + doneN + '</span></h2>';

    h += '<div class="grid g2">';
    poems.forEach(function (k) {
      var rec = pp.recited.indexOf(k.id) >= 0;
      var ok = CNBANK.mastered(k.id);
      var st = CNBANK.kpStat(k.id);
      var first = String((k.lines && k.lines[0]) || '');
      h += '<div class="card kp-card" data-kp="' + esc(k.id) + '">' +
        '<div style="display:flex;align-items:flex-start;gap:10px">' +
        '<span style="font-size:26px;line-height:1.1">' + (ok ? '🏅' : (k.kind === 'prose' ? '📖' : '📜')) + '</span>' +
        '<div style="flex:1;min-width:0"><div style="font-weight:900;font-size:17px;line-height:1.4">' + esc(k.name) + '</div>' +
        '<div class="page-sub">' + esc((k.dynasty ? k.dynasty + '·' : '') + (k.author || '')) + '</div></div>' +
        (rec ? '<span class="pill y">✨会背</span>' : '') + '</div>' +
        '<div class="page-sub" style="margin-top:8px">' + esc(first.length > 16 ? first.slice(0, 16) + '…' : first) + '</div>' +
        '<div class="page-sub" style="margin-top:4px">' +
        (st.t ? '已练 ' + st.t + ' 题 · 正确率 ' + Math.round(st.c / st.t * 100) + '%' : '共 ' + ((k.qs && k.qs.length) || k.n || 0) + ' 题 · 还没练过') +
        '</div></div>';
    });
    h += '</div>';

    if (others.length) {
      h += '<div class="grid g2" style="margin-top:12px">';
      others.forEach(function (k) {
        var ok = CNBANK.mastered(k.id);
        var isAcc = k.type === 'accum';
        var cnt = isAcc ? ((k.items || []).length + ' 条')
          : (((k.words || []).length || (k.chars || []).length) + ((k.words || []).length ? ' 个词语' : ' 个生字'));
        h += '<div class="card kp-card" data-kp="' + esc(k.id) + '" style="background:' + (isAcc ? '#FFF6D9' : '#E4F3FF') + '">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
          '<span style="font-size:26px">' + (ok ? '🏅' : (isAcc ? '🗓️' : '✍️')) + '</span>' +
          '<div style="font-weight:900;font-size:17px">' + esc(k.name) + '</div></div>' +
          '<div class="page-sub" style="margin-top:8px">' + cnt + ' · ' + (isAcc ? '补全闯关' : '听写练习') + '</div></div>';
      });
      h += '</div>';
    }
    return h;
  }

  /* ---------- 知识点页：分派 ---------- */
  function renderCnKP(view, g, kpid) {
    var back = '/诗仙花园/' + g;
    var lite = CNBANK.catalogKP(g, kpid);
    view.innerHTML = head('🎋 ' + esc(lite ? lite.name : '语文'), lite ? esc(lite.vol) : '', back) + loadingCard();
    bindBack(view);

    CNBANK.load(g, function (data) {
      if (!data) { view.innerHTML = head('🎋 语文', '', back) + bankFailCard(); bindBack(view); return; }
      var kp = CNBANK.findKP(g, kpid);
      if (!kp) { view.innerHTML = head('🎋 语文', '', back) + '<div class="card"><h3>没找到这个内容</h3></div>'; bindBack(view); return; }
      if (kp.type === 'accum') drawCnAccum(view, g, kp, back);
      else if (kp.type === 'vocab') drawCnVocab(view, g, kp, back);
      else drawCnPoem(view, g, kp, back);
    });
  }

  function cnMasteryPills(kp) {
    var st = CNBANK.kpStat(kp.id);
    var rate = st.t ? Math.round(st.c / st.t * 100) : 0;
    return '<span class="pill g">已练 ' + st.t + ' 题</span>' +
      '<span class="pill y">正确率 ' + rate + '%</span>' +
      (CNBANK.mastered(kp.id) ? '<span class="pill p">🏅 已掌握</span>' : '<span class="pill">练满 8 题且正确率 80% 即掌握</span>');
  }

  /* ---------- 古诗文：全文 + 背诵闯关 ---------- */
  function drawCnPoem(view, g, kp, back) {
    var pp = S().progress.poems;
    var lines = kp.lines || [];
    var full = lines.join('');
    var rec = pp.recited.indexOf(kp.id) >= 0;
    var ex = cnExtra(kp.name);
    var useRuby = !!(ex && hanOnly(full) === hanOnly(ex.lines.map(function (l) { return l.t; }).join('')));
    var isProse = kp.kind === 'prose';

    var h = head('🎋 ' + esc(kp.name),
      esc((kp.dynasty ? '［' + kp.dynasty + '］' : '') + (kp.author || '') + ' · ' + (kp._vol || '')), back);

    h += '<div class="card"><div class="btn-row" style="margin-bottom:12px;justify-content:center">' +
      speakBtn(kp.name + '，' + (kp.author || '') + '。' + full, 'zh-CN', '朗读全文', 'green') +
      '<button class="btn ' + (rec ? 'ghost' : 'yellow') + '" id="btnRecite">' + (rec ? '✨ 已标记会背' : '🎤 我会背了 (+3⭐)') + '</button></div>';

    if (useRuby) {
      h += '<div class="ruby-text poem-body">' + ex.lines.map(function (l) {
        return '<div style="margin-bottom:8px">' + rubyHTML(l.t, l.p) + '</div>';
      }).join('') + '</div>';
    } else {
      h += '<div class="poem-body" style="font-size:' + (isProse ? 18 : 22) + 'px;line-height:2.1;font-weight:800;text-align:' + (isProse ? 'left' : 'center') + '">' +
        lines.map(function (l) {
          return '<div style="margin-bottom:8px">' + esc(l) +
            ' <button class="btn ghost sm spk" data-t="' + esc(l) + '" data-l="zh-CN" style="vertical-align:middle">🔊</button></div>';
        }).join('') + '</div>';
    }
    h += '</div>';

    if (ex && ex.note) h += '<div class="card" style="margin-top:14px"><h3>💡 小提示</h3><p>' + esc(ex.note) + '</p></div>';

    var list = CNBANK.drawFrom(kp, 10);
    h += '<div class="card" style="margin-top:14px"><h3>🎯 背诵闯关' + (list.length ? '（本轮 ' + list.length + ' 题）' : '') + '</h3>' +
      '<div class="btn-row" style="margin:8px 0">' + cnMasteryPills(kp) + '</div>' +
      '<div id="cGame"></div></div>';

    view.innerHTML = h;
    bindBack(view); bindSpeak(view);

    if (APP.uniqPush(pp.read, kp.id)) { APP.awardStars(2, '读完《' + kp.name + '》'); APP.save(); APP.checkBadges(); }

    $('#btnRecite', view).onclick = function () {
      if (APP.uniqPush(pp.recited, kp.id)) {
        APP.awardStars(3, '背诵《' + kp.name + '》', this); APP.confetti(26); APP.save(true); APP.route();
      } else APP.toast('已经标记过啦 ✨');
    };

    if (!list.length) { $('#cGame', view).innerHTML = '<p class="page-sub">这一篇暂时没有闯关题，多读几遍背下来吧～</p>'; return; }
    makeQuiz($('#cGame', view), {
      total: list.length, backHash: back,
      next: function (i) { return list[i]; },
      onResult: function (ok, q) { handleCnResult(ok, q, g, kp); },
      onFinish: function (s, t) {
        if (t && s >= Math.ceil(t * 0.8)) { APP.awardStars(5, '背诵闯关优秀！'); APP.confetti(34); }
        else { APP.toast('答错的题已收进错题本，记得回去订正哦 📕'); }
      }
    });
  }

  /* ---------- 日积月累：条目 + 补全闯关 ---------- */
  function drawCnAccum(view, g, kp, back) {
    var items = kp.items || [];
    var cats = {}, order = [];
    items.forEach(function (it) {
      var c = it.cat || '积累';
      if (!cats[c]) { cats[c] = []; order.push(c); }
      cats[c].push(it.text);
    });

    var h = head('🗓️ ' + esc(kp.name), esc((kp._vol || '') + ' · 共 ' + items.length + ' 条'), back);
    h += order.map(function (c) {
      return '<div class="card" style="margin-top:14px"><h3>' + esc(c) + '（' + cats[c].length + '）</h3>' +
        cats[c].map(function (t) {
          return '<div class="list-item" style="cursor:default"><span class="li-ico">🔸</span>' +
            '<div class="li-main"><div class="li-title" style="font-size:16.5px;line-height:1.7">' + esc(t) + '</div></div>' +
            '<button class="btn ghost sm spk" data-t="' + esc(t) + '" data-l="zh-CN">🔊</button></div>';
        }).join('') + '</div>';
    }).join('');

    var list = CNBANK.drawFrom(kp, 10);
    h += '<div class="card" style="margin-top:14px"><h3>🎯 补全闯关' + (list.length ? '（本轮 ' + list.length + ' 题）' : '') + '</h3>' +
      '<div class="btn-row" style="margin:8px 0">' + cnMasteryPills(kp) + '</div>' +
      '<div id="cGame"></div></div>';

    view.innerHTML = h;
    bindBack(view); bindSpeak(view);

    if (!list.length) {
      $('#cGame', view).innerHTML = '<p class="page-sub">这一组以词语、成语为主，读一读、记一记就好啦～</p>';
      return;
    }
    makeQuiz($('#cGame', view), {
      total: list.length, backHash: back,
      next: function (i) { return list[i]; },
      onResult: function (ok, q) { handleCnResult(ok, q, g, kp); },
      onFinish: function (s, t) {
        if (t && s >= Math.ceil(t * 0.8)) { APP.awardStars(5, '日积月累闯关优秀！'); APP.confetti(34); }
      }
    });
  }

  /* ---------- 词语表 / 写字表：听写练习 ---------- */
  function drawCnVocab(view, g, kp, back) {
    var words = kp.words || [], chars = kp.chars || [];
    var isChar = !words.length;
    var all = (isChar ? chars : words).slice();
    var unit = isChar ? '生字' : '词语';

    var h = head('✍️ ' + esc(kp.name), esc((kp._vol || '') + ' · 共 ' + all.length + ' 个' + unit), back);
    h += '<div class="card"><h3>🎧 听写练习</h3>' +
      '<p class="page-sub">爸爸妈妈不用念啦——点开始，App 会一个一个读给你听，写完再对答案。</p>' +
      '<div class="btn-row" style="margin:10px 0">' + cnMasteryPills(kp) + '</div>' +
      '<div class="btn-row"><button class="btn primary" id="btnDict">▶️ 开始听写（10 个）</button></div>' +
      '<div id="dictHost"></div></div>';
    h += '<div class="card" style="margin-top:14px"><h3>📋 全部' + unit + '（点一点会读）</h3>' +
      '<div class="grid ' + (isChar ? 'g6' : 'g4') + '" style="margin-top:10px">' +
      all.map(function (w) {
        return '<div class="tile spk" data-t="' + esc(w) + '" data-l="zh-CN"><div class="big" style="font-size:' + (isChar ? 30 : 20) + 'px">' + esc(w) + '</div></div>';
      }).join('') + '</div></div>';

    view.innerHTML = h;
    bindBack(view); bindSpeak(view);

    var dictHost = $('#dictHost', view);
    if (!all.length) { $('#btnDict', view).disabled = true; return; }
    $('#btnDict', view).onclick = startDict;

    function startDict() {
      var pool = shuffle(all.slice()).slice(0, 10);
      var i = 0, right = 0;
      draw();
      function draw() {
        if (i >= pool.length) {
          dictHost.innerHTML = '<div class="q-card" style="margin-top:12px;text-align:center">' +
            '<div style="font-size:52px">' + (right === pool.length ? '🏆' : right >= pool.length * 0.6 ? '💪' : '🌱') + '</div>' +
            '<h3>听写结束：写对 ' + right + ' / ' + pool.length + '</h3>' +
            '<div class="btn-row" style="justify-content:center;margin-top:12px">' +
            '<button class="btn primary" id="dAgain">🔁 再来一组</button></div></div>';
          $('#dAgain', dictHost).onclick = startDict;
          if (right === pool.length) { APP.awardStars(5, '听写全对！'); APP.confetti(34); }
          else if (right) APP.awardStars(2, '完成一组听写');
          APP.save(); APP.checkBadges();
          return;
        }
        var w = pool[i];
        dictHost.innerHTML = '<div class="q-card" style="margin-top:12px">' +
          '<div class="q-meta"><span class="pill">第 ' + (i + 1) + ' / ' + pool.length + ' 个</span>' +
          '<span class="pill g">✅ 写对 ' + right + '</span></div>' +
          '<div style="text-align:center;padding:10px 0">' +
          '<div style="font-size:46px">🎧</div>' +
          '<p class="page-sub">听一听，在本子上写下来</p>' +
          '<div class="btn-row" style="justify-content:center;margin-top:10px">' +
          '<button class="btn blue" id="dPlay">🔊 再听一遍</button>' +
          '<button class="btn yellow" id="dShow">👀 看答案</button></div>' +
          '<div id="dAns" style="font-size:38px;font-weight:900;margin-top:14px;letter-spacing:4px;visibility:hidden">' + esc(w) + '</div>' +
          '<div class="btn-row" id="dJudge" style="justify-content:center;margin-top:12px;display:none">' +
          '<button class="btn green" id="dOk">✅ 我写对了</button>' +
          '<button class="btn ghost" id="dNo">✍️ 写错了，再练</button></div>' +
          '</div></div>';
        APP.speak(w, 'zh-CN');
        $('#dPlay', dictHost).onclick = function () { APP.speak(w, 'zh-CN'); };
        $('#dShow', dictHost).onclick = function () {
          $('#dAns', dictHost).style.visibility = 'visible';
          $('#dJudge', dictHost).style.display = '';
        };
        $('#dOk', dictHost).onclick = function () {
          right++; CNBANK.recordKP(kp.id, true); APP.awardStars(1, '写对一个' + unit, this); i++; draw();
        };
        $('#dNo', dictHost).onclick = function () { CNBANK.recordKP(kp.id, false); i++; draw(); };
      }
    }
  }

        '<p class="page-sub">继续保持～背错的诗句会自动收进这里，方便回头再练一遍。</p>' +
