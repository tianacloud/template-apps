:root {
  --bg: #12122a;
  --bg-soft: #1c1c3d;
  --card: #262650;
  --card-light: #33336b;
  --text: #f0f0ff;
  --text-dim: #a8a8d0;
  --primary: #6c8cff;
  --primary-dark: #4a6ae0;
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #f87171;
  --locked: #a78bfa;
  --border-subtle: rgba(255, 255, 255, .08);
  --state-idle: #4a4a7a;
  --state-trying: #60a5fa;
  --state-stuck: #fbbf24;
  --state-help: #f87171;
  --state-done: #4ade80;
  --radius: 12px;
  --radius-lg: 18px;
  --shadow: 0 4px 20px rgba(0, 0, 0, .35);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #app { min-height: 100%; margin: 0; }
body {
  font-family: "LXGW WenKai", "Kaiti SC", STKaiti, KaiTi, 楷体, "Kaiti TC", DFKai-SB, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

button {
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  border: none;
  border-radius: var(--radius);
  padding: 12px 18px;
  background: var(--primary);
  color: #fff;
  font-weight: 600;
  white-space: nowrap;
  transition: transform .1s, opacity .15s, background .15s;
}
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: transparent; border: 1px solid var(--card-light); color: var(--text-dim); }
button.danger { background: var(--danger); }
button.ok { background: var(--success); color: #052e16; }
button.small { padding: 6px 12px; font-size: .85rem; }

input, textarea, select {
  font-family: inherit;
  font-size: 1rem;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--card-light);
  background: var(--bg-soft);
  color: var(--text);
  width: 100%;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
input[readonly] { color: var(--text-dim); }
textarea { resize: vertical; min-height: 84px; }

label { display: block; font-size: .85rem; color: var(--text-dim); margin-bottom: 6px; }
h1, h2, h3 { margin: 0 0 12px; font-weight: 700; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }

.card { background: var(--card); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow); }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.muted { color: var(--text-dim); font-size: .85rem; }
.tiny { font-size: .72rem; color: var(--text-dim); }
.mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.center { text-align: center; }

.app { min-height: 100%; display: flex; flex-direction: column; }
.page {
  flex: 1;
  padding: calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
}
.page.wide { max-width: 1100px; }

/* ---------- home ---------- */
.home-hero { text-align: center; padding: 28px 0 20px; }
.home-hero .logo { font-size: 3rem; line-height: 1; margin-bottom: 12px; }
.game-title {
  font-family: "ZCOOL KuaiLe", "LXGW WenKai", "Kaiti SC", STKaiti, KaiTi, 楷体, sans-serif;
  font-weight: 400;
  font-size: clamp(2.6rem, 12vw, 3.4rem);
  line-height: 1.18;
  letter-spacing: 3px;
  margin: 4px 0 8px;
  color: #ffd76a;
  text-shadow: 0 3px 0 rgba(97, 20, 20, .55), 0 0 26px rgba(251, 191, 36, .35);
}
.school-brand { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-top: 8px; }
.brand-cn {
  font-family: "ZCOOL KuaiLe", "LXGW WenKai", "Kaiti SC", STKaiti, KaiTi, 楷体, sans-serif;
  font-size: 1.32rem;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 2px;
}
.brand-en { font-size: .8rem; color: var(--text-dim); letter-spacing: .3px; }
.brand-badge {
  margin-top: 12px;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: #fff;
  padding: 5px;
  box-shadow: 0 6px 20px #00000061, 0 0 0 3px #fbbf2447;
  object-fit: contain;
}

.site-stats {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin: 0 auto 16px;
  padding: 8px 16px;
  max-width: 760px;
  font-size: .85rem;
  color: var(--text-dim);
  background: #6c8cff14;
  border: 1px solid rgba(108, 140, 255, .22);
  border-radius: 999px;
}
.site-stats b { color: var(--text); font-weight: 700; }
.site-stats-sep { opacity: .5; }

.home-card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
.home-card { display: flex; flex-direction: column; gap: 10px; }
.home-card.teacher { border-left: 3px solid var(--locked); }
.home-card .desc { margin: 0; font-size: .85rem; line-height: 1.6; color: var(--text-dim); }
.home-card .desc strong { color: var(--text); }

/* ---------- teacher hub ---------- */
.hub-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.hub-head .sub { font-size: .8rem; color: var(--text-dim); }
.account-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.account-avatar {
  font-size: 1.9rem;
  line-height: 1;
  flex: 0 0 auto;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #6c8cff29;
  display: flex;
  align-items: center;
  justify-content: center;
}
.account-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.account-name { font-weight: 700; }
.account-hint { font-size: .82rem; line-height: 1.55; margin: 2px 0 0; color: var(--text-dim); }

/* ---------- room console ---------- */
.room-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
.room-head .sub { font-size: .8rem; color: var(--text-dim); }
.room-head .sub b { color: var(--text); }
.link-box { background: var(--bg-soft); border-radius: var(--radius); padding: 10px 12px; font-size: .8rem; color: var(--text-dim); word-break: break-all; }

.teacher-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.teacher-tabs button { white-space: nowrap; padding: 9px 14px; font-size: .9rem; background: var(--card); color: var(--text-dim); }
.teacher-tabs button.active { background: var(--primary); color: #fff; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.char-chip-wrap { position: relative; display: inline-flex; }
.char-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 10px;
  border-radius: var(--radius);
  background: var(--card-light);
  min-width: 58px;
  position: relative;
  color: var(--text);
}
.char-chip .big { font-size: 1.6rem; line-height: 1.2; }
.char-chip .tiny { font-size: .6rem; color: var(--text-dim); }
.char-chip .mode-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: .65rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
}
.mode-A { background: #6ee7b7; }
.mode-B { background: #fbbf24; }
.mode-C { background: #a78bfa; }
.mode-F { background: #94a3b8; }
.chip-del {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 20px;
  height: 20px;
  padding: 0;
  border-radius: 50%;
  font-size: .68rem;
  line-height: 1;
  background: var(--danger);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---------- wall ---------- */
.wall-summary { font-size: .85rem; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.wall-cell {
  padding: 10px 8px;
  border-radius: var(--radius);
  text-align: center;
  font-size: .85rem;
  font-weight: 600;
  border: 2px solid transparent;
}
.wall-cell .nm { display: block; font-size: .8rem; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wall-idle { background: var(--state-idle); color: #fff; }
.wall-trying { background: var(--state-trying); color: #052e16; }
.wall-stuck { background: var(--state-stuck); color: #3d2c00; }
.wall-help { background: var(--state-help); color: #fff; }
.wall-done { background: var(--state-done); color: #052e16; }
.wall-cell.online { border-color: #36d39980; }
.wall-cell.offline { opacity: .6; }

/* ---------- report ---------- */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.metric { background: #ffffff0d; border: 1px solid rgba(255, 255, 255, .08); border-radius: var(--radius); padding: 12px 14px; }
.metric .k { font-size: .78rem; color: var(--text-dim); }
.metric .v { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
.report-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.report-table th, .report-table td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--card-light); }
.report-table th { color: var(--text-dim); font-weight: 600; font-size: .78rem; }
.report-table td.num, .report-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.report-table tr.me td { color: var(--primary); }

/* ---------- leaderboard ---------- */
.lb-section { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--card-light); }
.lb-section-title { font-size: 1.05rem; margin-bottom: 12px; }
.lb-controls { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
.lb-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lb-group .muted { font-size: .82rem; margin-right: 2px; }
.lb-chip { padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .18); background: #ffffff0a; color: inherit; font-size: .85rem; }
.lb-chip.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.lb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #ffffff0d; border: 1px solid rgba(255, 255, 255, .08); }
.lb-row.me { border-color: var(--primary); background: #6c8cff24; }
.lb-rank { width: 30px; height: 30px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; font-size: .95rem; background: #ffffff1a; }
.lb-rank.rank-1 { background: #f5c542; color: #2a2300; }
.lb-rank.rank-2 { background: #cdd3da; color: #23262b; }
.lb-rank.rank-3 { background: #d9914b; color: #2a1600; }
.lb-name { font-weight: 600; }
.lb-score { margin-left: auto; font-weight: 700; color: #ffd479; }
.lb-meta { font-size: .8rem; color: #ffffff8c; min-width: 96px; text-align: right; }
.lb-sub { font-size: .72rem; opacity: .7; }

/* ---------- archive / library ---------- */
.group-head { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 8px; }
.group-head .count { font-size: .8rem; color: var(--text-dim); }
.folder-head { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-dim); margin: 12px 0 6px; }
.room-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: #ffffff0d; border: 1px solid rgba(255, 255, 255, .08); }
.room-row .code { font-weight: 700; letter-spacing: .5px; }
.room-row .meta { font-size: .78rem; color: var(--text-dim); }
.room-row .actions { margin-left: auto; display: flex; gap: 6px; }
.set-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: #ffffff0d; border: 1px solid rgba(255, 255, 255, .08); }
.set-row .nm { font-weight: 600; }
.set-row .meta { font-size: .78rem; color: var(--text-dim); }

/* ---------- student game ---------- */
.student-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #1c1c3dd9;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid var(--card-light);
}
.student-bar strong { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress-pill { background: var(--card-light); border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 600; }
.preview-pill { background: #a78bfa2e; border: 1px solid #a78bfa99; color: #ddd6fe; border-radius: 999px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
.timer-pill {
  background: #f59e0b2e;
  border: 1px solid rgba(245, 158, 11, .55);
  color: #fcd34d;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: .85rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: .5px;
}
.q-nav { display: flex; gap: 8px; margin: 10px 0 0; }
.q-nav button { flex: 1; }
.q-nav button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.q-head { text-align: center; padding: 18px 0 10px; }
.q-char-hint { font-size: 1rem; color: var(--text-dim); display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.q-preview-hint { font-size: .82rem; color: var(--text-dim); text-align: center; margin-bottom: 8px; }

.assembly-area {
  position: relative;
  width: 100%;
  height: 330px;
  margin: 14px 0;
  border: 2px dashed rgba(255, 255, 255, .22);
  border-radius: var(--radius-lg);
  background: #00000024;
  background-image: radial-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px);
  background-size: 22px 22px;
  overflow: hidden;
  touch-action: none;
}
.assembly-hint {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-dim);
  font-size: .9rem;
  pointer-events: none;
  user-select: none;
}
.assembly-hint-sub { font-size: .78rem; opacity: .75; }
.parts-tray {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 16px;
  min-height: 110px;
  border-radius: var(--radius-lg);
  background: #00000038;
}
.part {
  width: 78px;
  height: 88px;
  border-radius: var(--radius);
  background: var(--card-light);
  border: 2px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: 0 2px 8px #0000004d;
}
.part:active { border-color: var(--primary); }
.part.used { opacity: .3; }
.part-name { font-size: .6rem; color: var(--text-dim); margin-top: 2px; }
.part-in-area { position: absolute; margin: 0; cursor: grab; box-shadow: 0 2px 10px #00000059; }
.part-in-area:active { cursor: grabbing; }
.part-frame { color: #ffffff80; background: #ffffff0d; border: 2px dashed rgba(255, 255, 255, .32); box-shadow: none; }
.part-frame .part-name { color: #fff6; }
.part-inner { box-shadow: 0 2px 12px #00000080; }
.ghost-part { box-shadow: 0 8px 24px #00000080; border-color: var(--primary); cursor: grabbing; }

.submit-row { display: flex; gap: 10px; margin-top: 12px; }
.submit-row button { flex: 1; }
.submit-row button.ghost { flex: 0 0 auto; }

.hint-box { margin: 12px 0; padding: 12px 14px; background: #fbbf241f; border-left: 3px solid var(--warning); border-radius: 0 var(--radius) var(--radius) 0; font-size: .9rem; line-height: 1.6; }
.hint-box strong { color: var(--warning); }
.warn-box { margin: 12px 0; padding: 12px 14px; background: #f871711f; border-left: 3px solid var(--danger); border-radius: 0 var(--radius) var(--radius) 0; font-size: .9rem; line-height: 1.6; text-align: center; }
.warn-box .title { color: var(--danger); font-weight: 700; }
.info-box { margin: 12px 0; padding: 12px 14px; background: #4ade8014; border-left: 3px solid var(--success); border-radius: 0 var(--radius) var(--radius) 0; font-size: .88rem; line-height: 1.6; }

.feedback-correct {
  position: absolute;
  inset: 0;
  background: #f4f7e8;
  color: #14141f;
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 10px 16px;
  text-align: center;
  overflow: hidden;
  z-index: 10;
}
.feedback-correct .ok-line { color: #2f7d32; font-weight: 700; font-size: .95rem; }
.feedback-correct .progress { color: #5b6150; font-size: .78rem; }
.feedback-correct .big-char { font-size: clamp(3.4rem, 14vw, 5.6rem); font-weight: 500; line-height: 1.02; color: #14141f; }
.feedback-correct .pinyin { color: #b45309; font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; }
.feedback-correct .gloss { color: #374151; font-size: .88rem; line-height: 1.35; max-width: 92%; }
.reveal-parts { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; font-size: 1.5rem; margin-top: 2px; }
.reveal-part { padding: 3px 14px; border-radius: 10px; background: #00000012; color: #14141f; font-weight: 500; line-height: 1.25; }
.reveal-result { background: #6c8cff47; font-weight: 500; }
.reveal-op { opacity: .5; font-size: 1.4rem; }
.feedback-correct .countdown { color: #6b7280; font-size: .78rem; margin-top: 6px; }
.feedback-correct .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #00000012; }
.feedback-correct .bar span { display: block; height: 100%; background: #4ade80; width: 100%; transform-origin: left; animation: countdown 2s linear forwards; }
@keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

.help-btn {
  position: fixed;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(20px + var(--safe-bottom));
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--danger);
  font-size: 1.5rem;
  box-shadow: 0 4px 16px #f8717166;
  z-index: 60;
  padding: 0;
}
.help-btn.sent { background: #b91c1c; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%);
  background: #000000e6;
  color: #fff;
  padding: 12px 20px;
  border-radius: var(--radius);
  z-index: 9999;
  font-size: .9rem;
  max-width: 90vw;
  box-shadow: var(--shadow);
}

.modal-overlay { position: fixed; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
.modal { width: min(520px, 100%); max-height: 86vh; overflow: auto; background: var(--card); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 18px 20px; box-shadow: 0 20px 60px #00000080; }
.modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.modal-head h3 { margin: 0; flex: 1; }
.modal-close { background: transparent; color: var(--text-dim); font-size: 1.2rem; padding: 2px 8px; }

@media (max-width: 560px) {
  .assembly-area { height: 280px; }
  .part { width: 66px; height: 76px; font-size: 2rem; }
  .feedback-correct .big-char { font-size: 4rem; }
  .page { padding-left: 14px; padding-right: 14px; }
}
@media (max-width: 400px) {
  .assembly-area { height: 240px; }
}


/* ---------- 预览外壳 ---------- */
body { margin: 0; }
.demo-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 14px; background: #0e0e22; border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; z-index: 300;
}
.demo-tag {
  font-size: .75rem; color: #ffd76a; background: #fbbf241f;
  border: 1px solid #fbbf2447; border-radius: 999px; padding: 3px 10px;
}
.demo-switch { display: flex; gap: 4px; background: #ffffff0d; border-radius: 999px; padding: 3px; }
.demo-switch button {
  background: transparent; color: var(--text-dim); font-size: .82rem;
  padding: 5px 12px; border-radius: 999px; font-weight: 600; box-shadow: none;
}
.demo-switch button.active { background: var(--primary); color: #fff; }
#toast-host .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; z-index: 400; }
@media (max-width: 560px) {
  .demo-bar { gap: 8px; }
  .demo-tag { font-size: .7rem; }
}
</style>
</head>
<body>
<div class="app">
  <div class="demo-bar">
    <span class="demo-tag">示例体验 · 数据只保留在本页</span>
    <div class="spacer"></div>
    <div class="demo-switch" id="role-switch">
      <button data-role="student" class="active">学生视角</button>
      <button data-role="teacher">老师视角</button>
    </div>
    <button class="ghost small" id="reset">重置示例</button>
  </div>
  <div id="stage"></div>
</div>
<div id="toast-host"></div>
<script>
/* 汉字拼拼乐 · 示例体验：全部状态在内存中，不读写存储、不请求网络。 */
(() => {
  const W = 78;
  const H = 88;
  const ROOM = 'DEMO1';

  const CHARS = [
    { char: '明', parts: ['日', '月'], st: '左右结构', py: 'míng', en: 'bright, clear; to explain, to understand, to shed light' },
    { char: '休', parts: ['亻', '木'], st: '左右结构', py: 'xiū', en: 'to rest; to stop; to retire', lk: ['亻'] },
    { char: '林', parts: ['木', '木'], st: '左右结构', py: 'lín', en: 'forest, grove; surname' },
    { char: '好', parts: ['女', '子'], st: '左右结构', py: 'hǎo', en: 'good, excellent, fine; proper, suitable; well' },
  ];

  const PEERS = [
    { name: '阿雅', correct: 3, state: 'done' },
    { name: '林恩', correct: 1, state: 'trying' },
  ];

  const fresh = () => ({
    view: 'student',
    tab: 'wall',
    index: 0,
    placed: [],
    attempts: 0,
    helped: false,
    hint: false,
    feedback: false,
    toast: '',
    done: {},
    seconds: 0,
  });

  let S = fresh();
  let tick = null;

  const stage = document.getElementById('stage');
  const toastHost = document.getElementById('toast-host');
  const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const plan = () => CHARS[S.index];
  const shuffle = (list) => {
    const out = [...list];
    for (let i = out.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };

  let trayOrder = shuffle(plan().parts.map((char, i) => ({ uid: `p${i}`, char })));

  function fmt(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function say(text) {
    toastHost.innerHTML = `<div class="toast">${esc(text)}</div>`;
    setTimeout(() => { toastHost.innerHTML = ''; }, 1800);
  }

  /* ---------- 判分 ---------- */
  const centerOf = (part) => ({ cx: part.x + part.w / 2, cy: part.y + part.h / 2 });

  function orderOf(placed) {
    if (!placed.length) return { order: [], formation: null };
    const centers = placed.map((part) => ({ part, ...centerOf(part) }));
    if (centers.length === 1) return { order: [centers[0].part.uid], formation: null };
    const xs = centers.map((c) => c.cx);
    const ys = centers.map((c) => c.cy);
    const spanX = Math.max(...xs) - Math.min(...xs);
    const spanY = Math.max(...ys) - Math.min(...ys);
    const formation = spanY > spanX ? 'tb' : 'lr';
    const order = [...centers]
      .sort((a, b) => (formation === 'tb' ? a.cy - b.cy || a.cx - b.cx : a.cx - b.cx || a.cy - b.cy))
      .map((c) => c.part.uid);
    return { order, formation };
  }

  const sameMultiset = (a, b) => a.length === b.length && [...a].sort().join('') === [...b].sort().join('');

  function judge(placed, target) {
    if (!placed.length || placed.length !== target.parts.length) return false;
    if (!sameMultiset(placed.map((p) => p.char), target.parts)) return false;
    const { order, formation } = orderOf(placed);
    const byUid = new Map(placed.map((p) => [p.uid, p]));
    const ordered = order.map((uid) => byUid.get(uid).char);
    const expected = /上下/.test(target.st) ? 'tb' : /左右/.test(target.st) ? 'lr' : null;
    return ordered.every((ch, i) => ch === target.parts[i]) && (!expected || !formation || formation === expected);
  }

  /* ---------- 学生视角 ---------- */
  function studentBar() {
    return `<div class="student-bar">
      <strong>小测</strong>
      <span class="progress-pill">第 ${S.index + 1} 个字 · 共 ${CHARS.length} 个字</span>
      <span class="spacer"></span>
      <span class="timer-pill">⏱ ${fmt(S.seconds)}</span>
    </div>`;
  }

  function renderStudent() {
    const target = plan();
    stage.innerHTML = `<div class="page">
      ${studentBar()}
      <div class="q-nav">
        <button class="ghost" ${S.index === 0 ? 'disabled' : ''} data-nav="-1">← 上一题</button>
        <button class="ghost primary" data-nav="0">回到当前</button>
        <button class="ghost" ${S.index === CHARS.length - 1 ? 'disabled' : ''} data-nav="1">下一题 →</button>
      </div>
      <div class="q-head"><div class="q-char-hint">· 老师指定了拆法</div></div>
      <div id="boxes"></div>
      <div class="assembly-area" id="area"></div>
      <div class="parts-tray" id="tray"></div>
      <div class="submit-row">
        <button id="submit" disabled>还差 ${target.parts.length} 块</button>
        <button class="ghost" id="clear">清空重来</button>
      </div>
      <button class="help-btn" id="help" aria-label="求助">✋</button>
      <section class="lb-section">
        <h2 class="lb-section-title">🏆 排行榜</h2>
        <div class="lb-controls">
          <div class="lb-group"><span class="muted">范围</span>
            <button class="lb-chip on">全部课堂</button><button class="lb-chip">本课堂</button></div>
          <div class="lb-group"><span class="muted">周期</span>
            <button class="lb-chip on">累计</button><button class="lb-chip">本周</button><button class="lb-chip">本月</button></div>
        </div>
        <div class="lb-list">${leaderRows()}</div>
      </section>
    </div>`;
    paintBoxes();
    paintArea();
    paintTray();
    bindStudent();
  }

  function leaderRows() {
    const me = Object.values(S.done).filter((item) => item.correct).length;
    const entries = [
      { name: '阿雅', score: 45, correct: 3, attempts: 3 },
      { name: '小测', score: me * 15, correct: me, attempts: Math.max(1, me) },
      { name: '林恩', score: 25, correct: 1, attempts: 2 },
    ].sort((a, b) => b.score - a.score);
    return entries.map((entry, i) => `<div class="lb-row">
      <span class="lb-rank rank-${i + 1}">${i + 1}</span>
      <span class="lb-name">${esc(entry.name)}</span>
      <span class="spacer"></span>
      <span class="lb-score">${entry.score} 分</span>
      <span class="lb-meta">${entry.correct} 对 / ${entry.attempts} 次</span>
    </div>`).join('');
  }

  function paintBoxes() {
    const host = stage.querySelector('#boxes');
    if (!host) return;
    const bits = [];
    if (S.hint) bits.push(`<div class="hint-box">这是一个左右结构的字，两边各有一部分。提示：两部分的宽度不一定一样多。（这是其中一种拆法）</div>`);
    if (S.attempts >= 3) bits.push(`<div class="warn-box"><div class="title">试了 3 次啦</div>4 秒后自动进入下一题。<button class="ghost small" id="stay">我还能再试试，留在本题</button></div>`);
    host.innerHTML = bits.join('');
    host.querySelector('#stay')?.addEventListener('click', () => { S.attempts = 2; paintBoxes(); });
  }

  function paintArea() {
    const area = stage.querySelector('#area');
    if (!area) return;
    const hint = S.placed.length ? '' : `<div class="assembly-hint">把部件拖进来<div class="assembly-hint-sub">自己摆成这个字的样子</div></div>`;
    area.innerHTML = hint + S.placed.map((part) => `<div class="part part-in-area" data-placed="${part.uid}" data-char="${part.char}"
      style="left:${part.x}px;top:${part.y}px;width:${part.w}px;height:${part.h}px;font-size:${Math.round(part.w * 0.46)}px;z-index:2"><span>${part.char}</span></div>`).join('');
    if (S.feedback) showCorrect(area);
  }

  function paintTray() {
    const tray = stage.querySelector('#tray');
    if (!tray) return;
    const used = new Set(S.placed.map((p) => p.char));
    tray.innerHTML = trayOrder.map((item) => `<div class="part${used.has(item.char) ? ' used' : ''}" data-tray="${item.uid}" data-char="${item.char}"><span>${item.char}</span></div>`).join('');
  }

  function syncSubmit() {
    const button = stage.querySelector('#submit');
    if (!button) return;
    const missing = plan().parts.length - S.placed.length;
    button.disabled = missing !== 0 || S.feedback;
    button.textContent = missing > 0 ? `还差 ${missing} 块` : '提交答案';
  }

  function showCorrect(area) {
    const target = plan();
    const card = document.createElement('div');
    card.className = 'feedback-correct';
    card.innerHTML = `
      <div class="ok-line">✓ 答对了！</div>
      <div class="progress">第 ${S.index + 1} 个字 · 共 ${CHARS.length} 个字</div>
      <div class="big-char">${esc(target.char)}</div>
      <div class="pinyin">${esc(target.py)}</div>
      <div class="gloss">${esc(target.en)}</div>
      <div class="reveal-parts">${target.parts.map((part) => `<span class="reveal-part">${esc(part)}</span>`).join('<span class="reveal-op">+</span>')}<span class="reveal-op">=</span><span class="reveal-part reveal-result">${esc(target.char)}</span></div>
      <div class="countdown">2 秒后看下一题</div>
      <div class="bar"><span></span></div>`;
    area.append(card);
    setTimeout(() => {
      if (!S.feedback || S.view !== 'student') return;
      if (S.index < CHARS.length - 1) {
        S.index += 1;
        S.placed = [];
        S.attempts = 0;
        S.helped = false;
        S.hint = false;
        S.feedback = false;
        S.seconds = 0;
        trayOrder = shuffle(plan().parts.map((char, i) => ({ uid: `p${i}`, char })));
        renderStudent();
      } else {
        S.feedback = false;
        stage.querySelector('.page').innerHTML = `<div class="card center"><h2>这一课的生字都练完了</h2>
          <p class="muted">切到「老师视角」看看状态墙和成绩报告。</p>
          <div class="row" style="justify-content:center;margin-top:12px"><button data-role="teacher">查看老师视角</button></div></div>`;
        stage.querySelector('[data-role="teacher"]').addEventListener('click', () => { S.view = 'teacher'; render(); });
      }
    }, 2600);
  }

  function submit() {
    if (S.feedback) return;
    const target = plan();
    S.attempts += 1;
    if (judge(S.placed, target)) {
      const score = S.helped || S.hint ? 5 : S.attempts <= 1 ? 15 : 10;
      S.done[S.index] = { correct: true, attempts: S.attempts, score };
      S.feedback = true;
      paintArea();
      syncSubmit();
      say(`答对了 · +${score} 分`);
    } else {
      S.hint = S.attempts >= 2;
      paintBoxes();
      say(S.attempts >= 3 ? '再看一眼结构提示' : '还不对，再摆一次');
    }
  }

  function placeAt(uid, char, clientX, clientY) {
    const area = stage.querySelector('#area');
    const rect = area.getBoundingClientRect();
    const x = Math.max(4, Math.min(clientX - rect.left - W / 2, Math.max(4, area.clientWidth - W - 4)));
    const y = Math.max(4, Math.min(clientY - rect.top - H / 2, Math.max(4, area.clientHeight - H - 4)));
    S.placed = [...S.placed.filter((p) => p.uid !== uid), { uid, char, x, y, w: W, h: H }];
    paintArea();
    paintTray();
    syncSubmit();
  }

  function bindStudent() {
    const area = stage.querySelector('#area');
    const tray = stage.querySelector('#tray');
    stage.querySelectorAll('[data-nav]').forEach((button) => button.addEventListener('click', () => {
      const step = Number(button.dataset.nav);
      if (!step) { say('已经在当前题'); return; }
      S.index = Math.max(0, Math.min(CHARS.length - 1, S.index + step));
      S.placed = [];
      S.attempts = 0;
      S.hint = false;
      S.helped = false;
      S.feedback = false;
      S.seconds = 0;
      trayOrder = shuffle(plan().parts.map((char, i) => ({ uid: `p${i}`, char })));
      renderStudent();
    }));
    stage.querySelector('#clear').addEventListener('click', () => {
      if (S.feedback) return;
      S.placed = [];
      paintArea();
      paintTray();
      syncSubmit();
    });
    stage.querySelector('#submit').addEventListener('click', submit);
    stage.querySelector('#help').addEventListener('click', () => {
      S.helped = true;
      say('已向老师求助，本题答对得 5 分');
    });

    // 指针拖拽：托盘拖入、区域内移动、点一下取下
    let drag = null;
    const start = (event) => {
      if (S.feedback) return;
      const trayTile = event.target.closest('[data-tray]');
      const placedTile = event.target.closest('[data-placed]');
      if (!trayTile && !placedTile) return;
      const uid = trayTile ? trayTile.dataset.tray : placedTile.dataset.placed;
      const char = trayTile ? trayTile.dataset.char : placedTile.dataset.char;
      drag = { uid, char, fromTray: Boolean(trayTile), x0: event.clientX, y0: event.clientY, moved: false };
      if (placedTile) {
        const item = S.placed.find((p) => p.uid === uid);
        drag.offsetX = item.x;
        drag.offsetY = item.y;
      }
      event.preventDefault();
    };
    const move = (event) => {
      if (!drag) return;
      if (Math.hypot(event.clientX - drag.x0, event.clientY - drag.y0) > 10) drag.moved = true;
    };
    const end = (event) => {
      if (!drag) return;
      const current = drag;
      drag = null;
      const inside = area.getBoundingClientRect();
      const inArea = event.clientX >= inside.left && event.clientX <= inside.right
        && event.clientY >= inside.top && event.clientY <= inside.bottom;
      if (current.fromTray) {
        if (current.moved && inArea) placeAt(current.uid, current.char, event.clientX, event.clientY);
        else if (!current.moved) {
          const slot = S.placed.length;
          placeAt(current.uid, current.char, inside.left + inside.width * (slot ? 0.68 : 0.32), inside.top + inside.height * 0.5);
        }
        return;
      }
      if (!current.moved) {
        S.placed = S.placed.filter((p) => p.uid !== current.uid);
        paintArea();
        paintTray();
        syncSubmit();
        return;
      }
      if (inArea) placeAt(current.uid, current.char, event.clientX, event.clientY);
      else {
        S.placed = S.placed.filter((p) => p.uid !== current.uid);
        paintArea();
        paintTray();
        syncSubmit();
      }
    };
    [tray, area].forEach((node) => node.addEventListener('pointerdown', start));
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
  }

  /* ---------- 老师视角 ---------- */
  function wallState() {
    const current = S.done[S.index];
    if (S.attempts >= 3) return 'stuck';
    if (S.helped) return 'help';
    if (current?.correct) return 'done';
    return 'trying';
  }

  function renderTeacher() {
    const correctCount = Object.values(S.done).filter((item) => item.correct).length;
    const totalAttempts = Object.values(S.done).reduce((sum, item) => sum + item.attempts, 0);
    const rows = [
      { name: '小测', state: wallState(), correct: correctCount, online: true },
      ...PEERS.map((peer) => ({ ...peer, online: true })),
    ];
    const doneCount = rows.filter((row) => row.state === 'done').length;
    const stuck = rows.filter((row) => row.state === 'stuck').length;
    const help = rows.filter((row) => row.state === 'help').length;
    const trying = rows.filter((row) => row.state === 'trying').length;

    const answered = correctCount + PEERS.reduce((sum, p) => sum + p.correct, 0);
    const totalCells = CHARS.length * rows.length;
    const accuracy = Math.round((answered / Math.max(1, totalCells)) * 100);

    const perChar = CHARS.map((item, index) => {
      const mine = S.done[index];
      const peerDone = PEERS.filter((peer) => peer.correct > index).length;
      const ok = (mine?.correct ? 1 : 0) + peerDone;
      const rate = Math.round((ok / rows.length) * 100);
      const tries = mine?.attempts || 0;
      return `<tr><td>${esc(item.char)}</td><td>—</td><td class="num">${rate}%</td>
        <td class="num">${tries >= 3 ? 1 : 0}</td><td class="num">${mine && S.helped ? 1 : 0}</td>
        <td class="num">${tries === 3 ? 1 : 0}</td><td class="num">0</td></tr>`;
    }).join('');

    const personal = rows.map((row, index) => `<tr${row.name === '小测' ? ' class="me"' : ''}>
      <td>${index + 1}</td><td>${esc(row.name)}</td><td class="num">${row.correct}/${CHARS.length}</td>
      <td class="num">${Math.round((row.correct / CHARS.length) * 100)}%</td>
      <td class="num">${row.name === '小测' ? (totalAttempts || 0) : (index + 1)}</td>
      <td class="num">${row.name === '小测' && S.helped ? 1 : 0}</td></tr>`).join('');

    stage.innerHTML = `<div class="page">
      <h1>教师控台</h1>
      <div class="muted" style="margin-bottom:12px">游戏室号码 <b>${ROOM}</b> · 唯一 ID，不可改 · 第 1 轮 · 进行中</div>
      <div class="teacher-tabs">
        <button class="${S.tab === 'wall' ? 'active' : ''}" data-tab="wall">🟢 状态墙</button>
        <button class="${S.tab === 'report' ? 'active' : ''}" data-tab="report">📊 成绩报告</button>
        <button disabled>🏆 排行榜</button>
        <button disabled>🏠 自主练习</button>
      </div>
      ${S.tab === 'wall' ? `
        <div class="card">
          <div class="row" style="align-items:baseline">
            <span class="muted">当前题目</span>
            <div style="font-size:2.4rem;font-weight:700;margin-left:10px">${esc(plan().char)}</div>
            <span class="muted" style="margin-left:8px">第 ${S.index + 1} / ${CHARS.length} 题</span>
            <span class="spacer"></span>
            <button class="ghost small" data-wall="-1">←</button>
            <button class="ghost small" data-wall="1">下一题 →</button>
          </div>
          <div class="muted" style="margin:10px 0 12px">${rows.length} 人在线 · 🟢 ${doneCount} 已对 · 🟡 ${stuck} 卡住 · 🔴 ${help} 求助 · ⚪ ${trying} 进行中</div>
          <div class="wall-grid">${rows.map((row) => `<div class="wall-cell wall-${row.state} online">
            <span class="nm">${esc(row.name)}</span>
            <span class="tiny">${row.correct} 对</span></div>`).join('')}</div>
        </div>
        <div class="muted" style="margin-top:10px">切回「学生视角」答题，这里的格子会跟着变。</div>
      ` : `
        <div class="card">
          <h2>全班共同指标</h2>
          <div class="metric-grid">
            <div class="metric"><div class="k">参与人数</div><div class="v">${rows.length}</div></div>
            <div class="metric"><div class="k">平均正确率</div><div class="v">${accuracy}%</div></div>
            <div class="metric"><div class="k">攻下字数</div><div class="v">${answered}/${totalCells}</div></div>
            <div class="metric"><div class="k">求助次数</div><div class="v">${S.helped ? 1 : 0}</div></div>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <h2>个人榜</h2>
          <p class="muted">按答对数 → 平均尝试次数 → 平均用时 排序（速度权重极低）。</p>
          <table class="report-table"><thead><tr><th>名次</th><th>昵称</th><th class="num">答对</th><th class="num">正确率</th><th class="num">平均尝试</th><th class="num">求助</th></tr></thead><tbody>${personal}</tbody></table>
        </div>
        <div class="card" style="margin-top:12px">
          <h2>按字查（哪个字全班最卡）</h2>
          <table class="report-table"><thead><tr><th>字</th><th>课次</th><th class="num">正确率</th><th class="num">卡住</th><th class="num">求助</th><th class="num">第3次才对</th><th class="num">提示后仍错</th></tr></thead><tbody>${perChar}</tbody></table>
          <p class="muted" style="margin-top:10px">「第3次才对」是教学信号（不是失败）—— 说明提示起了作用。</p>
        </div>
      `}
    </div>`;

    stage.querySelectorAll('[data-tab]').forEach((button) => button.addEventListener('click', () => {
      S.tab = button.dataset.tab;
      render();
    }));
    stage.querySelectorAll('[data-wall]').forEach((button) => button.addEventListener('click', () => {
      const step = Number(button.dataset.wall);
      S.index = Math.max(0, Math.min(CHARS.length - 1, S.index + step));
      S.placed = [];
      S.attempts = 0;
      S.helped = false;
      S.hint = false;
      S.feedback = false;
      trayOrder = shuffle(plan().parts.map((char, i) => ({ uid: `p${i}`, char })));
      render();
    }));
  }

  /* ---------- 外壳 ---------- */
  function render() {
    if (S.view === 'student') renderStudent();
    else renderTeacher();
    document.querySelectorAll('#role-switch button').forEach((button) => {
      button.classList.toggle('active', button.dataset.role === S.view);
    });
  }

  document.getElementById('role-switch').addEventListener('click', (event) => {
    const button = event.target.closest('[data-role]');
    if (!button) return;
    S.view = button.dataset.role;
    render();
  });

  document.getElementById('reset').addEventListener('click', () => {
    S = fresh();
    trayOrder = shuffle(plan().parts.map((char, i) => ({ uid: `p${i}`, char })));
    render();
    say('已恢复示例数据');
  });

  tick = setInterval(() => {
    if (S.view !== 'student' || S.feedback) return;
    S.seconds += 1;
    const node = stage.querySelector('.timer-pill');
    if (node) node.textContent = `⏱ ${fmt(S.seconds)}`;
  }, 1000);

  render();
})();

</script>
</body>
</html>
