

<!-- ============ 顶部栏 ============ -->
<header class="appbar" id="appbar">
  <div class="brand" id="brand">
    <span class="brand-emoji">🐣</span>
    <span class="brand-text">
      <b id="brandName">小宝贝</b>
      <i>的课程表</i>
    </span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab" data-view="week">📅 周视图</button>
    <button class="tab" data-view="day">🕐 日视图</button>
    <button class="tab" data-view="growth">🌱 成长</button>
    <button class="tab" data-view="fun">🎪 玩法</button>
    <button class="tab" data-view="settings">⚙️ 设置</button>
  </nav>

  <div class="appbar-right">
    <div class="weather-chip" id="weatherChip" title="点击设置城市">
      <span class="wc-emoji">⛅</span>
      <span class="wc-text"><b>--</b><i>加载中</i></span>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换主题">🌗</button>
    <button class="icon-btn" id="fsBtn" data-fs title="全屏显示">⛶</button>
    <button class="btn-primary" id="screensaverBtn" title="进入屏保展示">🖥️ 屏保</button>
  </div>
</header>

<!-- ============ 主体 ============ -->
<main id="viewRoot" class="view-root"></main>

<!-- ============ 底部导航（手机） ============ -->
<nav class="bottom-nav" id="bottomNav" aria-label="主导航">
  <button class="bn-item" data-view="week"><span class="bn-ico">📅</span><span class="bn-txt">周视图</span></button>
  <button class="bn-item" data-view="day"><span class="bn-ico">🕐</span><span class="bn-txt">日视图</span></button>
  <button class="bn-item" data-view="growth"><span class="bn-ico">🌱</span><span class="bn-txt">成长</span></button>
  <button class="bn-item" data-view="fun"><span class="bn-ico">🎪</span><span class="bn-txt">玩法</span></button>
  <button class="bn-item" data-view="settings"><span class="bn-ico">⚙️</span><span class="bn-txt">设置</span></button>
</nav>

<!-- ============ 屏保模式 ============ -->
<div class="saver" id="saver" hidden>
  <div class="saver-sky" id="saverSky"></div>

  <div class="saver-top">
    <div class="saver-date">
      <span id="saverWeekday">星期一</span>
      <span id="saverDate">2026年10月15日</span>
    </div>
    <div class="saver-weather" id="saverWeather">
      <span class="sw-emoji">⛅</span>
      <span class="sw-temp">--°</span>
      <span class="sw-desc">加载中</span>
    </div>
  </div>

  <div class="saver-clock">
    <div class="clock-time" id="saverClock">00:00</div>
    <div class="clock-sec" id="saverSec">00</div>
  </div>

  <div class="saver-cards">
    <section class="sc-card sc-now" id="scNow">
      <div class="sc-tag">现在进行</div>
      <div class="sc-body">
        <div class="sc-ring" id="nowRing">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
          </svg>
          <span class="sc-icon" id="nowIcon">--</span>
        </div>
        <div class="sc-info">
          <h2 id="nowTitle">正在加载…</h2>
          <p id="nowRange">--</p>
          <p class="sc-countdown" id="nowCountdown"></p>
        </div>
      </div>
    </section>

    <section class="sc-card sc-next" id="scNext">
      <div class="sc-tag">接下来</div>
      <div class="sc-body">
        <div class="sc-icon-plain" id="nextIcon">--</div>
        <div class="sc-info">
          <h2 id="nextTitle">--</h2>
          <p id="nextRange">--</p>
          <p class="sc-countdown" id="nextCountdown"></p>
        </div>
      </div>
    </section>
  </div>

  <div class="saver-bottom">
    <div class="saver-tip" id="saverTip">今天也要开开心心呀～</div>
    <div class="saver-stars" id="saverStars">⭐ 0</div>
  </div>

  <button class="saver-exit" id="saverExit" title="退出屏保（Esc）">✕ 点击任意处退出</button>
</div>

<!-- ============ 通用弹层 ============ -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
