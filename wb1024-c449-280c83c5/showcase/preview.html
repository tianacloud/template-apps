<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* ============================================================
   宝贝课程表 · 样式
   ============================================================ */

:root {
  --bg: #f4f7ff;
  --bg-2: #eef3ff;
  --panel: #ffffff;
  --panel-2: #f8faff;
  --text: #1f2a44;
  --muted: #7c88a8;
  --line: #e6ebf7;
  --shadow: 0 8px 24px rgba(31, 42, 68, .08);
  --shadow-lg: 0 18px 48px rgba(31, 42, 68, .16);
  --radius: 20px;
  --radius-sm: 14px;

  --c-study: #f59e0b;
  --c-sport: #0ea5e9;
  --c-art: #ec4899;
  --c-life: #10b981;
  --c-commute: #64748b;
  --c-play: #8b5cf6;

  --font: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Hiragino Sans GB",
          "Noto Sans SC", "Segoe UI", system-ui, -apple-system, sans-serif;
}

[data-theme="dark"] {
  --bg: #0e1322;
  --bg-2: #131a2c;
  --panel: #1a2136;
  --panel-2: #202842;
  --text: #e9edf9;
  --muted: #9aa6c4;
  --line: #2b3654;
  --shadow: 0 8px 24px rgba(0, 0, 0, .35);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  background:
    radial-gradient(1200px 600px at 8% -6%, rgba(139, 92, 246, .10), transparent 60%),
    radial-gradient(1000px 500px at 96% 0%, rgba(14, 165, 233, .12), transparent 60%),
    var(--bg);
  color: var(--text);
  transition: background .35s ease, color .35s ease;
  overflow-x: hidden;
  overscroll-behavior-y: none;
  min-height: 100vh; /* 老 Safari 回退 */
  min-height: 100dvh;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
.hidden { display: none !important; }
[hidden] { display: none !important; }

/* ---------------- 顶部栏 ---------------- */
.appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-emoji { font-size: 30px; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,.12)); }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 18px; letter-spacing: .5px; }
.brand-text i { font-size: 11px; font-style: normal; color: var(--muted); letter-spacing: 2px; }

.tabs { display: flex; gap: 6px; margin-left: auto; background: var(--panel-2); padding: 5px; border-radius: 999px; border: 1px solid var(--line); }
.tab {
  padding: 8px 15px; border-radius: 999px; font-size: 14px; font-weight: 600;
  color: var(--muted); transition: all .2s ease; white-space: nowrap;
}
.tab:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
.tab.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }

.appbar-right { display: flex; align-items: center; gap: 10px; }

.weather-chip {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line);
  padding: 6px 12px; border-radius: 999px; transition: all .2s ease;
}
.weather-chip:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.wc-emoji { font-size: 20px; }
.wc-text { display: flex; flex-direction: column; line-height: 1.15; }
.wc-text b { font-size: 14px; }
.wc-text i { font-size: 10px; font-style: normal; color: var(--muted); }

.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; font-size: 17px;
  background: var(--panel-2); border: 1px solid var(--line); transition: all .2s ease;
}
.icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

.btn-primary {
  padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #7c5cff, #4d8cff);
  box-shadow: 0 8px 20px rgba(98, 116, 255, .35); transition: all .2s ease;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(98, 116, 255, .45); }

.btn-ghost {
  padding: 9px 15px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--line); transition: all .2s ease;
}
.btn-ghost:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-danger { color: #e11d48; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }

/* ---------------- 主体 ---------------- */
.view-root { padding: 20px; max-width: 1560px; margin: 0 auto; }

.view-head {
  display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.view-head h1 { font-size: 24px; letter-spacing: .5px; }
.view-head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.view-head .spacer { flex: 1; }

/* 日期选择条 */
.day-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.day-pill {
  min-width: 76px; padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--panel); border: 1px solid var(--line); text-align: center;
  transition: all .2s ease; box-shadow: var(--shadow);
}
.day-pill b { display: block; font-size: 15px; }
.day-pill i { display: block; font-size: 11px; font-style: normal; color: var(--muted); margin-top: 3px; }
.day-pill:hover { transform: translateY(-2px); }
.day-pill.active { background: linear-gradient(135deg, #7c5cff, #4d8cff); color: #fff; border-color: transparent; }
.day-pill.active i { color: rgba(255,255,255,.8); }
.day-pill .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #f43f5e; margin-left: 4px; vertical-align: middle; }

/* ---------------- 周视图网格 ---------------- */
.week-wrap {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: auto; max-height: calc(100vh - 220px);
  max-height: calc(100dvh - 210px);
  -webkit-overflow-scrolling: touch;
}
.week-grid {
  display: grid;
  grid-template-columns: 108px repeat(7, minmax(124px, 1fr));
  min-width: 980px;
}
.wg-head {
  position: sticky; top: 0; z-index: 12;
  background: var(--panel); border-bottom: 2px solid var(--line);
  padding: 12px 8px; text-align: center; font-weight: 700; font-size: 14px;
}
.wg-head.is-today { color: #fff; background: linear-gradient(135deg, #7c5cff, #4d8cff); border-radius: 0; }
.wg-head small { display: block; font-size: 10.5px; font-weight: 500; opacity: .75; margin-top: 2px; }
.wg-corner { left: 0; z-index: 14; color: var(--muted); font-size: 12px; }

.wg-time {
  position: sticky; left: 0; z-index: 10;
  background: var(--panel-2); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 10px 6px; font-size: 12px; font-weight: 700; color: var(--muted);
  gap: 4px; text-align: center; line-height: 1.35;
}
.wg-time .edit-hint { font-size: 10px; font-weight: 500; opacity: 0; transition: opacity .2s; }
.editing .wg-time { cursor: pointer; }
.editing .wg-time:hover { background: #eef2ff; }
.editing .wg-time:hover .edit-hint { opacity: 1; }

.wg-cell {
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 7px; display: flex; flex-direction: column; gap: 6px; min-height: 62px;
  transition: background .2s ease;
}
.wg-cell:nth-child(8n) { border-right: none; }
.wg-cell.is-today { background: color-mix(in srgb, #7c5cff 5%, transparent); }
.editing .wg-cell { cursor: pointer; }
.editing .wg-cell:hover { background: color-mix(in srgb, #7c5cff 10%, transparent); }
.wg-cell.is-now { box-shadow: inset 0 0 0 2px rgba(124, 92, 255, .55); border-radius: 10px; }

.task-chip {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 7px 8px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-left: 4px solid var(--cat, var(--c-play));
  transition: all .18s ease; position: relative;
}
.task-chip:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.task-chip .tc-icon { font-size: 17px; line-height: 1.2; }
.task-chip .tc-body { display: block; min-width: 0; }
.task-chip .tc-title { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; word-break: break-word; }
.task-chip .tc-time { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.task-chip.cat-study   { border-left-color: var(--c-study); }
.task-chip.cat-sport   { border-left-color: var(--c-sport); }
.task-chip.cat-art     { border-left-color: var(--c-art); }
.task-chip.cat-life    { border-left-color: var(--c-life); }
.task-chip.cat-commute { border-left-color: var(--c-commute); }
.task-chip.cat-play    { border-left-color: var(--c-play); }
.task-chip.done { opacity: .5; }
.task-chip.done .tc-title { text-decoration: line-through; }

.wg-add {
  border: 1.5px dashed var(--line); border-radius: 12px; color: var(--muted);
  font-size: 12px; padding: 8px; text-align: center;
}

/* 图例 */
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 4px; display: inline-block; }

/* ---------------- 日视图 ---------------- */
.day-layout { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }

.timeline { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; }
.tl-item { display: flex; gap: 12px; padding: 6px 4px; }
.tl-time { width: 82px; flex: none; text-align: right; padding-top: 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); line-height: 1.3; }
.tl-time small { display: block; font-size: 10.5px; font-weight: 500; opacity: .8; }
.tl-time-wrap { display: flex; flex-direction: column; align-items: center; }
.tl-line { width: 2px; flex: 1; background: var(--line); position: relative; border-radius: 2px; min-height: 40px; }
.tl-time-wrap { display: flex; flex-direction: column; align-items: center; }
.tl-dot { position: absolute; top: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }

.tl-card {
  flex: 1; display: flex; align-items: center; gap: 14px; padding: 12px 14px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  border-left: 5px solid var(--cat, var(--c-play)); transition: all .22s ease; margin: 4px 0;
  position: relative;
}
.tl-card:hover { transform: translateX(3px); box-shadow: var(--shadow); }
.tl-card .tlc-icon { font-size: 28px; line-height: 1; width: 40px; text-align: center; }
.tl-card .tlc-body { flex: 1; min-width: 0; }
.tl-card .tlc-title { font-size: 15.5px; font-weight: 700; }
.tl-card .tlc-time { font-size: 12px; color: var(--muted); margin-top: 3px; }

.tl-card.is-now {
  background: linear-gradient(135deg, color-mix(in srgb, #7c5cff 16%, var(--panel)), color-mix(in srgb, #4d8cff 12%, var(--panel)));
  border-color: rgba(124, 92, 255, .5);
  box-shadow: 0 10px 28px rgba(124, 92, 255, .22);
  transform: scale(1.012);
}
.tl-card.is-past { opacity: .58; }
.now-badge {
  position: absolute; top: -9px; right: 12px; font-size: 10.5px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #f43f5e, #f97316); padding: 2px 9px; border-radius: 999px;
  animation: pulse 1.8s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

.now-progress { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
.now-progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7c5cff, #4d8cff); transition: width .5s ease; }
.tlc-count { font-size: 11.5px; color: var(--muted); margin-top: 5px; }

/* 日视图编辑态 */
.edit-tip {
  font-size: 12.5px; font-weight: 600; color: #6d4bff;
  background: color-mix(in srgb, #7c5cff 11%, transparent);
  border-radius: 12px; padding: 10px 13px; margin: 2px 0 8px;
}
.timeline.editing .check-btn { display: none; }
.timeline.editing .tl-card { cursor: pointer; }
.timeline.editing .tl-card:hover { border-color: rgba(124, 92, 255, .55); }
[data-theme="dark"] .edit-tip { color: #c4b5ff; }

.check-btn {
  width: 34px; height: 34px; flex: none; border-radius: 11px; border: 2px solid var(--line);
  background: var(--panel); font-size: 16px; display: grid; place-items: center; transition: all .2s ease;
}
.check-btn:hover { border-color: var(--c-life); transform: scale(1.08); }
.check-btn.checked { background: var(--c-life); border-color: var(--c-life); color: #fff; }

/* 侧栏卡片 */
.side-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.side-card h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.side-card h3 .spacer { flex: 1; }

.progress-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #10b981, #34d399); transition: width .5s ease; }
.progress-text { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 8px; }

.star-row { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
.star-row .num { font-size: 30px; font-weight: 800; color: var(--c-study); }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.badge {
  display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600;
}
.badge.off { opacity: .38; filter: grayscale(1); }

.mood-row { display: flex; gap: 8px; }
.mood-btn { flex: 1; padding: 10px 4px; border-radius: var(--radius-sm); background: var(--panel-2); border: 1px solid var(--line); font-size: 22px; transition: all .2s ease; }
.mood-btn small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.mood-btn:hover { transform: translateY(-2px); }
.mood-btn.active { background: linear-gradient(135deg, #7c5cff, #4d8cff); border-color: transparent; box-shadow: var(--shadow); }
.mood-btn.active small { color: rgba(255,255,255,.85); }

/* 计时器 */
.timer-face { text-align: center; padding: 6px 0 2px; }
.timer-face .t-num { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.timer-face .t-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
.timer-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }

/* 统计小卡 */
.mini-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.mini { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.mini b { display: block; font-size: 22px; font-weight: 800; }
.mini small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* ---------------- 成长页 ---------------- */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.grid-2 > .card { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card > h3 { font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.card > .card-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }

.ms-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.ms-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); transition: all .2s ease; cursor: pointer; }
.ms-item:hover { transform: translateX(3px); }
.ms-item .ms-box { width: 20px; height: 20px; flex: none; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; margin-top: 1px; }
.ms-item.on .ms-box { background: var(--c-life); border-color: var(--c-life); color: #fff; }
.ms-item.on .ms-text { color: var(--muted); text-decoration: line-through; }
.ms-text { font-size: 13.5px; line-height: 1.45; }
.ms-date { font-size: 10.5px; color: var(--muted); margin-left: 6px; }

.plan-card { border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--line); background: var(--panel-2); border-top: 4px solid var(--cat, var(--c-play)); }
.plan-card h4 { font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.plan-card .freq { font-size: 11.5px; color: var(--muted); margin: 6px 0 8px; }
.plan-card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: var(--text); }
.plan-card ul li::marker { color: var(--cat, var(--c-play)); }

.note-area { width: 100%; min-height: 96px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 12px; font-family: inherit; font-size: 13.5px; line-height: 1.6; resize: vertical; }
.note-area:focus { outline: 2px solid rgba(124, 92, 255, .35); outline-offset: 1px; }
.note-item { padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 8px; }
.note-item .n-date { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.note-item .n-text { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
.note-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 18px 0; }

/* ---------------- 玩法页 ---------------- */
.fun-hero {
  border-radius: var(--radius); padding: 26px; color: #fff; margin-bottom: 16px;
  background: linear-gradient(135deg, #7c5cff, #4d8cff 55%, #22d3ee);
  box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
}
.fun-hero h2 { font-size: 22px; }
.fun-hero p { font-size: 13.5px; opacity: .92; margin-top: 6px; }
.fun-hero .flowers { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 54px; opacity: .9; }

.breathe-stage { display: grid; place-items: center; padding: 22px 0; }
.breathe-circle {
  width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #a78bfa, #6366f1);
  color: #fff; font-size: 15px; font-weight: 700; text-align: center;
  box-shadow: 0 16px 40px rgba(99, 102, 241, .4);
  transition: transform 4s cubic-bezier(.4, 0, .2, 1), box-shadow 4s ease;
  transform: scale(.72);
}
.breathe-circle.in { transform: scale(1.14); box-shadow: 0 22px 54px rgba(99, 102, 241, .55); }

.reward-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.reward {
  text-align: center; padding: 14px 8px; border-radius: var(--radius-sm);
  background: var(--panel-2); border: 1px solid var(--line); transition: all .2s ease;
}
.reward .r-icon { font-size: 30px; }
.reward .r-name { font-size: 12px; font-weight: 600; margin-top: 6px; }
.reward .r-need { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.reward.on { background: linear-gradient(135deg, #fef3c7, #fde68a); border-color: #fbbf24; }
[data-theme="dark"] .reward.on { background: linear-gradient(135deg, #4a3a12, #6b5314); border-color: #b45309; }
.reward.locked { opacity: .5; }
.reward.on .r-name { color: #92400e; }
[data-theme="dark"] .reward.on .r-name { color: #fde68a; }

/* ---------------- 口算小闯关 ---------------- */
.math-levels { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.math-levels button {
  flex: 1 1 0; min-width: 88px; padding: 7px 4px; font-size: 12px; font-weight: 600;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--muted); cursor: pointer; font-family: inherit; transition: all .18s ease;
}
.math-levels button.active {
  background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; border-color: transparent;
  box-shadow: 0 6px 16px rgba(99, 102, 241, .32);
}
.math-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.math-top b { color: var(--c-study); }
.math-bar { height: 6px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; margin-bottom: 14px; }
.math-bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #22d3ee, #8b5cf6); transition: width .3s ease; }
.math-q {
  text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 1px;
  padding: 6px 0 2px; font-variant-numeric: tabular-nums; color: var(--text);
}
.math-dots { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 4px 0 2px; min-height: 16px; }
.math-dots i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--c-study); opacity: .85; }
.math-dots i.off { background: var(--muted); opacity: .28; }
.math-dots b { font-size: 14px; color: var(--muted); margin: 0 4px; font-weight: 700; }
.math-dots .dot-op { font-size: 11px; color: var(--muted); margin-left: 6px; }
.math-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.math-opts button {
  padding: 14px 0; font-size: 22px; font-weight: 800; font-family: inherit; cursor: pointer;
  border-radius: var(--radius-sm); border: 2px solid var(--line); background: var(--panel-2);
  color: var(--text); transition: transform .12s ease, border-color .18s ease, background .18s ease;
}
.math-opts button:active { transform: scale(.95); }
.math-opts button.ok { background: #dcfce7; border-color: #22c55e; color: #15803d; }
.math-opts button.bad { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
[data-theme="dark"] .math-opts button.ok { background: #14361f; border-color: #22c55e; color: #86efac; }
[data-theme="dark"] .math-opts button.bad { background: #3b1519; border-color: #ef4444; color: #fca5a5; }
.math-fb { text-align: center; font-size: 14px; font-weight: 700; min-height: 20px; margin-top: 12px; }
.math-fb .ok { color: #16a34a; }
.math-fb .bad { color: #dc2626; }
[data-theme="dark"] .math-fb .ok { color: #4ade80; }
[data-theme="dark"] .math-fb .bad { color: #f87171; }
.math-result { text-align: center; padding: 6px 0 2px; }
.math-result .res-emoji { font-size: 40px; }
.math-result .res-score { font-size: 26px; font-weight: 800; margin-top: 6px; }
.math-result .res-sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.math-best { font-size: 12px; color: var(--muted); }
.game-card .timer-actions { align-items: center; }

/* ---------------- 认字找图 ---------------- */
.word-chips { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; min-width: 0; }
.word-chips button {
  flex: 1 1 0; min-width: 0; padding: 7px 4px; font-size: 12px; font-weight: 600;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--muted); cursor: pointer; font-family: inherit; transition: all .18s ease;
}
.word-chips button.active {
  background: linear-gradient(135deg, #22a06b, #0ea5e9); color: #fff; border-color: transparent;
  box-shadow: 0 6px 16px rgba(14, 165, 233, .28);
}
.word-groups { margin-bottom: 10px; }
.word-groups button { flex: 0 0 auto; padding: 6px 10px; white-space: nowrap; border-radius: 999px; font-size: 11.5px; }
.word-ask { text-align: center; padding: 8px 0 2px; }
.word-word { font-size: 40px; font-weight: 800; letter-spacing: 4px; line-height: 1.2; }
.word-emoji { font-size: 54px; line-height: 1.2; }
.word-pinyin { font-size: 13px; color: var(--muted); letter-spacing: 1px; margin-top: 4px; }
.word-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.word-opts button {
  padding: 10px 4px; min-height: 64px; border-radius: var(--radius-sm); border: 2px solid var(--line);
  background: var(--panel-2); cursor: pointer; font-family: inherit;
  display: grid; place-items: center; transition: transform .12s ease, border-color .18s ease, background .18s ease;
}
.word-opts button:active { transform: scale(.96); }
.word-opts .wo-e { font-size: 32px; line-height: 1.1; }
.word-opts.text button { min-height: 58px; }
.word-opts .wo-w { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: 1px; }
.word-opts button.ok { background: #dcfce7; border-color: #22c55e; }
.word-opts button.bad { background: #fee2e2; border-color: #ef4444; }
.word-opts button.ok .wo-w { color: #15803d; }
.word-opts button.bad .wo-w { color: #b91c1c; }
[data-theme="dark"] .word-opts button.ok { background: #14361f; border-color: #22c55e; }
[data-theme="dark"] .word-opts button.bad { background: #3b1519; border-color: #ef4444; }
[data-theme="dark"] .word-opts button.ok .wo-w { color: #86efac; }
[data-theme="dark"] .word-opts button.bad .wo-w { color: #fca5a5; }

/* ---------------- 故事接龙 ---------------- */
.story-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.story-card {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 4px 8px; text-align: center;
}
.story-card .sc-lab { font-size: 11px; color: var(--muted); }
.story-card .sc-e { font-size: 30px; line-height: 1.35; }
.story-card .sc-t { font-size: 12.5px; font-weight: 600; }
.story-open { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 12px; }
.story-open b { color: var(--text); }
.story-hints { font-size: 13px; line-height: 1.95; padding-left: 20px; margin: 8px 0 0; color: var(--text); }
.story-count { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

/* ---------------- 设置页 ---------------- */
.form-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.form-row:last-child { border-bottom: none; }
.form-row label { width: 116px; flex: none; font-size: 13.5px; font-weight: 600; }
.form-row .hint { font-size: 11.5px; color: var(--muted); }
.input, select.input {
  flex: 1; min-width: 140px; padding: 9px 12px; border-radius: 11px; font-size: 13.5px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-family: inherit;
}
.input:focus { outline: 2px solid rgba(124, 92, 255, .35); outline-offset: 1px; }

/* ---------------- 弹层 ---------------- */
.modal-mask {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0;
  z-index: 90; background: rgba(15, 21, 38, .5);
  backdrop-filter: blur(4px); display: grid; place-items: center; padding: 18px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(680px, 100%); max-height: 88vh; overflow: auto;
  background: var(--panel); border-radius: 22px; box-shadow: var(--shadow-lg);
  padding: 22px; animation: popIn .22s cubic-bezier(.2, 1.4, .5, 1);
  border: 1px solid var(--line);
}
@keyframes popIn { from { transform: scale(.94) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h2 { font-size: 18px; margin-bottom: 4px; }
.modal .modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
.modal-field { margin-bottom: 14px; }
.modal-field > label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.icon-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.icon-tab { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.icon-tab.active { background: linear-gradient(135deg, #7c5cff, #4d8cff); color: #fff; border-color: transparent; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 7px; max-height: 190px; overflow: auto; padding: 4px; background: var(--panel-2); border-radius: var(--radius-sm); border: 1px solid var(--line); }
/* aspect-ratio 为 Safari 15+，用 min-height 做回退（老设备上不会塌陷） */
.icon-cell { aspect-ratio: 1; min-height: 44px; border-radius: 10px; font-size: 22px; display: grid; place-items: center; background: var(--panel); border: 2px solid transparent; transition: all .15s ease; }
.icon-cell:hover { transform: scale(1.1); background: var(--panel); box-shadow: var(--shadow); }
.icon-cell.active { border-color: #7c5cff; background: color-mix(in srgb, #7c5cff 14%, transparent); }
.cat-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-cell { padding: 8px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--panel-2); border: 2px solid var(--line); display: flex; align-items: center; gap: 6px; }
.cat-cell i { width: 10px; height: 10px; border-radius: 3px; }
.cat-cell.active { border-color: #7c5cff; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.modal-actions .spacer { flex: 1; }

/* ---------------- 屏保 ---------------- */
.saver {
  /* inset 为 Safari 14.1+ 才支持，这里逐边写出以兼容老设备（iPad mini 2 / iOS 12） */
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0;
  z-index: 200; overflow: hidden;
  height: 100vh; height: 100dvh;
  background: radial-gradient(1200px 700px at 20% 10%, #1e2a5a, #0a0f1f 65%);
  color: #eaf0ff; display: flex; flex-direction: column;
  padding: 34px 46px; cursor: pointer; animation: fadeIn .4s ease;
}
.saver-sky { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; overflow: hidden; pointer-events: none; }
.saver-sky span { position: absolute; opacity: .22; animation: floatUp linear infinite; }
@keyframes floatUp {
  0% { transform: translateY(20vh) rotate(0deg); opacity: 0; }
  15% { opacity: .3; }
  85% { opacity: .3; }
  100% { transform: translateY(-110vh) rotate(320deg); opacity: 0; }
}

.saver-top { display: flex; justify-content: space-between; align-items: flex-start; z-index: 2; }
.saver-date { display: flex; flex-direction: column; gap: 6px; }
.saver-date #saverWeekday { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
.saver-date #saverDate { font-size: 15px; color: #9fb0d8; letter-spacing: 1px; }
.saver-weather { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); padding: 10px 20px; border-radius: 18px; }
.saver-weather .sw-emoji { font-size: 32px; }
.saver-weather .sw-temp { font-size: 30px; font-weight: 800; }
.saver-weather .sw-desc { font-size: 14px; color: #9fb0d8; }

.saver-clock { text-align: center; margin-top: 8px; z-index: 2; display: flex; align-items: baseline; justify-content: center; gap: 10px; }
/* clamp 为 Safari 13.4+，先给固定值做回退 */
.clock-time { font-size: 110px; font-size: clamp(64px, 11vw, 148px); font-weight: 800; letter-spacing: 4px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 10px 40px rgba(90, 130, 255, .45); }
.clock-sec { font-size: 30px; font-size: clamp(20px, 3vw, 40px); font-weight: 700; color: #7c9bff; font-variant-numeric: tabular-nums; }

.saver-cards { display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; margin: 30px auto 0; width: min(1180px, 100%); flex: 1; align-content: center; z-index: 2; }
.sc-card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13); border-radius: 26px; padding: 26px 28px; position: relative; overflow: hidden; backdrop-filter: blur(8px); }
.sc-card .sc-tag { position: absolute; top: 16px; left: 28px; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #8fa6e0; }
.sc-now { border-color: rgba(124, 92, 255, .5); background: linear-gradient(150deg, rgba(124, 92, 255, .26), rgba(77, 140, 255, .1)); }
.sc-body { display: flex; align-items: center; gap: 26px; margin-top: 22px; }
.sc-ring { position: relative; width: 132px; height: 132px; flex: none; }
.sc-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.sc-ring .ring-bg { fill: none; stroke: rgba(255,255,255,.13); stroke-width: 9; }
.sc-ring .ring-fg { fill: none; stroke: url(#g); stroke: #8b7cff; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.sc-ring .sc-icon { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; display: grid; place-items: center; font-size: 48px; }
.sc-icon-plain { width: 132px; height: 132px; flex: none; display: grid; place-items: center; font-size: 56px; background: rgba(255,255,255,.07); border-radius: 26px; }
.sc-info { min-width: 0; }
.sc-info h2 { font-size: 30px; font-size: clamp(24px, 2.6vw, 40px); font-weight: 800; line-height: 1.2; }
.sc-info p { font-size: 15px; color: #9fb0d8; margin-top: 6px; }
.sc-countdown { font-weight: 700; color: #7ee0b8 !important; }

.saver-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; z-index: 2; padding-top: 8px; }
.saver-tip { font-size: 19px; font-size: clamp(16px, 1.7vw, 24px); font-weight: 600; color: #cdd9ff; transition: opacity .5s ease; }
.saver-stars { font-size: 22px; font-weight: 800; color: #ffd166; }
.saver-exit { position: absolute; bottom: 14px; right: 20px; font-size: 12px; color: rgba(255,255,255,.35); }

/* ---------------- toast ---------------- */
.toast-wrap { position: fixed; top: 78px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #7c5cff, #4d8cff); box-shadow: var(--shadow-lg);
  animation: toastIn .28s cubic-bezier(.2, 1.4, .5, 1);
}
.toast.warn { background: linear-gradient(135deg, #f59e0b, #f97316); }
@keyframes toastIn { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------------- 底部导航（手机） ---------------- */
.bottom-nav {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  justify-content: space-around; align-items: stretch;
}
.bn-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 2px; border-radius: 14px; color: var(--muted);
  transition: background .18s ease, color .18s ease; min-width: 0;
}
.bn-ico { font-size: 21px; line-height: 1; }
.bn-txt { font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.bn-item.active { color: #7c5cff; background: color-mix(in srgb, #7c5cff 11%, transparent); }

/* ---------------- 手机版周视图：每日卡片 ---------------- */
.m-week { display: flex; flex-direction: column; gap: 12px; }
.m-day {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease;
}
.m-day:active { transform: scale(.995); }
.m-day.is-today { border-color: rgba(124, 92, 255, .5); box-shadow: 0 10px 26px rgba(124, 92, 255, .18); }
.m-day-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px 10px; }
.m-day-head b { font-size: 16px; }
.m-day-head .m-date { font-size: 12px; color: var(--muted); }
.m-day-head .m-today-tag {
  font-size: 10.5px; font-weight: 700; color: #fff; padding: 2px 9px; border-radius: 999px;
  background: linear-gradient(135deg, #7c5cff, #4d8cff);
}
.m-day-head .m-count { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.m-rows { padding: 0 10px 4px; display: flex; flex-direction: column; gap: 5px; }
.m-row {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  background: var(--panel-2); border-radius: 12px; border-left: 4px solid var(--cat, var(--c-play));
}
.m-row .m-time { font-size: 11.5px; font-weight: 700; color: var(--muted); width: 40px; flex: none; font-variant-numeric: tabular-nums; }
.m-row .m-ico { font-size: 17px; flex: none; }
.m-row .m-txt { font-size: 13.5px; font-weight: 600; line-height: 1.3; min-width: 0; }
.m-row.is-now { background: linear-gradient(135deg, rgba(124, 92, 255, .16), rgba(77, 140, 255, .1)); }
.m-row.is-now .m-txt::after {
  content: "进行中"; font-size: 10px; font-weight: 700; color: #fff; margin-left: 7px;
  background: linear-gradient(135deg, #f43f5e, #f97316); padding: 1px 7px; border-radius: 999px; vertical-align: 1px;
}
.m-more {
  display: flex; align-items: center; gap: 8px; padding: 11px 15px 13px;
  font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 6px;
}
.m-more .m-go { margin-left: auto; color: #7c5cff; font-weight: 700; }
.m-empty { padding: 14px 15px 16px; font-size: 13px; color: var(--muted); }

/* ---------------- 日视图手机优化 ---------------- */
.day-pills.scroll-x, .tabs.scroll-x { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.day-pills.scroll-x::-webkit-scrollbar { display: none; }
.tl-add {
  width: 100%; padding: 14px; border-radius: var(--radius-sm); margin-top: 8px;
  border: 1.5px dashed var(--line); color: var(--muted); font-size: 13.5px; font-weight: 600;
}

/* ---------------- 弹层底部抽屉（手机） ---------------- */
.modal-handle { display: none; }

/* ============================================================
   响应式
   ============================================================ */

/* 中屏：日视图侧栏折到下面 */
@media (max-width: 1180px) {
  .day-layout { grid-template-columns: 1fr; }
  .saver-cards { grid-template-columns: 1fr; gap: 16px; }
  .sc-icon-plain { width: 96px; height: 96px; font-size: 44px; }
  .sc-ring { width: 100px; height: 100px; }
  .sc-ring .sc-icon { font-size: 38px; }
}

/* 平板：网格收窄，尽量少滚动 */
@media (max-width: 1024px) and (min-width: 768px) {
  .week-grid { grid-template-columns: 88px repeat(7, minmax(104px, 1fr)); min-width: 820px; }
  .wg-head { font-size: 13px; padding: 10px 5px; }
  .task-chip { padding: 6px 7px; border-radius: 10px; }
  .task-chip .tc-title { font-size: 11.5px; }
  .wg-cell { padding: 5px; min-height: 56px; gap: 5px; }
  .view-root { padding: 16px; }
}

/* 手机 */
@media (max-width: 767px) {
  .appbar { padding: 9px 12px; padding-top: calc(9px + env(safe-area-inset-top)); gap: 8px; flex-wrap: nowrap; }
  .brand-emoji { font-size: 25px; }
  .brand-text b { font-size: 15px; }
  .brand-text i { display: none; }
  .tabs { display: none; }
  .bottom-nav { display: flex; }
  .appbar-right { margin-left: auto; gap: 7px; }
  .weather-chip { padding: 6px 10px; gap: 6px; }
  .wc-emoji { font-size: 18px; }
  .wc-text b { font-size: 13px; }
  .wc-text i { display: none; }
  .icon-btn { width: 36px; height: 36px; font-size: 16px; }
  .btn-primary { padding: 9px 13px; font-size: 13px; }

  .view-root { padding: 13px 13px calc(78px + env(safe-area-inset-bottom)); }
  .view-head { margin-bottom: 12px; align-items: center; }
  .view-head h1 { font-size: 20px; }
  .view-head .sub { font-size: 12px; line-height: 1.5; }

  .day-pills { flex-wrap: nowrap; overflow-x: auto; gap: 7px; padding-bottom: 4px; scrollbar-width: none; }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill { min-width: 62px; flex: none; padding: 9px 8px; }
  .day-pill b { font-size: 14px; }
  .day-pill i { font-size: 10px; }

  /* 时间轴 */
  .timeline { padding: 8px 8px 10px; }
  .tl-item { gap: 8px; padding: 5px 2px; }
  .tl-time { width: 54px; font-size: 11.5px; padding-top: 13px; }
  .tl-time small { font-size: 10px; }
  .tl-card { padding: 11px 11px; gap: 10px; border-radius: 13px; }
  .tl-card .tlc-icon { font-size: 23px; width: 30px; }
  .tl-card .tlc-title { font-size: 14.5px; }
  .tl-card .tlc-time { font-size: 11.5px; }
  .tl-card.is-now { transform: none; }
  .check-btn { width: 44px; height: 44px; font-size: 19px; border-radius: 13px; }

  /* 侧栏卡片全宽 */
  aside .side-card { margin-bottom: 12px; }
  .grid-2 { grid-template-columns: 1fr; }
  .card { padding: 15px; }
  .plan-card ul { font-size: 12.5px; }
  .ms-item { padding: 12px 11px; }
  .ms-item .ms-box { width: 23px; height: 23px; }
  .ms-text { font-size: 13px; }

  /* 玩法页 */
  .fun-hero { padding: 20px; }
  .fun-hero h2 { font-size: 19px; }
  .fun-hero .flowers { font-size: 38px; right: 12px; }
  .reward-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
  .breathe-circle { width: 132px; height: 132px; }
  #memoryBoard { max-width: 290px !important; }
  .reward, .mood-btn, .cat-cell, .icon-tab { min-height: 44px; }

  /* ============ 云数据库同步 ============
   * 存储策略：本地 localStorage 立即写入（离线可用）→ 合并 900ms 后推送到云数据库。
   * 传输方式：原生 XMLHttpRequest 直连云端 REST，【不使用任何 SDK】。
   *   原因：iOS 12 / 老 Safari 缺少 TextEncoder、Headers、crypto.subtle、?. 等新能力，
   *        官方 SDK 即使做过语法降级，仍会在运行时报错导致云同步完全失效。
   *   接口：GET  /schedules?family_code=eq.<码>&select=...        读取
   *        PATCH /schedules?family_code=eq.<码>  (Prefer: representation)  更新，返回 [] 表示无此记录
   *        POST  /schedules                                       插入；返回 409 再回退到 PATCH
   *        鉴权：请求头 x-wb-webapp-access-key
   */
  var booted = false;
  var applyingSnap = false; // 应用云端快照期间，避免"拉下来的数据又被当成改动传回去"
  var cloud = {
    ready: false, code: DEFAULT_FAMILY, status: "off",
    timer: null, lastAt: 0, err: "", dirty: false, http: 0, mode: "rest", remoteAt: 0
  };

  var CLOUD_TIMEOUT = 15000;

  function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  /** 把云端返回体整理成人类可读的错误信息 */
  function cloudMsg(status, raw) {
    var m = raw ? String(raw) : "";
    try {
      var j = JSON.parse(m);
      if (j && j.message) m = String(j.message);
      else if (j && j.msg) m = String(j.msg);
      else if (j && j.hint) m = String(j.hint);
    } catch (e) {}
    m = m.replace(/\s+/g, " ").slice(0, 120);
    if (status) return "HTTP " + status + (m ? " · " + m : "");
    return m || "网络不通";
  }

  function rest(method, path, bodyObj, cb) {
    var promise;
    if (method === "GET") promise = window.scheduleSQL("SELECT payload, updated_at FROM schedules WHERE family_code = ?", [cloud.code]).then(function(r) { return r.rows.map(function(x) { return {payload: JSON.parse(x.payload), updated_at:x.updated_at}; }); });
    else if (method === "PATCH") promise = window.scheduleSQL("UPDATE schedules SET payload = ?, updated_at = ? WHERE family_code = ?", [JSON.stringify(bodyObj.payload), bodyObj.updated_at, cloud.code]).then(function(r) { return r.affectedRows ? [{family_code:cloud.code}] : []; });
    else promise = window.scheduleSQL("INSERT INTO schedules (family_code,payload,updated_at) VALUES (?,?,?)", [bodyObj.family_code,JSON.stringify(bodyObj.payload),bodyObj.updated_at]).then(function(){return [{family_code:cloud.code}];});
    promise.then(function(rows){ cb(200, rows, ""); }).catch(function(e){cb(0,null,String(e.message));});
  }

  function cloudFamilyPath() {
    return "/schedules?family_code=eq." + encodeURIComponent(cloud.code);
  }

  function cloudInit(cb) {
    cloud.code = (state.settings && state.settings.familyCode) || DEFAULT_FAMILY;
    cloud.lastAt = loadJSON(K_SYNC, 0); // 刷新后仍能显示上次同步时间
    cloud.ready = !!window.scheduleSQL;
    if (cloud.ready) {
      cloud.status = "idle";
      cloud.err = "";
      if (cloud.dirty) { cloud.dirty = false; cloudPush(true); }
    } else {
      cloud.status = "nosdk";
      cloud.err = "当前浏览器不支持网络组件（数据仍在本地保存）";
    }
    if (cb) cb();
    if (state.view === "settings") render();
  }

  function cloudSnap() {
    return { v: 1, at: Date.now(), data: state.data, progress: state.progress, settings: state.settings };
  }

  function cloudStatusText() {
    var t = {
      off: "未连接", loading: "正在加载云端组件…", nosdk: "云端不可用（已用本地保存）",
      idle: "待同步", syncing: "同步中…",
      ok: "已保存到云端", empty: "云端暂无数据", err: "同步失败（已存本地）"
    };
    var s = t[cloud.status] || cloud.status;
    if (cloud.status === "ok" && cloud.lastAt) {
      var d = new Date(cloud.lastAt);
      s += " · " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
    if (cloud.status === "err" && cloud.err) s += "：" + cloud.err.slice(0, 40);
    return s;
  }

  /** 把同步时间戳显示成「今天 09:30 / 昨天 21:05 / 10-18 14:22」 */
  function syncTimeText(ts) {
    var d = new Date(ts), now = new Date();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    if (sameDay(d, now)) return "今天 " + hm;
    var y = new Date(now.getTime() - 86400000);
    if (sameDay(d, y)) return "昨天 " + hm;
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
  }

  /** 是否开启自动同步（默认开启，设置页可关） */
  function cloudAuto() {
    return !state.settings || state.settings.autoSync !== false;
  }

  /** 弹窗是否打开（编辑/新增/确认框） */
  function modalOpen() {
    var m = $("#modalMask");
    return !!(m && !m.hidden);
  }

  /** 安全重绘：用户正在输入或弹窗打开时不要整体重绘，否则会把输入内容冲掉 */
  function renderSafe() {
    if (modalOpen()) { refreshCloudStatus(); return; }
    var a = document.activeElement;
    var typing = a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA");
    if (typing) { refreshCloudStatus(); return; }
    render();
  }

  /** 只刷新设置页的云同步状态文字（不重建整个页面） */
  function refreshCloudStatus() {
    var el = $("#cloudStatus");
    if (el) el.textContent = cloudStatusText();
  }

  /** 任何本地改动都会走这里：合并 900ms 后自动上传 */
  function cloudSchedule() {
    if (!booted || applyingSnap) return;
    if (!cloudAuto()) return;
    if (!cloud.ready) cloudInit(); // 组件不可用时先尝试恢复
    if (cloud.timer) clearTimeout(cloud.timer);
    cloud.timer = setTimeout(function () { cloudPush(false); }, 900);
  }

  function cloudPush(manual, cb) {
    if (cloud.timer) { clearTimeout(cloud.timer); cloud.timer = null; }
    if (!cloud.ready) cloudInit();
    if (!cloud.ready) {
      cloud.dirty = true;
      if (manual) toast("云端不可用：" + (cloud.err || "请检查网络"), "warn");
      if (cb) cb(false);
      return;
    }
    cloud.status = "syncing";
    cloud.err = "";
    if (manual) toast("正在上传到云端…");
    if (manual && state.view === "settings") render();
    var iso = new Date().toISOString();
    // 先尝试更新已有记录（带上 representation，好判断到底有没有命中行）
    rest("PATCH", cloudFamilyPath() + "&select=family_code", { payload: cloudSnap(), updated_at: iso }, function (st, rows, raw) {
      if (st >= 200 && st < 300) {
        if (!rows) { cloudPushOK(manual, cb); return; } // 服务端未回表示：视为更新已生效
        if (rows.length) { cloudPushOK(manual, cb); return; }
        // 云端还没有这个家庭码的记录 → 插入一条
        var row = { family_code: cloud.code, payload: cloudSnap(), updated_at: iso };
        rest("POST", "/schedules?select=family_code", row, function (st2, rows2, raw2) {
          if (st2 >= 200 && st2 < 300) { cloudPushOK(manual, cb); return; }
          if (st2 === 409) {
            // 被别的设备抢先插入了，改为更新再试一次
            rest("PATCH", cloudFamilyPath() + "&select=family_code", { payload: cloudSnap(), updated_at: new Date().toISOString() }, function (st3, rows3, raw3) {
              if (st3 >= 200 && st3 < 300) cloudPushOK(manual, cb); else cloudPushFail(st3, raw3, manual, cb);
            }, "return=representation");
            return;
          }
          cloudPushFail(st2, raw2, manual, cb);
        });
        return;
      }
      cloudPushFail(st, raw, manual, cb);
    }, "return=representation");
  }

  function cloudPushOK(manual, cb) {
    cloud.status = "ok"; cloud.lastAt = Date.now(); cloud.err = "";
    cloud.dirty = false;
    cloud.remoteAt = cloud.lastAt;
    saveJSON(K_SYNC, cloud.lastAt);
    if (manual) toast("已保存到云端 ✅ 家庭码：" + cloud.code);
    if (state.view === "settings") renderSafe();
    if (cb) cb(true);
  }

  function cloudPushFail(st, raw, manual, cb) {
    cloud.status = "err"; cloud.err = cloudMsg(st, raw);
    cloud.dirty = true; // 记下未上传成功，联网/回到前台时自动补传
    if (manual) toast("云端保存失败：" + cloud.err + "（已存本地）", "warn");
    if (state.view === "settings") renderSafe();
    if (cb) cb(false);
  }

  function cloudPull(silent, cb) {
    if (!cloud.ready) cloudInit();
    if (!cloud.ready) {
      cloud.dirty = true;
      if (!silent) toast("云端不可用：" + (cloud.err || "请检查网络"), "warn");
      if (cb) cb(false);
      return;
    }
    cloud.status = "syncing";
    cloud.err = "";
    if (state.view === "settings") renderSafe();
    rest("GET", cloudFamilyPath() + "&select=payload,updated_at", null, function (st, rows, raw) {
      if (!(st >= 200 && st < 300)) {
        cloud.status = "err"; cloud.err = cloudMsg(st, raw);
        if (!silent) toast("云端读取失败：" + cloud.err, "warn");
        if (state.view === "settings") renderSafe();
        if (cb) cb(false);
        return;
      }
      var row = rows && rows.length ? rows[0] : null;
      if (!row || !row.payload) {
        cloud.status = "empty"; cloud.remoteAt = 0;
        if (!silent) toast("云端还没有「" + cloud.code + "」的数据，点「上传到云端」先存一份", "warn");
        if (state.view === "settings") renderSafe();
        if (cb) cb(false);
        return;
      }
      var rp = row.payload;
      var remoteAt = rp && rp.at ? rp.at : 0;
      cloud.remoteAt = remoteAt;
      var localAt = loadJSON(K_SYNC, 0);
      if (remoteAt > localAt + 1500) {
        if (modalOpen()) {
          // 用户正在编辑，先别覆盖（否则会把正在填的表单冲掉），5 秒后再试
          cloud.status = "idle";
          setTimeout(function () { cloudAutoTick(); }, 5000);
          if (cb) cb(true);
          return;
        }
        applyingSnap = true;
        applySnap(rp);
        saveData(); saveProg(); saveSet(); saveJSON(K_SYNC, remoteAt);
        applyingSnap = false;
        cloud.lastAt = remoteAt;
        render();
        if (!silent) toast("已从云端恢复最新数据 ✅");
      } else if (!silent) {
        toast("本机已是最新（云端与本机一致）");
      }
      cloud.status = "ok"; cloud.err = "";
      if (state.view === "settings") renderSafe();
      if (cb) cb(true);
    });
  }

  /* ============ 自动同步编排 ============
   * 打开/刷新页面：先拉云端，再判断本机是否更新 → 双向对齐
   * 断网恢复 / 回到前台 / 每 2 分钟：补传失败过的改动，并静默拉一次
   */
  function cloudBootSync() {
    cloudInit();
    if (!cloud.ready) return;
    if (cloud.dirty) {
      // 上次没传成功的改动优先上传，免得被云端旧数据覆盖
      cloudPush(false, function () { cloudPull(true, cloudAfterPull); });
      return;
    }
    cloudPull(true, cloudAfterPull);
  }

  function cloudAfterPull() {
    var localAt = loadJSON(K_SYNC, 0);
    var remoteAt = cloud.remoteAt || 0;
    if (localAt > remoteAt + 1500) cloudPush(false);        // 本机更新 → 自动上传
    else if (cloud.status === "empty") cloudPush(false);    // 云端还没有 → 补一份上去
  }

  function cloudAutoTick() {
    if (!booted || !cloud.ready || !cloudAuto()) return;
    if (applyingSnap) return;
    if (cloud.dirty) { cloudPush(false); return; }          // 之前失败的改动补传
    cloudPull(true, cloudAfterPull);                        // 静默拉一次，顺便判断要不要上传
  }

  /** 连通性自检：快速探一下云端，把 HTTP 状态码和耗时直接显示出来 */
  function cloudDiag() {
    if (!cloud.ready) cloudInit();
    if (!cloud.ready) { toast("云端不可用：" + (cloud.err || "请检查网络"), "warn"); return; }
    var t0 = new Date().getTime();
    cloud.status = "syncing"; cloud.err = "";
    if (state.view === "settings") render();
    rest("GET", "/schedules?select=family_code&limit=1", null, function (st, rows, raw) {
      var ms = new Date().getTime() - t0;
      if (st >= 200 && st < 300) {
        cloud.status = "ok"; cloud.err = "";
        toast("云端连通 ✅ HTTP " + st + " · " + ms + "ms", "ok");
      } else {
        cloud.status = "err"; cloud.err = cloudMsg(st, raw);
        toast("云端不通：" + cloud.err, "warn");
      }
      if (state.view === "settings") render();
    });
  }

  /** 用云端快照覆盖本地状态（做基本校验，避免脏数据把页面搞崩） */
  function applySnap(p) {
    if (!p) return;
    if (p.data && p.data.slots && p.data.slots.length) {
      p.data.days = p.data.days || DAYS;
      p.data.slots.forEach(function (s) { if (!s.tasks) s.tasks = {}; });
      state.data = p.data;
    }
    if (p.progress) {
      state.progress = Object.assign(state.progress, p.progress);
      state.progress.checks = state.progress.checks || {};
      state.progress.notes = state.progress.notes || [];
      state.progress.milestones = state.progress.milestones || {};
      state.progress.mood = state.progress.mood || {};
    }
    if (p.settings) {
      state.settings = Object.assign(state.settings, p.settings);
      document.documentElement.setAttribute("data-theme", state.settings.theme || "light");
      $("#brandName").textContent = state.settings.name;
    }
  }

  function initState() {
    var d = loadJSON(K_DATA, null);
    if (!d || !d.slots || !d.slots.length) d = clone({ meta: C.meta, days: C.days, slots: C.slots });
    // 兼容旧版本数据
    d.days = d.days || DAYS;
    d.slots.forEach(function (s) { if (!s.tasks) s.tasks = {}; });
    state.data = d;

    var s = loadJSON(K_SET, null);
    if (s) state.settings = Object.assign(state.settings, s);
    if (state.data.meta && state.data.meta.name) state.settings.name = state.settings.name || state.data.meta.name;

    var p = loadJSON(K_PROG, null);
    if (p) state.progress = Object.assign(state.progress, p);
    state.progress.checks = state.progress.checks || {};
    state.progress.notes = state.progress.notes || [];
    state.progress.milestones = state.progress.milestones || {};
    state.progress.mood = state.progress.mood || {};

    state.weather = loadJSON(K_WX, null);
    document.documentElement.setAttribute("data-theme", state.settings.theme || "light");
  }

  /* ============ 日程推算 ============ */

  function buildDayEvents(dayIndex) {
    var day = DAYS[dayIndex];
    var out = [];
    state.data.slots.forEach(function (slot, si) {
      var raw = (slot.tasks && slot.tasks[day]) || [];
      if (!raw.length) return;
      var slotStart = toMin(slot.start) || toMin(slot.time);
      var slotEnd = toMin(slot.end) || (slotStart + 30);

      var items = raw.map(function (t, ti) {
        var s = null, e = null, exp = false;
        var m = /^\s*(\d{1,2}:\d{2})\s*[-—~至]\s*(\d{1,2}:\d{2})\s*$/.exec(t.time || "");
        if (m) { s = toMin(m[1]); e = toMin(m[2]); exp = true; }
        return {
          slotIndex: si, taskIndex: ti, icon: t.icon || "⭐", text: t.text || "未命名",
          category: t.category || classify(t.icon, t.text),
          start: s, end: e, explicit: exp
        };
      });

      var ex = items.filter(function (x) { return x.explicit; }).sort(function (a, b) { return a.start - b.start; });
      var non = items.filter(function (x) { return !x.explicit; });
      var gaps = [], cursor = slotStart;
      ex.forEach(function (x) {
        if (x.start > cursor) gaps.push({ s: cursor, e: x.start });
        cursor = Math.max(cursor, x.end);
      });
      if (slotEnd > cursor) gaps.push({ s: cursor, e: slotEnd });

      if (!gaps.length) {
        if (non.length === 1) { non[0].start = slotStart; non[0].end = slotEnd; }
        else if (non.length > 1) {
          var span = (slotEnd - slotStart) / non.length;
          non.forEach(function (x, i) { x.start = slotStart + i * span; x.end = slotStart + (i + 1) * span; });
        }
      } else {
        non.forEach(function (x, i) { var g = gaps[Math.min(i, gaps.length - 1)]; x.start = g.s; x.end = g.e; });
      }
      out = out.concat(items);
    });
    return out.sort(function (a, b) { return a.start - b.start; });
  }

  function nowInfo(dayIndex, nowMin) {
    var evs = buildDayEvents(dayIndex);
    var covering = evs.filter(function (e) { return nowMin >= e.start && nowMin < e.end; });
    var current = null;
    if (covering.length) {
      covering.sort(function (a, b) {
        if (a.explicit !== b.explicit) return a.explicit ? -1 : 1;
        return b.start - a.start;
      });
      current = covering[0];
    }
    var next = evs.filter(function (e) { return e.start > nowMin; })[0] || null;
    var nextDay = null;
    if (!next) {
      var nd = (dayIndex + 1) % 7;
      var nev = buildDayEvents(nd);
      if (nev.length) { next = nev[0]; nextDay = nd; }
    }
    return { events: evs, current: current, next: next, nextDayIndex: nextDay };
  }

  function taskKey(ev) { return ev.slotIndex + "-" + ev.taskIndex; }
  function isChecked(dateStr, ev) {
    var day = state.progress.checks[dateStr];
    return !!(day && day[taskKey(ev)]);
  }
  function toggleCheck(dateStr, ev) {
    var day = state.progress.checks[dateStr] || (state.progress.checks[dateStr] = {});
    var k = taskKey(ev);
    if (day[k]) delete day[k]; else day[k] = 1;
    saveProg();
    return !!day[k];
  }
  function totalStars() {
    var n = 0;
    Object.keys(state.progress.checks).forEach(function (d) {
      n += Object.keys(state.progress.checks[d]).length;
    });
    return n;
  }
  function dayDoneCount(dateStr) {
    var d = state.progress.checks[dateStr];
    return d ? Object.keys(d).length : 0;
  }
  function streak() {
    var n = 0, d = new Date();
    for (var i = 0; i < 400; i++) {
      var k = dateKey(d);
      if (dayDoneCount(k) >= 6) { n++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  }

  /* ============ 天气 ============ */

  function weatherView() {
    var w = state.weather;
    if (!w || !w.code && w.code !== 0) return { emoji: "⛅", temp: "--", desc: "点击设置城市", city: state.settings.city };
    var m = WMO[w.code] || ["⛅", "多云"];
    return { emoji: m[0], desc: m[1], temp: w.temp + "°", city: w.city, min: w.min, max: w.max };
  }

  function loadWeather() { renderWeatherChips(); }

  function renderWeatherChips() {
    var v = weatherView();
    var chip = $("#weatherChip");
    if (chip) {
      chip.querySelector(".wc-emoji").textContent = v.emoji;
      chip.querySelector(".wc-text b").textContent = v.temp;
      chip.querySelector(".wc-text i").textContent = v.city + " · " + v.desc;
    }
    var sw = $("#saverWeather");
    if (sw) {
      sw.querySelector(".sw-emoji").textContent = v.emoji;
      sw.querySelector(".sw-temp").textContent = v.temp;
      sw.querySelector(".sw-desc").textContent = v.city + " " + v.desc + (v.max != null ? " " + v.min + "~" + v.max + "°" : "");
    }
  }

  /* ============ 通用渲染 ============ */

  function render() {
    state.isPhone = isPhoneNow();
    $("#brandName").textContent = state.settings.name;
    $$("[data-view]").forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === state.view);
    });
    var root = $("#viewRoot");
    if (state.view === "week") root.innerHTML = state.isPhone ? viewWeekMobile() : viewWeek();
    else if (state.view === "day") root.innerHTML = viewDay();
    else if (state.view === "growth") root.innerHTML = viewGrowth();
    else if (state.view === "fun") root.innerHTML = viewFun();
    else root.innerHTML = viewSettings();
    if (state.view === "fun") setTimeout(setupMemoryGame, 20);
  }

  /** 切换到某一天的日视图，并滚动到当前项目 */
  function goDay(idx) {
    state.view = "day";
    state.selDay = idx;
    render();
    setTimeout(autoScrollNow, 80);
  }

  /* ---------- 周视图 ---------- */

  function viewWeek() {
    var today = weekdayIndex(new Date());
    var now = new Date();
    var ni = nowInfo(today, now.getHours() * 60 + now.getMinutes());
    var nowSlot = ni.current ? ni.current.slotIndex : -1;

    var html = '<div class="view-head">'
      + '<div><h1>📅 一周课程表</h1><div class="sub">点击右上角「编辑课程表」可以修改内容与图标 · 彩色边框代表课程类型</div></div>'
      + '<div class="spacer"></div>'
      + '<button class="btn-ghost" id="editToggle">' + (state.editMode ? "✅ 完成编辑" : "✏️ 编辑课程表") + '</button>'
      + '</div>';

    html += '<div class="week-wrap' + (state.editMode ? " editing" : "") + '"><div class="week-grid">';

    // 表头
    html += '<div class="wg-head wg-corner">时间</div>';
    DAYS.forEach(function (d, i) {
      html += '<div class="wg-head' + (i === today ? " is-today" : "") + '">' + d
        + '<small>' + (i === today ? "今天" : (i >= 5 ? "周末" : "上课日")) + '</small></div>';
    });

    // 行
    state.data.slots.forEach(function (slot, si) {
      html += '<div class="wg-time" data-slot="' + si + '" title="' + (state.editMode ? "点击修改时间段" : "") + '">'
        + esc(slot.time || (slot.start + "-" + slot.end))
        + (state.editMode ? '<span class="edit-hint">点击修改</span>' : '')
        + '</div>';
      DAYS.forEach(function (day, di) {
        var tasks = (slot.tasks && slot.tasks[day]) || [];
        var cls = "wg-cell";
        if (di === today) cls += " is-today";
        if (di === today && si === nowSlot) cls += " is-now";
        html += '<div class="' + cls + '" data-slot="' + si + '" data-day="' + esc(day) + '">';
        if (!tasks.length) {
          html += state.editMode ? '<div class="wg-add">+ 添加项目</div>' : '';
        } else {
          tasks.forEach(function (t, ti) {
            var cat = t.category || classify(t.icon, t.text);
            html += '<div class="task-chip cat-' + cat + '" style="--cat:' + CAT_COLOR[cat] + '" data-slot="' + si + '" data-day="' + esc(day) + '" data-task="' + ti + '">'
              + '<span class="tc-icon">' + esc(t.icon) + '</span>'
              + '<span class="tc-body"><span class="tc-title">' + esc(t.text) + '</span>'
              + (t.time ? '<span class="tc-time">' + esc(t.time) + '</span>' : '')
              + '</span></div>';
          });
        }
        html += '</div>';
      });
    });
    html += '</div></div>';

    // 图例
    html += '<div class="legend">' + Object.keys(CAT_NAME).map(function (k) {
      return '<span><i style="background:' + CAT_COLOR[k] + '"></i>' + CAT_NAME[k] + '</span>';
    }).join("") + '<span>⏱️ 当前时间：' + minToStr(now.getHours() * 60 + now.getMinutes()) + '</span></div>';

    return html;
  }

  /* ---------- 手机版周视图：每日卡片概览 ---------- */

  function viewWeekMobile() {
    var today = weekdayIndex(new Date());
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var ni = nowInfo(today, nowMin);
    var nowKey = ni.current ? ni.current.slotIndex + "-" + ni.current.taskIndex : "";

    var html = '<div class="view-head">'
      + '<div><h1>📅 一周课程表</h1><div class="sub">点任意一天查看完整日程</div></div>'
      + '<div class="spacer"></div>'
      + '<button class="btn-ghost" id="editFromWeek">✏️ 编辑</button>'
      + '</div><div class="m-week">';

    DAYS.forEach(function (day, di) {
      var evs = buildDayEvents(di);
      var d = new Date();
      d.setDate(d.getDate() + (di - today));
      var hi = evs.filter(function (e) { return e.category !== "life" && e.category !== "play"; });
      var rows = hi.length ? hi : evs.slice(0, 3);
      var rest = evs.length - rows.length;

      html += '<section class="m-day' + (di === today ? " is-today" : "") + '" data-day-idx="' + di + '">'
        + '<div class="m-day-head"><b>' + day + '</b><span class="m-date">'
        + (d.getMonth() + 1) + "/" + d.getDate() + '</span>'
        + (di === today ? '<span class="m-today-tag">今天</span>' : '')
        + '<span class="m-count">' + evs.length + ' 项</span></div>';

      if (!evs.length) {
        html += '<div class="m-empty">这一天还没有安排</div>';
      } else {
        html += '<div class="m-rows">';
        rows.forEach(function (e) {
          var isNow = di === today && (e.slotIndex + "-" + e.taskIndex) === nowKey;
          html += '<div class="m-row' + (isNow ? " is-now" : "") + '" style="--cat:' + CAT_COLOR[e.category] + '">'
            + '<span class="m-time">' + minToStr(e.start) + '</span>'
            + '<span class="m-ico">' + esc(e.icon) + '</span>'
            + '<span class="m-txt">' + esc(e.text) + '</span></div>';
        });
        html += '</div><div class="m-more">'
          + (rest > 0 ? '另有 ' + rest + ' 项日常作息' : '共 ' + evs.length + ' 项安排')
          + '<span class="m-go">查看完整日程 ›</span></div>';
      }
      html += '</section>';
    });

    return html + '</div>';
  }

  /* ---------- 日视图 ---------- */

  function viewDay() {
    var today = weekdayIndex(new Date());
    var di = state.selDay;
    var day = DAYS[di];
    var d = new Date();
    if (di !== today) {
      var diff = di - today;
      d = new Date(); d.setDate(d.getDate() + diff);
    }
    var dk = dateKey(d);
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var evs = buildDayEvents(di);
    var shownMin = di === today ? nowMin : -1;
    var ni = nowInfo(di, shownMin);

    var doneN = 0;
    evs.forEach(function (e) { if (isChecked(dk, e)) doneN++; });
    var pct = evs.length ? Math.round(doneN / evs.length * 100) : 0;

    var html = '<div class="view-head">'
      + '<div><h1>🕐 ' + day + '日程</h1><div class="sub">' + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · 共 " + evs.length + " 个项目 · 点击右侧圆圈可打卡收集 ⭐</div></div>"
      + '<div class="spacer"></div>'
      + '<button class="btn-ghost" id="editToggle">' + (state.editMode ? "✅ 完成编辑" : "✏️ 编辑课程表") + '</button>'
      + '</div>';

    // 日期选择
    html += '<div class="day-pills">';
    DAYS.forEach(function (nm, i) {
      var dd = new Date(); dd.setDate(dd.getDate() + (i - today));
      html += '<button class="day-pill' + (i === di ? " active" : "") + '" data-day-idx="' + i + '">'
        + '<b>' + nm + '</b><i>' + (dd.getMonth() + 1) + "/" + dd.getDate() + '</i>'
        + (i === today ? '<span class="dot"></span>' : '') + '</button>';
    });
    html += '</div>';

    html += '<div class="day-layout">';

    // 时间轴
    html += '<div class="timeline' + (state.editMode ? " editing" : "") + '">';
    if (state.editMode) html += '<div class="edit-tip">✏️ 编辑中：点下方任意一张卡片可修改内容与图标</div>';
    if (!evs.length) html += '<div class="note-empty">这一天还没有安排，点下方按钮添加吧～</div>';
    evs.forEach(function (e) {
      var checked = isChecked(dk, e);
      var cls = "tl-card";
      if (di === today && ni.current && ni.current.slotIndex === e.slotIndex && ni.current.taskIndex === e.taskIndex) cls += " is-now";
      else if (di === today && e.end <= nowMin) cls += " is-past";
      var cat = e.category;
      html += '<div class="tl-item">'
        + '<div class="tl-time">' + minToStr(e.start) + '<small>' + minToStr(e.end) + '</small></div>'
        + '<div class="tl-time-wrap"><div class="tl-line"><span class="tl-dot" style="background:' + CAT_COLOR[cat] + '"></span></div></div>'
        + '<div class="' + cls + '" style="--cat:' + CAT_COLOR[cat] + '" data-slot="' + e.slotIndex + '" data-task="' + e.taskIndex + '">';
      if (di === today && cls.indexOf("is-now") > -1) html += '<span class="now-badge">进行中</span>';
      html += '<div class="tlc-icon">' + esc(e.icon) + '</div>'
        + '<div class="tlc-body"><div class="tlc-title">' + esc(e.text) + '</div>'
        + '<div class="tlc-time">' + minToStr(e.start) + " - " + minToStr(e.end) + " · " + durText(e.end - e.start) + '</div>';
      if (di === today && cls.indexOf("is-now") > -1) {
        var p = Math.min(100, Math.max(0, (nowMin - e.start) / (e.end - e.start) * 100));
        html += '<div class="now-progress"><i style="width:' + p.toFixed(0) + '%"></i></div>'
          + '<div class="tlc-count">还剩 ' + Math.max(0, Math.round(e.end - nowMin)) + ' 分钟';
        if (ni.next) html += ' · 下一项 ' + esc(ni.next.text) + ' ' + minToStr(ni.next.start);
        html += '</div>';
      }
      html += '</div>'
        + '<button class="check-btn' + (checked ? " checked" : "") + '" data-check="1" data-slot="' + e.slotIndex + '" data-task="' + e.taskIndex + '">' + (checked ? "✓" : "") + '</button>'
        + '</div></div>';
    });
    if (state.editMode) html += '<button class="tl-add" id="tlAdd">＋ 在「' + day + '」添加项目</button>';
    html += '</div>';

    // 侧栏
    html += '<aside>';
    html += '<div class="side-card"><h3>🏁 今日完成度</h3>'
      + '<div class="progress-bar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="progress-text"><span>已完成 ' + doneN + " / " + evs.length + ' 项</span><span>' + pct + '%</span></div>'
      + '<div class="star-row"><span class="num">' + totalStars() + '</span><span>⭐ 累计星星</span></div>'
      + '<div class="badges">' + BADGES.map(function (b) {
        var on = totalStars() >= b.need;
        return '<span class="badge' + (on ? "" : " off") + '">' + b.icon + " " + b.name + '</span>';
      }).join("") + '</div></div>';

    html += '<div class="side-card"><h3>😊 今天的心情</h3><div class="mood-row">'
      + MOODS.map(function (m) {
        var on = state.progress.mood[dk] === m.e;
        return '<button class="mood-btn' + (on ? " active" : "") + '" data-mood="' + m.e + '">' + m.e + '<small>' + m.t + '</small></button>';
      }).join("") + '</div></div>';

    html += '<div class="side-card"><h3>⏱️ 阅读计时器</h3>'
      + '<div class="timer-face"><div class="t-num" id="timerNum">' + fmtTimer(state.timer.sec) + '</div>'
      + '<div class="t-label">每天 20 分钟，读完记得打卡 📖</div></div>'
      + '<div class="timer-actions"><button class="btn-primary btn-sm" id="timerStart">' + (state.timer.running ? "⏸ 暂停" : "▶️ 开始") + '</button>'
      + '<button class="btn-ghost btn-sm" id="timerReset">↺ 归零</button></div></div>';

    html += '<div class="side-card"><h3>🔥 连续打卡</h3><div class="mini-grid">'
      + '<div class="mini"><b>' + streak() + '</b><small>连续天数</small></div>'
      + '<div class="mini"><b>' + (state.progress.notes.length) + '</b><small>成长记录</small></div>'
      + '</div></div>';

    html += '</aside></div>';
    return html;
  }

  function fmtTimer(sec) {
    return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60);
  }

    var el = $(".tl-card.is-now");
    if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {} }
  }

  /** 探测刘海/状态栏安全区（兼容 iOS 12 的 constant() 与新版的 env()） */
  function safeInset(side) {
    try {
      var d = document.createElement("div");
      d.style.position = "absolute";
      d.style.visibility = "hidden";
      d.style.height = "0";
      var prop = "padding-" + side;
      var v, declared = "";
      // 先尝试新版 env()，再回退旧版 constant()
      var list = [
        ["constant(safe-area-inset-" + side + ")", "env(safe-area-inset-" + side + ")"],
        ["calc(constant(safe-area-inset-" + side + ") + 0px)", "calc(env(safe-area-inset-" + side + ") + 0px)"]
      ];
      for (var i = 0; i < list.length; i++) {
        d.style.setProperty(prop, list[i][0]);
        d.style.setProperty(prop, list[i][1]);
        declared = d.style.getPropertyValue(prop);
        if (declared && declared.indexOf("constant") < 0 && declared.indexOf("env") < 0) break;
        if (declared.indexOf("env(") >= 0) break;
      }
      if (!document.body) return 0;
      document.body.appendChild(d);
      var cs = window.getComputedStyle ? window.getComputedStyle(d) : null;
      v = cs ? parseFloat(cs.getPropertyValue(prop)) : 0;
      document.body.removeChild(d);
      return isNaN(v) ? 0 : Math.max(0, v);
    } catch (e) { return 0; }
  }

  /** 强制铺满全屏：不依赖 CSS 的 inset / dvh / vh 等新特性，老设备（iOS 12）同样生效 */
  function forceSaverLayout() {
    var el = $("#saver");
    if (!el) return;
    var w = window.innerWidth || (document.documentElement && document.documentElement.clientWidth) || 1024;
    var h = window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 768;
    var narrow = Math.min(w, h) <= 767; // 手机视口
    var padX = (w < 520 ? 20 : 40);
    var padBase = (h < 620 ? 14 : 30);
    // 安全区：避免 iPhone 状态栏/灵动岛压住左上角日期，避免底部小黑条压住鼓励语
    var sTop = safeInset("top"), sBottom = safeInset("bottom"), sLeft = safeInset("left"), sRight = safeInset("right");
    var padTop = padBase + (sTop || 0);
    var padBtm = padBase + (sBottom || 0);
    try {
      el.removeAttribute("hidden");
      el.style.display = "flex";
      el.style.position = "fixed";
      el.style.top = "0px";
      el.style.left = "0px";
      el.style.right = "auto";
      el.style.bottom = "auto";
      el.style.width = w + "px";
      el.style.height = h + "px";
      el.style.minHeight = h + "px";
      el.style.zIndex = "9999";
      el.style.margin = "0";
      el.style.padding = padTop + "px " + (padX + (sRight || 0)) + "px " + padBtm + "px " + (padX + (sLeft || 0)) + "px";
      el.style.visibility = "visible";
      el.style.opacity = "1";
      el.style.overflow = "hidden";
      el.style.flexDirection = "column";
      el.style.boxSizing = "border-box";
      el.style.color = "#eaf0ff";
      el.style.backgroundColor = "#0a0f1f";
      el.style.backgroundImage = "radial-gradient(1200px 700px at 20% 10%, #1e2a5a, #0a0f1f 65%)";
      el.style.webkitTransform = "none";
      el.style.transform = "none";
    } catch (e) {}
    // 退出提示按钮：手机端（窄屏）直接隐藏，避免压住左上角日期/天气
    var ex = $("#saverExit");
    if (ex) {
      try {
        if (narrow) { ex.style.display = "none"; ex.style.visibility = "hidden"; }
        else {
          ex.style.display = "block";
          ex.style.visibility = "visible";
          ex.style.position = "absolute";
          ex.style.top = "auto";
          ex.style.left = "auto";
          ex.style.right = "20px";
          ex.style.bottom = (14 + (sBottom || 0)) + "px";
        }
      } catch (e2) {}
    }
  }

  /** 自愈：万一布局仍没铺满（被父级容器/层叠上下文影响），挪到 body 末尾再强制一次 */
  function saverSelfHeal() {
    var el = $("#saver");
    if (!el || el.hidden) return;
    var w = window.innerWidth || 1024, h = window.innerHeight || 768;
    var rect = el.getBoundingClientRect();
    if (rect.width < w * 0.7 || rect.height < h * 0.7) {
      try {
        if (el.parentNode !== document.body) document.body.appendChild(el);
        forceSaverLayout();
      } catch (e) {}
    }
  }

  function enterSaver() {
    var el = $("#saver");

      try { document.body.style.overflow = "hidden"; } catch (e) {}

  function tickSaver() {

  var mem = { open: [], matched: 0, moves: 0, lock: false, board: [] };

  function setupMemoryGame() {

    mem = { open: [], matched: 0, moves: 0, lock: false, board: cards };

    }).join("");
