<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 下班倒计时</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg-start: #0a0a1a;
    --bg-mid: #0d1117;
    --bg-end: #1a0a2e;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.6);
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --glow: rgba(108, 92, 231, 0.5);
    --progress-track: rgba(255,255,255,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg-start);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 2s ease;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 粒子画布 */
  #particles {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* 渐变光晕 */
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.3;
    z-index: 0;
    pointer-events: none;
    transition: all 3s ease;
  }
  .bg-glow.top { 
    width: 500px; height: 500px; 
    top: -150px; right: -100px;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  }
  .bg-glow.bottom { 
    width: 400px; height: 400px; 
    bottom: -100px; left: -80px;
    background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
  }

  /* 主容器 */
  .container {
    position: relative;
    z-index: 10;
    width: 520px;
    max-width: 95vw;
  }

  /* 设置按钮 */
  .settings-btn {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .settings-btn:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
    transform: rotate(60deg);
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--glow);
  }

  /* 卡片 */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 40px 36px;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  /* 状态标签 */
  .status-badge {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
    transition: all 0.5s ease;
  }
  .status-working {
    background: rgba(108, 92, 231, 0.15);
    color: #a29bfe;
    border: 1px solid rgba(108, 92, 231, 0.3);
  }
  .status-soon {
    background: rgba(253, 203, 110, 0.15);
    color: #ffeaa7;
    border: 1px solid rgba(253, 203, 110, 0.3);
  }
  .status-off {
    background: rgba(0, 206, 201, 0.15);
    color: #81ecec;
    border: 1px solid rgba(0, 206, 201, 0.3);
  }
  .status-before {
    background: rgba(116, 185, 255, 0.12);
    color: #74b9ff;
    border: 1px solid rgba(116, 185, 255, 0.25);
  }

  /* 环形进度 */
  .progress-ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 28px;
  }
  .progress-ring {
    transform: rotate(-90deg);
    width: 240px;
    height: 240px;
  }
  .progress-ring .bg-circle {
    fill: none;
    stroke: var(--progress-track);
    stroke-width: 8;
  }
  .progress-ring .fg-circle {
    fill: none;
    stroke: url(#progressGradient);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-ring .pulse-circle {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
    opacity: 0;
    transition: none;
  }
  .progress-ring .pulse-circle.active {
    animation: pulse-ring 2s ease-out infinite;
  }

  @keyframes pulse-ring {
    0% { opacity: 0.8; stroke-width: 2; }
    100% { opacity: 0; stroke-width: 20; }
  }

  .progress-inner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .progress-percent {
    font-family: 'Orbitron', monospace;
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* 倒计时 */
  .countdown {
    font-family: 'Orbitron', monospace;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 6px;
    transition: all 0.3s ease;
    background: linear-gradient(135deg, #dfe6e9, #ffffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .countdown.soon {
    animation: countdown-glow 1s ease-in-out infinite alternate;
  }
  .countdown.urgent {
    animation: countdown-glow 0.5s ease-in-out infinite alternate;
  }

  @keyframes countdown-glow {
    from { filter: brightness(1); }
    to { filter: brightness(1.3) drop-shadow(0 0 12px var(--glow)); }
  }

  .countdown-label {
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  /* 时间信息 */
  .time-info {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 20px;
  }
  .time-info-item {
    text-align: center;
  }
  .time-info-value {
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .time-info-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }

  /* 语录 */
  .quote {
    font-size: 14px;
    color: var(--text-secondary);
    font-style: italic;
    opacity: 0.8;
    transition: all 0.5s ease;
    min-height: 22px;
    line-height: 1.6;
  }

  /* 设置面板 */
  .settings-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    backdrop-filter: blur(4px);
  }
  .settings-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .settings-panel {
    background: rgba(20, 20, 40, 0.95);
    backdrop-filter: blur(40px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 36px 32px;
    width: 420px;
    max-width: 92vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: translateY(20px);
    transition: transform 0.3s ease;
  }
  .settings-overlay.open .settings-panel {
    transform: translateY(0);
  }

  .settings-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .settings-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .settings-close:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }

  .setting-group {
    margin-bottom: 24px;
  }
  .setting-label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .setting-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: #fff;
    font-size: 15px;
    font-family: 'Orbitron', monospace;
    outline: none;
    transition: all 0.2s ease;
  }
  .setting-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
  }
  .setting-input[type="time"] {
    color-scheme: dark;
  }

  .weekday-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .weekday-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .weekday-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
  }
  .weekday-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px var(--glow);
  }

  /* 日签管理 */
  .quote-manager {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--card-border);
  }
  .quote-manager-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .quote-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .quote-tab {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Noto Sans SC', sans-serif;
    white-space: nowrap;
  }
  .quote-tab:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.2);
  }
  .quote-tab.active {
    background: rgba(108,92,231,0.15);
    border-color: rgba(108,92,231,0.4);
    color: #a29bfe;
  }
  .quote-list {
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .quote-list::-webkit-scrollbar { width: 4px; }
  .quote-list::-webkit-scrollbar-track { background: transparent; }
  .quote-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .quote-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: var(--card-bg);
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }
  .quote-item:hover {
    border-color: var(--card-border);
    background: rgba(255,255,255,0.04);
  }
  .quote-text {
    flex: 1;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  .quote-del {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .quote-del:hover {
    background: rgba(255, 82, 82, 0.15);
    border-color: rgba(255, 82, 82, 0.3);
    color: #ff5252;
  }
  .quote-add-row {
    display: flex;
    gap: 8px;
  }
  .quote-add-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: #fff;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    outline: none;
    transition: all 0.2s ease;
  }
  .quote-add-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.12);
  }
  .quote-add-input::placeholder { color: rgba(255,255,255,0.25); }
  .quote-add-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: rgba(108,92,231,0.3);
    color: #a29bfe;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .quote-add-btn:hover {
    background: var(--accent);
    color: #fff;
  }
  .quote-hint {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    margin-top: 8px;
  }
  .quote-empty {
    text-align: center;
    padding: 20px;
    color: rgba(255,255,255,0.2);
    font-size: 13px;
  }

  .setting-actions {
    display: flex;
    gap: 12px;
    margin-top: 32px;
  }
  .btn {
    flex: 1;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 0.5px;
    border: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    color: #fff;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.04);
    color: #fff;
  }

  /* 响应式 */
  @media (max-width: 540px) {
    .countdown { font-size: 36px; letter-spacing: 2px; }
    .progress-ring-wrap { width: 180px; height: 180px; }
    .progress-ring { width: 180px; height: 180px; }
    .progress-percent { font-size: 32px; }
    .card { padding: 28px 20px; border-radius: 22px; }
    .time-info { gap: 20px; }
  }
</style>
</head>
<body>

<!-- 粒子背景 -->
<canvas id="particles"></canvas>

<!-- 渐变光晕 -->
<div class="bg-glow top"></div>
<div class="bg-glow bottom"></div>

<!-- 设置按钮 -->
<button class="settings-btn" id="settingsBtn" title="设置">⚙</button>

<!-- 主卡片 -->
<div class="container">
  <div class="card">

    <!-- 状态标签 -->
    <div class="status-badge" id="statusBadge">💼 工作中</div>

    <!-- 环形进度 -->
    <div class="progress-ring-wrap">
      <svg class="progress-ring" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6c5ce7" />
            <stop offset="50%" stop-color="#a29bfe" />
            <stop offset="100%" stop-color="#00cec9" />
          </linearGradient>
        </defs>
        <circle class="bg-circle" cx="120" cy="120" r="108" />
        <circle class="fg-circle" id="progressCircle" cx="120" cy="120" r="108"
                stroke-dasharray="678.584" stroke-dashoffset="678.584" />
        <circle class="pulse-circle" id="pulseCircle" cx="120" cy="120" r="108"
                stroke-dasharray="678.584" />
      </svg>
      <div class="progress-inner">
        <div class="progress-percent" id="progressPercent">0%</div>
        <div class="progress-label">今日进度</div>
      </div>
    </div>

    <!-- 倒计时 -->
    <div class="countdown" id="countdown">--:--:--</div>
    <div class="countdown-label">距 离 下 班</div>

    <!-- 时间信息 -->
    <div class="time-info">
      <div class="time-info-item">
        <div class="time-info-value" id="currentTime">--:--</div>
        <div class="time-info-label">当前时间</div>
      </div>
      <div class="time-info-item">
        <div class="time-info-value" id="workStartTime">09:00</div>
        <div class="time-info-label">上班时间</div>
      </div>
      <div class="time-info-item">
        <div class="time-info-value" id="workEndTime">18:00</div>
        <div class="time-info-label">下班时间</div>
      </div>
    </div>

    <!-- 语录 -->
    <div class="quote" id="quote"></div>
  </div>
</div>

<!-- 设置面板 -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-title">
      ⚙️ 时间设置
      <button class="settings-close" id="settingsClose">✕</button>
    </div>

    <div class="setting-group">
      <label class="setting-label">⏰ 上班时间</label>
      <input type="time" class="setting-input" id="inputStartTime" value="09:00">
    </div>

    <div class="setting-group">
      <label class="setting-label">🏃 下班时间</label>
      <input type="time" class="setting-input" id="inputEndTime" value="18:00">
    </div>

    <div class="setting-group">
      <label class="setting-label">📅 工作日</label>
      <div class="weekday-grid" id="weekdayGrid">
        <button class="weekday-btn active" data-day="1">一</button>
        <button class="weekday-btn active" data-day="2">二</button>
        <button class="weekday-btn active" data-day="3">三</button>
        <button class="weekday-btn active" data-day="4">四</button>
        <button class="weekday-btn active" data-day="5">五</button>
        <button class="weekday-btn" data-day="6">六</button>
        <button class="weekday-btn" data-day="0">日</button>
      </div>
    </div>

    <!-- 日签管理 -->
    <div class="quote-manager">
      <div class="quote-manager-title">📝 日签管理</div>
      <div class="quote-tabs" id="quoteTabs">
        <button class="quote-tab active" data-status="working">💼 工作中</button>
        <button class="quote-tab" data-status="soon">🔥 即将下班</button>
        <button class="quote-tab" data-status="off">🎉 已下班</button>
        <button class="quote-tab" data-status="before">🌅 上班前</button>
        <button class="quote-tab" data-status="weekend">🌴 休息日</button>
      </div>
      <div class="quote-list" id="quoteList"></div>
      <div class="quote-add-row">
        <input class="quote-add-input" id="quoteAddInput" placeholder="输入新的日签语录..." maxlength="50">
        <button class="quote-add-btn" id="quoteAddBtn">＋ 添加</button>
      </div>
      <div class="quote-hint" id="quoteHint">留空时将使用默认语录</div>
    </div>

    <div class="setting-actions">
      <button class="btn btn-ghost" id="resetBtn">恢复默认</button>
      <button class="btn btn-primary" id="saveBtn">保存设置</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ==================== 配置 ====================
  const CIRCUMFERENCE = 2 * Math.PI * 108; // ~678.584

  const QUOTES = {
    working: [
      '认真搞钱，准时下班 💰',
      '每一行代码都在为下班倒计时 ⏳',
      '坚持就是胜利，下班就在前方 🚀',
      '今天的努力，是为了明天更好地摸鱼 🐟',
      '打工人的一天，从倒计时开始 ☕',
      'Focus on work, dream of freedom ✨',
      '效率拉满，准点下班不是梦 🎯',
    ],
    soon: [
      '自由的气息越来越近了 🌈',
      '最后冲刺！胜利在望 🏁',
      '准备收拾东西，姿势要帅 😎',
      '还有一小会儿，坚持住！💪',
      '已经开始脑补今晚的安排了吧 🎮',
    ],
    off: [
      '下班快乐！享受自由时光 🎉',
      '今日电量耗尽，明日再战 🔋',
      '去生活，去热爱，去撒野 🌟',
      '工作是为了生活，现在去生活吧 🌿',
      '自由模式已开启 🎊',
      '恭喜你，又活过了一天 🏆',
    ],
    before: [
      '距离上班还有一会儿，再躺躺 🛌',
      '早起的打工人有...班要上 😴',
      '先来杯咖啡提提神吧 ☕',
      '新的一天，新的搬砖 🧱',
    ],
    weekend: [
      '周末快乐！今天不搬砖 🎊',
      '休息日，尽情享受吧 🌴',
      '关机，出门，晒太阳去 ☀️',
      '周末不设闹钟，这是基本人权 🛏️',
    ]
  };

  // ==================== 状态 ====================
  let settings = {
    startTime: '09:00',
    endTime: '18:00',
    workDays: [1, 2, 3, 4, 5],
    customQuotes: { working:[], soon:[], off:[], before:[], weekend:[] },
  };

  // 从 localStorage 加载
  try {
    const saved = localStorage.getItem('offwork-settings');
    if (saved) {
      const parsed = JSON.parse(saved);
      settings = { ...settings, ...parsed };
    }
  } catch(e) {}

  // 合并默认语录和自定义语录：自定义的排前面
  function getMergedQuotes() {
    const merged = {};
    for (const key of Object.keys(QUOTES)) {
      const custom = settings.customQuotes?.[key] || [];
      merged[key] = custom.length > 0 ? custom : QUOTES[key];
    }
    return merged;
  }

  // ==================== DOM 引用 ====================
  const $ = (id) => document.getElementById(id);
  const countdownEl = $('countdown');
  const progressCircle = $('progressCircle');
  const pulseCircle = $('pulseCircle');
  const progressPercentEl = $('progressPercent');
  const statusBadge = $('statusBadge');
  const quoteEl = $('quote');
  const currentTimeEl = $('currentTime');
  const workStartEl = $('workStartTime');
  const workEndEl = $('workEndTime');
  const settingsOverlay = $('settingsOverlay');
  const inputStart = $('inputStartTime');
  const inputEnd = $('inputEndTime');
  const weekdayGrid = $('weekdayGrid');

  // ==================== 粒子系统 ====================
  const canvas = $('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let particleCount = 60;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor() {
      this.reset();
      this.y = Math.random() * canvas.height;
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = -10;
      this.size = Math.random() * 2.5 + 0.5;
      this.speedY = Math.random() * 0.4 + 0.15;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.opacity = Math.random() * 0.6 + 0.1;
      this.hue = Math.random() < 0.5 ? 260 : 180;
    }
    update() {
      this.y += this.speedY;
      this.x += this.speedX;
      if (this.y > canvas.height + 10) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 70%, 65%, ${this.opacity})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < particleCount; i++) {
    const p = new Particle();
    p.y = Math.random() * canvas.height; // distribute across canvas
    particles.push(p);
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });

    // 连线（近距离粒子之间）
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(108, 92, 231, ${0.08 * (1 - dist / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ==================== 核心逻辑 ====================
  function parseTime(str) {
    const [h, m] = str.split(':').map(Number);
    return { hours: h, minutes: m };
  }

  function getTimeInMinutes(hours, minutes) {
    return hours * 60 + minutes;
  }

  function getStatus() {
    const now = new Date();
    const day = now.getDay(); // 0=Sun, 1=Mon...
    const currentMinutes = getTimeInMinutes(now.getHours(), now.getMinutes());

    if (!settings.workDays.includes(day)) return 'weekend';

    const start = parseTime(settings.startTime);
    const end = parseTime(settings.endTime);
    const startMin = getTimeInMinutes(start.hours, start.minutes);
    const endMin = getTimeInMinutes(end.hours, end.minutes);

    if (currentMinutes < startMin) return 'before';
    if (currentMinutes >= endMin) return 'off';

    const totalWork = endMin - startMin;
    const worked = currentMinutes - startMin;
    const remaining = endMin - currentMinutes;

    if (remaining <= 30) return 'soon';
    return 'working';
  }

  function getRemainingSeconds() {
    const now = new Date();
    const end = parseTime(settings.endTime);
    const endDate = new Date(now);
    endDate.setHours(end.hours, end.minutes, 0, 0);
    return Math.max(0, Math.floor((endDate - now) / 1000));
  }

  function getProgress() {
    const now = new Date();
    const day = now.getDay();
    const currentMinutes = getTimeInMinutes(now.getHours(), now.getMinutes());

    const start = parseTime(settings.startTime);
    const end = parseTime(settings.endTime);
    const startMin = getTimeInMinutes(start.hours, start.minutes);
    const endMin = getTimeInMinutes(end.hours, end.minutes);

    if (!settings.workDays.includes(day)) return 0;
    if (currentMinutes < startMin) return 0;
    if (currentMinutes >= endMin) return 1;

    return (currentMinutes - startMin) / (endMin - startMin);
  }

  function formatCountdown(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function getRandomQuote(status) {
    const quotes = getMergedQuotes();
    const arr = quotes[status] || quotes.working;
    if (!arr.length) return '💪';
    return arr[Math.floor(Math.random() * arr.length)];
  }

  let lastQuote = '';
  function updateQuote(status) {
    const quotes = getMergedQuotes();
    const pool = quotes[status] || quotes.working;
    if (!pool.length) { lastQuote = ''; return '💪'; }
    let q;
    do { q = getRandomQuote(status); } while (q === lastQuote && pool.length > 1);
    lastQuote = q;
    return q;
  }

  let prevStatus = '';

  function updateUI() {
    const now = new Date();
    const status = getStatus();
    const remaining = getRemainingSeconds();
    const progress = getProgress();
    const day = now.getDay();

    // 更新时间显示
    currentTimeEl.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    workStartEl.textContent = settings.startTime;
    workEndEl.textContent = settings.endTime;

    // 状态标签
    statusBadge.className = 'status-badge';
    if (status === 'working') { statusBadge.classList.add('status-working'); statusBadge.textContent = '💼 工作中'; }
    else if (status === 'soon') { statusBadge.classList.add('status-soon'); statusBadge.textContent = '🔥 即将下班'; }
    else if (status === 'off') { statusBadge.classList.add('status-off'); statusBadge.textContent = '🎉 已下班'; }
    else if (status === 'before') { statusBadge.classList.add('status-before'); statusBadge.textContent = '🌅 上班前'; }
    else { statusBadge.classList.add('status-off'); statusBadge.textContent = '🌴 休息日'; }

    // 倒计时
    if (status === 'weekend' || status === 'off' || status === 'before') {
      countdownEl.textContent = status === 'weekend' ? '🎉🎉🎉' : '--:--:--';
      countdownEl.className = 'countdown';
    } else {
      countdownEl.textContent = formatCountdown(remaining);
      if (status === 'soon') countdownEl.className = 'countdown urgent';
      else countdownEl.className = 'countdown soon';
    }

    // 环形进度
    const offset = CIRCUMFERENCE * (1 - progress);
    progressCircle.setAttribute('stroke-dashoffset', offset);
    progressPercentEl.textContent = Math.round(progress * 100) + '%';

    // 脉冲动画
    if (status === 'soon') pulseCircle.classList.add('active');
    else pulseCircle.classList.remove('active');

    // 语录
    if (status !== prevStatus) {
      quoteEl.textContent = updateQuote(status);
      quoteEl.style.opacity = '0';
      setTimeout(() => { quoteEl.style.opacity = '0.8'; }, 100);
    }
    prevStatus = status;

    // 背景动态
    updateBackground(status, now);
  }

  function updateBackground(status, now) {
    const bgGlowTop = document.querySelector('.bg-glow.top');
    const bgGlowBottom = document.querySelector('.bg-glow.bottom');
    const hour = now.getHours();

    if (status === 'weekend') {
      document.body.style.background = '#0a1628';
      bgGlowTop.style.background = 'radial-gradient(circle, #00cec9 0%, transparent 70%)';
      bgGlowBottom.style.background = 'radial-gradient(circle, #fd79a8 0%, transparent 70%)';
    } else if (status === 'off') {
      document.body.style.background = '#0a0a1a';
      bgGlowTop.style.background = 'radial-gradient(circle, #00cec9 0%, transparent 70%)';
      bgGlowBottom.style.background = 'radial-gradient(circle, #a29bfe 0%, transparent 70%)';
    } else if (status === 'soon') {
      document.body.style.background = '#1a0a2e';
      bgGlowTop.style.background = 'radial-gradient(circle, #fd79a8 0%, transparent 70%)';
      bgGlowBottom.style.background = 'radial-gradient(circle, #fdcb6e 0%, transparent 70%)';
    } else {
      // morning: cool blue tone, afternoon: warm purple
      if (hour < 12) {
        document.body.style.background = '#0a0a1a';
        bgGlowTop.style.background = 'radial-gradient(circle, #6c5ce7 0%, transparent 70%)';
        bgGlowBottom.style.background = 'radial-gradient(circle, #74b9ff 0%, transparent 70%)';
      } else {
        document.body.style.background = '#0d0a1a';
        bgGlowTop.style.background = 'radial-gradient(circle, #a29bfe 0%, transparent 70%)';
        bgGlowBottom.style.background = 'radial-gradient(circle, #00cec9 0%, transparent 70%)';
      }
    }
  }

  // ==================== 设置面板 ====================
  let currentQuoteTab = 'working';

  function renderQuoteList() {
    const listEl = $('quoteList');
    const hintEl = $('quoteHint');
    const quotes = settings.customQuotes?.[currentQuoteTab] || [];
    const defaults = QUOTES[currentQuoteTab] || [];

    if (quotes.length === 0) {
      listEl.innerHTML = '<div class="quote-empty">使用默认语录（共 ' + defaults.length + ' 条）</div>';
      hintEl.textContent = '添加自定义语录后将替代默认语录';
    } else {
      listEl.innerHTML = quotes.map((q, i) => `
        <div class="quote-item">
          <span class="quote-text">${escapeHtml(q)}</span>
          <button class="quote-del" data-index="${i}" title="删除">✕</button>
        </div>
      `).join('');
      hintEl.textContent = '自定义 ' + quotes.length + ' 条（随机轮播）';
    }

    // 绑定删除事件
    listEl.querySelectorAll('.quote-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.index);
        settings.customQuotes[currentQuoteTab].splice(idx, 1);
        renderQuoteList();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function openSettings() {
    inputStart.value = settings.startTime;
    inputEnd.value = settings.endTime;
    // 更新工作日按钮状态
    weekdayGrid.querySelectorAll('.weekday-btn').forEach(btn => {
      const day = parseInt(btn.dataset.day);
      btn.classList.toggle('active', settings.workDays.includes(day));
    });
    // 渲染语录列表
    currentQuoteTab = 'working';
    $('quoteTabs').querySelectorAll('.quote-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.status === currentQuoteTab);
    });
    renderQuoteList();
    $('quoteAddInput').value = '';
    settingsOverlay.classList.add('open');
  }

  function closeSettings() {
    settingsOverlay.classList.remove('open');
  }

  function saveSettings() {
    settings.startTime = inputStart.value;
    settings.endTime = inputEnd.value;
    settings.workDays = Array.from(weekdayGrid.querySelectorAll('.weekday-btn.active'))
      .map(btn => parseInt(btn.dataset.day));
    // customQuotes 已经实时在 settings 中更新
    try { localStorage.setItem('offwork-settings', JSON.stringify(settings)); } catch(e) {}
    prevStatus = ''; // 强制刷新语录
    updateUI();
    closeSettings();
  }

  function resetSettings() {
    settings = {
      startTime: '09:00',
      endTime: '18:00',
      workDays: [1,2,3,4,5],
      customQuotes: { working:[], soon:[], off:[], before:[], weekend:[] },
    };
    inputStart.value = '09:00';
    inputEnd.value = '18:00';
    weekdayGrid.querySelectorAll('.weekday-btn').forEach(btn => {
      const day = parseInt(btn.dataset.day);
      btn.classList.toggle('active', [1,2,3,4,5].includes(day));
    });
    currentQuoteTab = 'working';
    $('quoteTabs').querySelectorAll('.quote-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.status === currentQuoteTab);
    });
    renderQuoteList();
    $('quoteAddInput').value = '';
    saveSettings();
  }

  // 事件绑定
  $('settingsBtn').addEventListener('click', openSettings);
  $('settingsClose').addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });
  $('saveBtn').addEventListener('click', saveSettings);
  $('resetBtn').addEventListener('click', resetSettings);

  weekdayGrid.querySelectorAll('.weekday-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('active'));
  });

  // 日签管理：Tab 切换
  $('quoteTabs').querySelectorAll('.quote-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $('quoteTabs').querySelectorAll('.quote-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentQuoteTab = tab.dataset.status;
      renderQuoteList();
      $('quoteAddInput').value = '';
    });
  });

  // 日签管理：添加语录
  function addQuote() {
    const input = $('quoteAddInput');
    const text = input.value.trim();
    if (!text) return;
    if (!settings.customQuotes[currentQuoteTab]) settings.customQuotes[currentQuoteTab] = [];
    settings.customQuotes[currentQuoteTab].push(text);
    input.value = '';
    renderQuoteList();
    input.focus();
  }
  $('quoteAddBtn').addEventListener('click', addQuote);
  $('quoteAddInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addQuote();
  });

  // 键盘快捷键: ESC 关闭设置
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSettings();
  });

  // 防抖：窗口大小变化时更新粒子
  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(resizeCanvas, 150);
  });

  // ==================== 启动 ====================
  updateUI();
  setInterval(updateUI, 1000);

  console.log('%c🏃 下班倒计时已就绪 %c| %cMade with ❤️',
    'font-size:16px;', '', 'color:#a29bfe;');
})();
</script>
</body>
